    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --primary-light: #D1FAE5;
            --secondary: #0284C7;
            --accent-amber: #D97706;
            --bg-color: #F0FDF4;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #4B5563;
            --border-color: #A7F3D0;
            --shadow-card: 0 10px 25px -5px rgba(5, 150, 105, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(5, 150, 105, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(2, 132, 199, 0.08) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 16px 12px 60px;
            color: var(--text-main);
            user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
        }

        /* 頂部導航列 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 8px;
        }
        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: #FFF;
            border: 2px solid var(--primary);
            border-radius: 20px;
            color: var(--primary-dark);
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 3px 0 #047857;
            transition: all 0.15s ease;
        }
        .nav-btn:hover { background: var(--primary-light); transform: translateY(-2px); box-shadow: 0 5px 0 #047857; }
        .nav-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #047857; }
        .unit-badge {
            font-size: 0.85rem;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #FFF;
            box-shadow: 0 2px 8px rgba(5, 150, 105, 0.3);
        }

        /* 英雄區塊 */
        .hero-banner {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px 20px;
            text-align: center;
            border: 3px solid var(--primary);
            box-shadow: var(--shadow-card);
            margin-bottom: 18px;
            position: relative;
        }
        .hero-icon { font-size: 3.5rem; margin-bottom: 6px; display: inline-block; animation: floatIcon 3s ease-in-out infinite; }
        @keyframes floatIcon { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }

        h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            color: var(--primary-dark);
            font-weight: 900;
            margin-bottom: 6px;
        }
        .sub-title { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }

        /* 頁籤切換 */
        .tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .tab-btn {
            flex: 1;
            min-width: 110px;
            padding: 10px 8px;
            background: #FFF;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
            color: #FFF;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.25);
            transform: translateY(-2px);
        }

        /* 內容卡片 */
        .content-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 22px 18px;
            box-shadow: var(--shadow-card);
            margin-bottom: 16px;
        }

        /* 單元卡片網格 */
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .lesson-item-card {
            background: #FFF;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .lesson-item-card:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(5, 150, 105, 0.15);
        }
        .lesson-item-card.active-lesson {
            border-color: var(--primary-dark);
            background: var(--primary-light);
            border-width: 3px;
        }
        .lesson-tag { font-size: 0.75rem; font-weight: 800; color: var(--primary-dark); background: #A7F3D0; padding: 3px 8px; border-radius: 8px; display: inline-block; margin-bottom: 6px; }
        .lesson-name { font-size: 1.1rem; font-weight: 800; color: var(--text-main); margin-bottom: 4px; font-family: 'Noto Serif TC', serif; }

        /* 課堂詳情展示面板 */
        .lesson-detail-panel {
            background: #F0FDF4;
            border: 2px solid var(--border-color);
            border-radius: 18px;
            padding: 18px;
            margin-top: 14px;
            text-align: left;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary-dark);
            margin: 14px 0 8px 0;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 4px;
        }
        .section-header:first-child { margin-top: 0; }

        .info-pill-box {
            background: #FFF;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* 詞彙卡片清單 */
        .vocab-list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }
        .vocab-mini-card {
            background: #FFF;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            text-align: left;
        }
        .v-word { font-weight: 800; font-size: 1.05rem; color: var(--primary-dark); margin-bottom: 4px; }
        .v-mean { font-size: 0.85rem; color: #4B5563; line-height: 1.5; }

        /* 測驗闖關區 */
        .quiz-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px dashed var(--border-color);
        }
        .quiz-hud-stat { font-size: 0.95rem; font-weight: 700; color: var(--text-muted); }
        .quiz-score-val { color: var(--accent-amber); font-size: 1.3rem; font-weight: 900; font-family: 'Fredoka', sans-serif; }

        .question-box {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 16px;
            line-height: 1.6;
            text-align: left;
            background: #F0FDF4;
            padding: 14px;
            border-radius: 14px;
            border-left: 5px solid var(--primary);
        }

        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .opt-btn {
            background: #FFF;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 3px 0 rgba(0,0,0,0.04);
            touch-action: manipulation;
        }
        .opt-btn:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-2px); }
        .opt-btn:active { transform: translateY(2px); }
        .opt-btn.correct { background: #D1FAE5 !important; border-color: #059669 !important; color: #065F46 !important; box-shadow: 0 0 10px rgba(5,150,105,0.3) !important; }
        .opt-btn.wrong { background: #FEE2E2 !important; border-color: #DC2626 !important; color: #991B1B !important; }

        .explanation-box {
            display: none;
            background: #EFF6FF;
            border: 2px solid #93C5FD;
            border-radius: 14px;

// 音效合成引擎
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        gainNode.gain.setValueAtTime(0.25, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(180, now + 0.15);
        gainNode.gain.setValueAtTime(0.25, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
    }
}

let selectedUnitId = 'u1';

// 測驗變數
let quizQuestions = [];
let currentQuizIdx = 0;
let quizScore = 0;
let quizAnswered = false;

// 初始化
document.addEventListener('DOMContentLoaded', () => {
    renderUnitCards();
    renderUnitDetail(selectedUnitId);
    renderVocabList();
});

function switchTab(tabKey) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`tab-${tabKey}`).classList.add('active');

    ['overview', 'vocab', 'quiz'].forEach(k => {
        document.getElementById(`view-${k}`).classList.toggle('hidden', k !== tabKey);
    });
}

function renderUnitCards() {
    const container = document.getElementById('lesson-cards-grid');
    container.innerHTML = CURRICULUM.map(unit => `
        <div class="lesson-item-card ${unit.id === selectedUnitId ? 'active-lesson' : ''}" onclick="selectUnit('${unit.id}')">
            <span class="lesson-tag">${unit.id.toUpperCase()}</span>
            <div class="lesson-name">${unit.title}</div>
            <div style="font-size:0.8rem; color:#4B5563; margin-top:4px;">含 ${unit.topics.length} 個重點課次</div>
        </div>
    `).join('');
}

function selectUnit(id) {
    selectedUnitId = id;
    renderUnitCards();
    renderUnitDetail(id);
}

function renderUnitDetail(id) {
    const unit = CURRICULUM.find(x => x.id === id);
    if (!unit) return;
    const container = document.getElementById('lesson-detail-box');
    container.innerHTML = `
        <h3 style="color:var(--primary-dark); font-size:1.3rem; margin-bottom:12px; font-family:'Noto Serif TC';">
            📖 ${unit.title}
        </h3>
        
        <div class="section-header">🎯 單元重點課次解析</div>
        ${unit.topics.map(t => `
            <div class="info-pill-box" style="border-left:4px solid var(--primary); margin-bottom:12px;">
                <div style="font-weight:800; color:var(--primary-dark); font-size:1.05rem; margin-bottom:4px;">${t.name}</div>
                <p style="color:#1F2937; margin-bottom:8px; line-height:1.6;">${t.summary}</p>
                <div style="background:#F0FDF4; padding:8px 12px; border-radius:8px;">
                    <div style="font-weight:700; font-size:0.85rem; color:#047857; margin-bottom:4px;">🔑 關鍵概念要點：</div>
                    ${t.key_points.map(kp => `<div style="font-size:0.85rem; color:#374151; margin-bottom:2px;">• ${kp}</div>`).join('')}
                </div>
            </div>
        `).join('')}

        <div class="section-header">✍️ 核心社會專有名詞 (${unit.vocab.length} 組)</div>
        <div class="vocab-list-grid">
            ${unit.vocab.map(v => `
                <div class="vocab-mini-card">
                    <div class="v-word">${v.word}</div>
                    <div class="v-mean">${v.meaning}</div>
                </div>
            `).join('')}
        </div>
    `;
}

function renderVocabList() {
    const filter = document.getElementById('vocab-lesson-filter').value;
    const container = document.getElementById('vocab-grid-container');
    let list = [];
    if (filter === 'all') {
        CURRICULUM.forEach(u => { list.push(...u.vocab); });
    } else {
        const u = CURRICULUM.find(x => x.id === filter);
        if (u) list = u.vocab;
    }
    container.innerHTML = list.map(v => `
        <div class="vocab-mini-card">
            <div class="v-word">${v.word}</div>
            <div class="v-mean">${v.meaning}</div>
        </div>
    `).join('');
}

// 測驗邏輯
function startSocialQuiz() {
    quizQuestions = [];
    CURRICULUM.forEach(u => {
        if (u.quiz) quizQuestions.push(...u.quiz);
    });
    quizQuestions = quizQuestions.sort(() => Math.random() - 0.5);
    
    currentQuizIdx = 0;
    quizScore = 0;
    
    document.getElementById('quiz-intro-box').classList.add('hidden');
    document.getElementById('quiz-result-box').classList.add('hidden');
    document.getElementById('quiz-play-box').classList.remove('hidden');
    document.getElementById('quiz-total').textContent = quizQuestions.length;

    loadQuizQuestion();
}

function loadQuizQuestion() {
    quizAnswered = false;
    document.getElementById('btn-next-quiz').classList.add('hidden');
    document.getElementById('quiz-explanation-box').classList.remove('show');
    document.getElementById('quiz-curr').textContent = currentQuizIdx + 1;
    document.getElementById('quiz-score').textContent = quizScore;

    const q = quizQuestions[currentQuizIdx];
    document.getElementById('quiz-question-text').innerHTML = `<b>第 ${currentQuizIdx + 1} 題：</b> ${q.q}`;
    
    let shuffledOpts = [...q.options].sort(() => Math.random() - 0.5);
    const optionsBox = document.getElementById('quiz-options-box');
    optionsBox.innerHTML = shuffledOpts.map(opt => `
        <button class="opt-btn" onclick="checkQuizAnswer('${opt}', this)">${opt}</button>
    `).join('');
}

function checkQuizAnswer(selected, btn) {
    if (quizAnswered) return;
    quizAnswered = true;

    const q = quizQuestions[currentQuizIdx];
    const isRight = (selected === q.ans);
    const expBox = document.getElementById('quiz-explanation-box');

    if (isRight) {
        playSound('correct');
        quizScore += 10;
        btn.classList.add('correct');
    } else {
        playSound('wrong');
        btn.classList.add('wrong');
        document.querySelectorAll('.opt-btn').forEach(b => {
            if (b.textContent.trim() === q.ans) b.classList.add('correct');
        });
    }

    document.getElementById('quiz-score').textContent = quizScore;

    expBox.innerHTML = `
        <div style="font-weight:bold; font-size:1rem; margin-bottom:4px; color:${isRight?'#065F46':'#991B1B'};">
            ${isRight ? '✓ 太棒了！回答正確！' : '✕ 可惜答錯囉！標準答案為：' + q.ans}
        </div>
        <div>💡 <b>觀念解析：</b>${q.steps || ''}</div>
    `;
    expBox.classList.add('show');

    document.getElementById('btn-next-quiz').classList.remove('hidden');
}

function nextQuizQuestion() {
    currentQuizIdx++;
    if (currentQuizIdx >= quizQuestions.length) {
        showQuizResult();
    } else {
        loadQuizQuestion();
    }
}

function showQuizResult() {
    document.getElementById('quiz-play-box').classList.add('hidden');
    document.getElementById('quiz-result-box').classList.remove('hidden');
    document.getElementById('quiz-final-score').textContent = quizScore;

    const correctCount = Math.round(quizScore / 10);
    document.getElementById('quiz-score-detail').textContent = `答對 ${correctCount} 題 / 共 ${quizQuestions.length} 題`;

    if (quizScore >= 80) {
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        document.getElementById('quiz-res-icon').textContent = '👑';
        document.getElementById('quiz-res-title').textContent = '6上社會 狀元王！';
        document.getElementById('quiz-res-desc').textContent = '太厲害了！你對現代科技、法律規範與多元文化瞭若指掌！';
    } else {
        document.getElementById('quiz-res-icon').textContent = '🌏';
        document.getElementById('quiz-res-title').textContent = '測驗完成！';
        document.getElementById('quiz-res-desc').textContent = '多利用單元預習與名詞辭典複習，下次一定能拿 100 分！';
    }
}
