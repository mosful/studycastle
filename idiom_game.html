<script>
// 音效合成引擎
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        gainNode.gain.setValueAtTime(0.25, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(180, now + 0.15);
        gainNode.gain.setValueAtTime(0.25, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
    }
}

        { emoji: "🐂 🎶 🎵", clue: "比喻對不懂道理的人講高深的道理，徒勞無功。", options: ["對牛彈琴", "盲人摸象", "守株待兔", "九牛一毛"], ans: "對牛彈琴", meaning: "對著牛彈奏美妙琴聲，牛根本聽不懂。比喻說話不看對象。" },
        { emoji: "🐸 🕳️ 🌊", clue: "比喻見識狹窄，目光短淺的人。", options: ["井底之蛙", "坐井觀天", "管中窺豹", "盲人摸象"], ans: "井底之蛙", meaning: "住在井底下的青蛙，以為天只有井口那麼大。" },
        { emoji: "🪵 🐦 🐇", clue: "比喻妄想不勞而獲，或死守狹隘經驗不知變通。", options: ["守株待兔", "緣木求魚", "狡兔三窟", "順手牽羊"], ans: "守株待兔", meaning: "守在樹樁旁等著兔子撞死。比喻不知變通與僥倖心理。" },
        { emoji: "👄 🍯 🗡️ 🖤", clue: "形容人外表和藹可親，話說得動聽，內心卻十分險惡。", options: ["口蜜腹劍", "笑裡藏刀", "表裡不一", "陽奉陰違"], ans: "口蜜腹劍", meaning: "嘴上甜如蜜，肚子裡卻藏著刀。形容為人陰險。" }
    ]
};

let currentMode = 'fill';
let currentList = [];
let currentIndex = 0;
let score = 0;
let answered = false;

function showMenu() {
    document.getElementById('screen-menu').classList.remove('hidden');
    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.add('hidden');
}

function startQuiz(mode) {
    currentMode = mode;
    currentList = [...IDIOM_DATA[mode]].sort(() => Math.random() - 0.5);
    currentIndex = 0;
    score = 0;
    
    document.getElementById('screen-menu').classList.add('hidden');
    document.getElementById('screen-quiz').classList.remove('hidden');
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('q-total').textContent = currentList.length;
    
    loadQuestion();
}

function loadQuestion() {
    answered = false;
    document.getElementById('btn-next').classList.add('hidden');
    document.getElementById('explanation-box').classList.remove('show');
    document.getElementById('q-curr').textContent = currentIndex + 1;
    document.getElementById('score-display').textContent = score;

    const item = currentList[currentIndex];
    const contentArea = document.getElementById('quiz-content-area');
    const optionsContainer = document.getElementById('options-container');

    if (currentMode === 'fill') {
        let chars = item.idiom.split('');
        let boxesHtml = chars.map((c, i) => {
            if (i === item.blankIdx) return `<div class="char-box blank" id="blank-char">？</div>`;
            return `<div class="char-box">${c}</div>`;
        }).join('');

        contentArea.innerHTML = `
            <div class="idiom-display">${boxesHtml}</div>
            <div class="hint-box">💡 <b>釋義線索：</b>${item.meaning}</div>
        `;
    } else if (currentMode === 'chain') {
        contentArea.innerHTML = `
            <div style="font-size:1.1rem; color:#78350F; margin-bottom:8px; font-weight:800;">上一句成語：</div>
            <div class="idiom-display">
                ${item.prev.split('').map((c, idx) => `<div class="char-box" style="${idx===3?'background:#FEF3C7;border-color:#D97706;':''}">${c}</div>`).join('')}
            </div>
            <div class="hint-box">🎯 <b>接龍要求：</b>${item.prompt}</div>
        `;
    } else if (currentMode === 'riddle') {
        contentArea.innerHTML = `
            <div style="font-size:3rem; margin:10px 0; letter-spacing:6px;">${item.emoji}</div>
            <div class="hint-box">💡 <b>情境謎題線索：</b>${item.clue}</div>
        `;
    }

    // 渲染選項按鈕
    let shuffledOpts = [...item.options].sort(() => Math.random() - 0.5);
    optionsContainer.innerHTML = shuffledOpts.map(opt => `
        <button class="opt-btn" onclick="checkAnswer('${opt}', this)">${opt}</button>
    `).join('');
}

function checkAnswer(selected, btn) {
    if (answered) return;
    answered = true;

    const item = currentList[currentIndex];
    const isRight = (selected === item.ans);
    const expBox = document.getElementById('explanation-box');

    if (isRight) {
        playSound('correct');
        score += 15;
        btn.classList.add('correct');
        if (currentMode === 'fill') {
            const blankEl = document.getElementById('blank-char');
            if (blankEl) { blankEl.textContent = item.ans; blankEl.classList.remove('blank'); }
        }
    } else {
        playSound('wrong');
        btn.classList.add('wrong');
        // 標記正解按鈕
        document.querySelectorAll('.opt-btn').forEach(b => {
            if (b.textContent.trim() === item.ans) b.classList.add('correct');
        });
    }

    document.getElementById('score-display').textContent = score;

    // 顯示詳解面板
    expBox.innerHTML = `
        <div style="font-weight:bold; font-size:1rem; margin-bottom:4px; color:${isRight?'#065F46':'#991B1B'};">
            ${isRight ? '✓ 太棒了！回答正確！' : '✕ 可惜答錯囉！標準答案為：' + item.ans}
        </div>
        <div>📖 <b>成語解析：</b>${item.meaning || ''}</div>
        ${item.example ? `<div>✍️ <b>造句範例：</b>${item.example}</div>` : ''}
    `;
    expBox.classList.add('show');

    document.getElementById('btn-next').classList.remove('hidden');
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex >= currentList.length) {
        showResult();
    } else {
        loadQuestion();
    }
}

function showResult() {
    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.remove('hidden');
    document.getElementById('final-score').textContent = score;

    const maxScore = currentList.length * 15;
    const correctCount = Math.round(score / 15);
    document.getElementById('res-detail').textContent = `答對 ${correctCount} 題 / 共 ${currentList.length} 題`;

    if (score >= maxScore * 0.8) {
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        document.getElementById('res-icon').textContent = '👑';
        document.getElementById('res-title').textContent = '成語博學大狀元！';
        document.getElementById('res-subtitle').textContent = '你的成語儲備量太驚人了，恭喜獲得最高榮譽！';
    } else {
        document.getElementById('res-icon').textContent = '📜';
        document.getElementById('res-title').textContent = '挑戰完成！';
        document.getElementById('res-subtitle').textContent = '多加練習，成語造詣一定能更上一層樓！';
    }
}

function restartQuiz() {
    startQuiz(currentMode);
}
</script>
