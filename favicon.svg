<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 圓角漸層背景底圖 -->
  <rect width="128" height="128" rx="36" fill="url(#bgGrad)" />

  <!-- 內部裝飾外框 -->
  <rect x="5" y="5" width="118" height="118" rx="31" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.3" />

  <!-- 城堡剪影主體 (精緻幾何向量設計) -->
  <g filter="url(#glow)">
    <!-- 城堡底座與主牆 -->
    <path d="M 28 102 L 100 102 L 100 64 L 86 64 L 86 72 L 76 72 L 76 64 L 52 64 L 52 72 L 42 72 L 42 64 L 28 64 Z" fill="url(#wallGrad)" />

    <!-- 城垛齒 (Battlement) -->
    <rect x="28" y="56" width="10" height="8" fill="url(#wallGrad)" />
    <rect x="44" y="56" width="10" height="8" fill="url(#wallGrad)" />
    <rect x="74" y="56" width="10" height="8" fill="url(#wallGrad)" />
    <rect x="90" y="56" width="10" height="8" fill="url(#wallGrad)" />

    <!-- 中央高塔塔身 -->
    <rect x="48" y="44" width="32" height="28" fill="url(#wallGrad)" />
    <rect x="48" y="38" width="8" height="6" fill="url(#wallGrad)" />
    <rect x="60" y="38" width="8" height="6" fill="url(#wallGrad)" />
    <rect x="72" y="38" width="8" height="6" fill="url(#wallGrad)" />

    <!-- 中央塔頂屋頂 (錐形金黃尖頂) -->
    <polygon points="64,18 44,38 84,38" fill="url(#goldGrad)" />

    <!-- 左右塔尖頂 -->
    <polygon points="33,42 24,56 42,56" fill="url(#goldGrad)" />
    <polygon points="95,42 86,56 104,56" fill="url(#goldGrad)" />

    <!-- 頂端旗幟 (黃金飄揚旗) -->
    <path d="M 64 18 L 64 10 L 76 14 L 64 18 Z" fill="#FDE047" />
    <line x1="64" y1="18" x2="64" y2="8" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />

    <!-- 城堡拱門 (暗色入口) -->
    <path d="M 54 102 L 54 84 C 54 78, 74 78, 74 84 L 74 102 Z" fill="#334155" />
    <path d="M 58 102 L 58 86 C 58 82, 70 82, 70 86 L 70 102 Z" fill="#1E293B" />

    <!-- 塔樓窗戶 -->
    <rect x="61" y="48" width="6" height="9" rx="3" fill="#64748B" />
    <rect x="34" y="74" width="5" height="8" rx="2.5" fill="#94A3B8" />
    <rect x="89" y="74" width="5" height="8" rx="2.5" fill="#94A3B8" />

    <!-- 閃亮星光裝飾 -->
    <polygon points="98,22 100,28 106,30 100,32 98,38 96,32 90,30 96,28" fill="#FDE047" />
    <polygon points="26,26 27,30 31,31 27,32 26,36 25,32 21,31 25,30" fill="#FDE047" opacity="0.85" />
  </g>
</svg>
