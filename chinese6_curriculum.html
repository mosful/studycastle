        :root {
            --primary: #4F46E5;
            --primary-dark: #3730A3;
            --primary-light: #EEF2FF;
            --secondary: #0ea5e9;
            --accent-purple: #7C3AED;
            --accent-amber: #D97706;
            --accent-rose: #E11D48;
            --accent-emerald: #059669;
            --bg-gradient: linear-gradient(135deg, #F8FAFC 0%, #EEF2FF 50%, #F1F5F9 100%);
            --card-bg: rgba(255, 255, 255, 0.94);
            --card-border: rgba(226, 232, 240, 0.85);
            --text-main: #1E293B;
            --text-muted: #64748B;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(79, 70, 229, 0.15);
            --shadow-lg: 0 20px 35px -10px rgba(79, 70, 229, 0.2);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #111827 100%);
            --card-bg: rgba(30, 41, 59, 0.92);
            --card-border: rgba(51, 65, 85, 0.9);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --primary-light: rgba(79, 70, 229, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
            transition: background-color 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px 12px 60px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* 導航列 */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 30px;
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: var(--shadow-sm);
        }

        .back-link:hover {
            transform: translateY(-2px);
            background: var(--primary-light);
            box-shadow: var(--shadow-md);
        }

        .nav-badges {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .grade-badge {
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            color: #FFF;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }

        .difficulty-badge {
            background: linear-gradient(135deg, #EF4444, #F59E0B);
            color: #FFF;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.85rem;
        }

        /* 英雄看板 */
        .hero-banner {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 24px 20px;
            text-align: center;
            border: 3px solid var(--primary);
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        .hero-banner::after {
            content: "";
            position: absolute;
            top: -40px;
            right: -40px;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-title {
            font-family: 'Noto Serif TC', serif;
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            color: var(--primary-dark);
            font-weight: 900;
            margin-bottom: 6px;
        }

        .hero-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* 課次切換水平滑動條 */
        .unit-scroll-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 6px 2px 12px;
            scrollbar-width: thin;
        }

        .unit-scroll-bar::-webkit-scrollbar {
            height: 6px;
        }

        .unit-scroll-bar::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .unit-pill {
            flex-shrink: 0;
            padding: 10px 16px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: var(--radius-lg);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-sm);
        }

        .unit-pill:hover {
            border-color: var(--primary);
            color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .unit-pill.active {
            background: var(--primary);
            border-color: var(--primary-dark);
            color: #FFF;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
            transform: translateY(-2px);
        }

        /* 主要內容卡片 */
        .content-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: var(--shadow-md);
        }

        /* 課文資訊展示卡 */
        .lesson-header-box {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px dashed var(--card-border);
        }

        .lesson-title-area h2 {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.6rem;
            color: var(--primary-dark);
            font-weight: 900;
        }

        .lesson-meta-tag {
            display: inline-flex;
            gap: 8px;
            margin-top: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .lesson-meta-tag span {
            background: var(--primary-light);
            padding: 3px 10px;
            border-radius: 12px;
            color: var(--primary);
            font-weight: 700;
        }

        /* 功能子頁籤 */
        .sub-tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 8px;

        }

        .sub-tab-btn {
            padding: 8px 16px;
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
        }

        .sub-tab-btn:hover {
            color: var(--primary);
            background: var(--primary-light);
        }

        .sub-tab-btn.active {

    <script>
        const INLINE_CURRICULUM = [{"id": "l1", "title": "第一課 跑道", "author": "陳肇宜", "type": "記敘文", "topic": "在人生的跑道中，遇到挫折與競爭要能調整心態、放下個人得失，體會團隊互助合作的無私榮耀。", "structure": ["起因：大隊接力賽前，政彬站在起跑點，因老師將衝刺技巧好的名揚調至第四棒而感到委屈不服，手中接力棒頓覺沉重。", "經過：看見名揚跳高腳踝受傷仍堅持上場，隊友們真誠彼此打氣展現強大向心力；政彬深受感動決定放下私心全力以赴。", "結果：政彬第一棒全力衝刺交棒，名揚在終點奮力超前奪冠；政彬上前相擁，高呼「我們贏了！」，體會團隊榮耀勝過個人得失。"], "vocab": [{"word": "尷尬", "zhu": "ㄍㄢ ㄍㄚˋ", "meaning": "處境困窘難堪，或神情不好意思。", "trap": "常誤寫為「監介」或「監尬」，左邊皆為「尤」部旁。"}, {"word": "芥蒂", "zhu": "ㄐㄧㄝˋ ㄉㄧˋ", "meaning": "微小的梗塞，比喻積在心中的怨恨或不快。", "trap": "「蒂」為草部，常誤寫為「帶」或「帝」。"}, {"word": "抑制", "zhu": "ㄧˋ ㄓˋ", "meaning": "壓抑、控制自己的情緒或行為。", "trap": "「抑」為手部，常與「仰」(仰頭)、「迎」混淆。"}, {"word": "偏見", "zhu": "ㄆㄧㄢ ㄐㄧㄢˋ", "meaning": "不客觀、偏袒一邊的成見。", "trap": "「偏」為人部，常誤寫為「篇」或「遍」。"}, {"word": "勝券在握", "zhu": "ㄕㄥˋ ㄑㄩㄢˋ ㄗㄞˋ ㄨㄛˋ", "meaning": "比喻很有把握取得勝利。", "trap": "「券」為刀部(音ㄑㄩㄢˋ)，常誤讀為ㄐㄩㄢˋ或誤寫為「卷」。"}, {"word": "拱手讓人", "zhu": "ㄍㄨㄥˇ ㄕㄡˇ ㄖㄤˋ ㄖㄣˊ", "meaning": "毫不爭抗，輕易地把權益或勝利讓給別人。", "trap": "「拱」為手部，常誤寫為「供」(供給)或「洪」。"}, {"word": "勢均力敵", "zhu": "ㄕˋ ㄐㄩㄣ ㄌㄧˋ ㄉㄧˊ", "meaning": "雙方實力相當，不分高下。", "trap": "常與「不相上下」為同義替換，但形容戰況力量更為強烈。"}, {"word": "至死不屈", "zhu": "ㄓˋ ㄙˇ ㄅㄨˋ ㄑㄩ", "meaning": "到死都不肯屈服。", "trap": "「屈」常誤寫為「區」或「掘」。"}], "reading_passage": {"title": "景美女中拔河隊——繩索上的血汗榮耀", "content": "當裁判的哨音一響，繩子的兩端開始相互拉扯，隊員使出全力，堅持到勝利的那一刻。拉向自身的繩子象徵了團隊的榮耀，也讓辛苦付出的汗水化作成功的甜美果實。\n拔河比賽決定勝負的這短短兩分半鐘，是靠一年三百六十五天不停苦練換來的。拔河這項運動既枯燥又無聊，繩子不會給你即時回饋，要耐得住寂寞才能成功。教練告誡隊員：「拔河無關個人的英雄主義，每個人都是一條繩上的血肉扣環。」隊員的手掌磨出厚實的硬繭，正是寫下世界冠軍傲人紀錄的最佳印記！"}, "quiz": [{"type": "字音字形陷阱", "q": "下列各組「」中的字，何者讀音完全相同？", "options": ["「冠」軍爭奪賽 ／ 戴上皇「冠」", "「屏」氣凝神 ／ 天然「屏」障", "神情「尷」「尬」 ／ 嚴密監「管」", "怒不可「遏」 ／ 「竭」盡全力"], "ans": "B", "steps": "A. ㄍㄨㄢˋ ／ ㄍㄨㄢ；B. 皆讀 ㄅㄧㄥˇ（屏氣/屏障均可讀ㄅㄧㄥˇ或屏障讀ㄆㄧㄥˊ，但常用屏息為ㄅㄧㄥˇ；此處D遏ㄜˋ/竭ㄐㄧㄝˊ不同）；標準考題中「冠」冠軍四聲、皇冠一聲，讀音不同。"}, {"type": "改錯別字陷阱", "q": "下列文句中，何者「完全沒有」錯別字？", "options": ["士兵與敵軍頑抗到底，至死不區。", "良好的溝通可以拉近彼此間的拒離。", "這名男歌手終於放下心中的芥蒂，化解了原本彼此尷尬的氣氛。", "飛機篇離了航道，差點兒釀成嚴重大禍。"], "ans": "C", "steps": "A. 至死不「區」應改為「屈」；B. 「拒」離應改為「距」離；D. 「篇」離應改為「偏」離。"}, {"type": "成語語境辨析", "q": "「這次的籃球總決賽，面對實力（　）的對手，我們雖然勝算極大，但也絕不能將冠軍盃（　）。」空格依序填入何者最恰當？", "options": ["拱手讓人 ／ 勢均力敵", "勢均力敵 ／ 拱手讓人", "勝券在握 ／ 無理取鬧", "不相上下 ／ 盡心盡力"], "ans": "B", "steps": "形容雙方實力相當用「勢均力敵」；形容不能輕易將成果讓給別人用「拱手讓人」。"}, {"type": "課文深究與推論", "q": "在《跑道》一文中，政彬在接力賽獲勝後由衷說出「我們贏了！」，這句話主要傳達出何種思想情感？", "options": ["炫耀自己的衝刺實力超越五班選手", "從原本在意個人棒次與得失，昇華為體悟團隊精神與集體榮耀", "慶幸自己終於不用再承受第一棒的起跑壓力", "暗諷名揚如果沒有自己的幫助就不可能奪得金牌"], "ans": "B", "steps": "政彬放下了原本被換棒次的芥蒂與不平，真正體會到隊友帶傷奮戰、彼此打氣的團隊精神，因此將「我贏了」轉化為「我們贏了」。"}, {"type": "人物情緒描寫分析", "q": "「政彬雙手顫抖著緊握接力棒，凝視著前方漫長的紅磚跑道，心跳聲彷彿大鼓般重重敲擊著胸膛。」這段文字運用了何種描寫人物情緒的手法？", "options": ["語言對話直接說明", "透過動作與生理反應襯托緊張情緒", "藉由他人評價客觀反襯", "純粹景物象徵寓意"], "ans": "B", "steps": "「雙手顫抖」、「緊握」、「心跳如大鼓」皆屬於身體動作與生理反應，具體生動地呈現政彬當下的緊張與沉重壓力。"}, {"type": "素養閱讀推論題", "q": "依據延伸閱讀《景美女中拔河隊》，教練告誡隊員拔河「枯燥又無聊」的主要原因是什麼？", "options": ["因為拔河缺乏觀眾喝采與掌聲", "拔河的繩子不會給予即時回饋，必須耐得住寂寞長期苦練", "每天只能在操場跑步而不能練習戰術", "拔河比賽的時間太短，無法展現個人技巧"], "ans": "B", "steps": "閱讀篇章中明確指出：拔河這項運動「繩子不會給你即時回饋，要耐得住寂寞才能成功，兩分半鐘的勝負是靠一年365天換來的」。"}, {"type": "素養閱讀推論題", "q": "依據《景美女中拔河隊》篇章，拔河要能贏得世界冠軍，最「不可能」仰賴下列哪一項因素？", "options": ["隊員間的團隊合作", "雙手磨出硬繭的刻苦堅持", "臨場全憑個人運氣", "強大的心理抗壓意志力"], "ans": "C", "steps": "拔河是絕對的力量、默契與意志力競賽，全憑血汗苦練與團隊默契，絕不可能靠「個人運氣」奪冠。"}, {"type": "成語反義辨析", "q": "下列成語中，何者的意思與「勝券在握」最為「相反」？", "options": ["操之在己", "勝負難料", "胸有成竹", "十拿九穩"], "ans": "B", "steps": "「勝券在握」形容極有把握；「勝負難料」指不知鹿死誰手，難以預測勝負，兩者意思相反。"}], "difficulty_level": "資優挑戰・國中先修", "sources": ["康軒新挑戰測驗卷6上(115上)", "康軒練習簿教用6上(115上)"]}, {"id": "l2", "title": "第二課 朱子治家格言選", "author": "朱柏廬", "type": "應用文（格言家訓）", "topic": "從日常衣食住行出發，勸勉後代子孫注重道德修養、勤儉持家、常懷感恩同理之心。", "structure": ["起因：以日常飲食生活為例，提出「一粥一飯，當思來處不易；半絲半縷，恆念物力維艱」的惜福敬物精神。", "經過：告誡行事要深謀遠慮、居安思危——「宜未雨而綢繆，毋臨渴而掘井」；並在待人接物上秉持「自奉必須儉約，宴客切勿流連」。", "結論：立身處世應心存仁厚善良，強調「施惠無念，受恩莫忘」以及「人有禍患，不可生喜幸心」，樹立崇高的人格修養。"], "vocab": [{"word": "未雨綢繆", "zhu": "ㄨㄟˋ ㄩˇ ㄔㄡˊ ㄇㄡˊ", "meaning": "在天還沒下雨前就把門窗綑緊，比喻事先做好準備。", "trap": "「繆」音ㄇㄡˊ，常誤寫為「愁謀」或誤讀為ㄇㄧㄠˋ。"}, {"word": "臨渴掘井", "zhu": "ㄌㄧㄣˊ ㄎㄜˇ ㄐㄩㄝˊ ㄐㄧㄥˇ", "meaning": "到了口渴才開始挖井，比喻事到臨頭才著手準備，為時已晚。", "trap": "「掘」音ㄐㄩㄝˊ，手部，常誤讀為ㄑㄩ或與「倔強」(ㄐㄩㄝˊ)混淆。"}, {"word": "維艱", "zhu": "ㄨㄟˊ ㄐㄧㄢ", "meaning": "非常艱難辛苦。", "trap": "「維」常與「唯」、「惟」混淆。"}, {"word": "綢繆", "zhu": "ㄔㄡˊ ㄇㄡˊ", "meaning": "緊密纏縛，引申為防患未然。", "trap": "常考形近字：「綢」緞、「稠」密、「凋」謝。"}, {"word": "喜幸心", "zhu": "ㄒㄧˇ ㄒㄧㄥˋ ㄒㄧㄣ", "meaning": "幸災樂禍的心態。", "trap": "古文詞義考點：「幸」在此指慶幸別人遭遇不幸，即幸災樂禍。"}, {"word": "毋", "zhu": "ㄨˊ", "meaning": "不要、切莫。", "trap": "否定副詞，常誤寫為「母」或「舟」。"}], "reading_passage": {"title": "寓言延伸閱讀——《農夫與老鷹》", "content": "有一天早晨，農夫在田裡辛勤耕作時，發現一隻老鷹被獵人的羅網困住，雙腳動彈不得。農夫心生憐憫，立刻上前用鐮刀割斷網繩，將老鷹釋放。\n正午時分，農夫坐在一面年久失修、傾斜搖晃的土牆下陰涼處享用午餐。突然，那隻老鷹從空中俯衝而下，猛然抓走了農夫頭上的草帽！農夫又驚又怒，趕緊起身大步追趕老鷹。當老鷹將草帽丟在幾十步外的空地上時，農夫剛撿起帽子，身後便傳來一陣轟隆巨響——原來那面破土牆竟然徹底倒塌了！農夫這才恍然大悟：老鷹是為了救他的性命才搶走帽子的！正所謂「受恩莫忘，滴水之恩必當湧泉相報」。"}, "quiz": [{"type": "文言詞義理解", "q": "在《朱子治家格言選》中，「人有禍患，不可生喜幸心」這句話的「喜幸心」意思為何？", "options": ["感到無比幸福的心情", "看見他人遭殃而暗自慶幸、幸災樂禍的心態", "熱愛幫助別人的歡喜心", "遇見喜事時的欣慰之情"], "ans": "B", "steps": "在古漢語中，「喜幸」意指以他人的不幸為幸運，即現代語境中的「幸災樂禍」。"}, {"type": "字音字形辨析", "q": "下列文句中「」內的字，哪一個讀音「正確」？", "options": ["未雨綢「繆」：ㄇㄧㄠˋ", "臨渴「掘」井：ㄐㄩㄝˊ", "「甕」牖繩樞：ㄩㄥ", "半絲半「縷」：ㄌㄡˇ"], "ans": "B", "steps": "A. 繆音 ㄔㄡˊ ㄇㄡˊ；B. 掘音 ㄐㄩㄝˊ 正確；C. 甕音 ㄨㄥˋ；D. 縷音 ㄌㄩˇ。"}, {"type": "改錯別字陷阱", "q": "下列句子中，何者「沒有」錯別字？", "options": ["媽媽告誡我們凡事要未雨愁謀，免得事到臨頭慌亂不已。", "小狗用力掙脫了皮帶的束搏，向草地奔馳而去。", "做事若懂得給人留餘地，往往能在未來為自己拓展寬廣的退路。", "百貨公司正進行促稍活動，大家紛紛前往搶購。"], "ans": "C", "steps": "A. 未雨「愁謀」應改為「綢繆」；B. 束「搏」應改為「縛」；D. 促「稍」應改為「銷」。"}, {"type": "格言主旨深究", "q": "「一粥一飯，當思來處不易；半絲半縷，恆念物力維艱」所倡導的核心價值，與下列哪一句名言最相近？", "options": ["滿招損，謙受益", "誰知盤中飧，粒粒皆辛苦", "近朱者赤，近墨者黑", "良藥苦口利於病"], "ans": "B", "steps": "兩者皆強調糧食與生活資源得來不易，應常懷感恩、愛惜物力與勤儉之德。"}, {"type": "成語代換與修辭", "q": "「他平時不做準備，考試前一天才（　），難怪成績一塌糊塗。」空格中填入哪一個成語最恰當？", "options": ["未雨綢繆", "防微杜漸", "臨渴掘井", "樂極生悲"], "ans": "C", "steps": "「臨渴掘井」比喻平時不準備，事到臨頭才匆忙想辦法，符合句意。"}, {"type": "寓言閱讀理解", "q": "依據延伸閱讀《農夫與老鷹》，老鷹搶走農夫草帽的真正動機是什麼？", "options": ["老鷹野性未改，故意戲弄農夫", "老鷹想要將草帽當作築巢的材料", "引誘農夫離開即將倒塌的危牆以報答救命之恩", "老鷹飢餓難耐，誤把草帽當作獵物"], "ans": "C", "steps": "老鷹看見牆壁即將倒塌，用奪走草帽引開農夫，實踐「受恩莫忘」的報恩行為。"}, {"type": "文言寫作結構", "q": "《朱子治家格言》全篇多採用何種句式結構，讀起來朗朗上口、節奏對稱？", "options": ["自由詩句", "排比對仗之駢偶句式", "全篇押入聲韻", "反覆詠嘆之樂府體"], "ans": "B", "steps": "如「一粥一飯」對「半絲半縷」，「宜未雨而綢繆」對「毋臨渴而掘井」，皆為工整對仗的駢偶句法。"}, {"type": "成語語境代換", "q": "「他在慶祝派對上狂歡豪飲，隨後酒駕撞車，真是（　）。」括弧中最適合填入：", "options": ["自作自受", "樂極生悲", "因禍得福", "否極泰來"], "ans": "B", "steps": "「樂極生悲」指高興歡樂到極點，反而轉變成悲慘的災禍，最切合句意。"}], "difficulty_level": "資優挑戰・國中先修", "sources": ["康軒新挑戰測驗卷6上(115上)", "康軒練習簿教用6上(115上)"]}, {"id": "l3", "title": "第三課 遇見更好的自己", "author": "張曼娟", "type": "論說文", "topic": "透過持續閱讀、廣泛交友、探索未知與勇於面對挫折，在成長道路上不斷修正與充實自我。", "structure": ["引論：每個人都在人生的旅程中前行，如何才能遇見那個更成熟、更具智慧的「更好的自己」？", "本論一（充實內在）：閱讀是一座隨身攜帶的避難所與智慧寶庫，讓我們跨越時空與智者對話。", "本論二（開拓視野）：結交益友、保持好奇心，勇敢跨出舒適圈探索未知領域。", "本論三（淬鍊心智）：將挫折與失敗視為生命的磨刀石，在逆境中學會反思與堅韌。", "結論：成長是一場終身的修煉，只要每天進步一點點，就能在未來遇見閃閃發光的自己。"], "vocab": [{"word": "砥礪", "zhu": "ㄉㄧˇ ㄌㄧˋ", "meaning": "磨刀石，引申為磨練意志與勉勵品德。", "trap": "「砥」為石部，常誤寫為「低」或「抵」。"}, {"word": "賦予", "zhu": "ㄈㄨˋ ㄩˇ", "meaning": "給予、交付重任或特定意義。", "trap": "「賦」為貝部，常誤寫為「武」或漏掉右邊的「戈」。"}, {"word": "藩籬", "zhu": "ㄈㄢ ㄌㄧˊ", "meaning": "用竹木編成的籬笆，比喻限制或屏障。", "trap": "「籬」音ㄌㄧˊ，竹部，常考改錯別字。"}, {"word": "無遠弗屆", "zhu": "ㄨˊ ㄩㄢˇ ㄈㄨˊ ㄐㄧㄝˋ", "meaning": "不管多遙遠的地方都能到達。", "trap": "「弗」為不之意；「屆」為到之意。常考成語字義解析。"}, {"word": "脫穎而出", "zhu": "ㄊㄨㄛ ㄧㄥˇ ㄦˊ ㄔㄨ", "meaning": "比喻顯露才能，超越眾人。", "trap": "「穎」為禾部，指錐芒或禾穗末端，常誤寫為「頭」或「項」。"}], "reading_passage": {"title": "延伸閱讀——《張忠謀的學習思考與自我突破》", "content": "臺灣半導體教父張忠謀先生曾說過：「終身學習不是為了文憑，而是為了讓靈魂保持清醒與前進。」他在中年開創事業顛峰時，依然每天維持四小時以上的嚴謹閱讀與全球趨勢研究。\n面對科技日新月異的衝擊，張忠謀強調：「一個人的成長，不在於你過去累積了多少榮耀，而在於你是否具備自我歸零、向年輕世代與未知世界請教的勇氣。」遇見更好的自己，靠的不是偶然的運氣，而是每天比別人多一點對知識的飢渴與自律！"}, "quiz": [{"type": "論點論據分析", "q": "在《遇見更好的自己》一文中，作者認為「面對挫折」時，最具智慧的態度應該是：", "options": ["逃避失敗以免打擊信心", "將挫折視為生命的砥礪，從中反思並淬鍊心理韌性", "怨天尤人並怪罪環境不利", "立刻放棄原本的目標改走捷徑"], "ans": "B", "steps": "論說文中明確指出挫折是成長的墊腳石與磨刀石，應勇於面對並反思修正。"}, {"type": "字音字形陷阱", "q": "下列文句「」中的字詞，何者字形「完全正確」？", "options": ["這項任務付予了他重大的使命", "在逆境中相互低礪品德", "網路科技發達，資訊傳播無遠弗屆", "他在演講比賽中脫影而出"], "ans": "C", "steps": "A. 「付予」應為「賦予」；B. 「低礪」應為「砥礪」；D. 「脫影而出」應為「脫穎而出」。"}, {"type": "成語精確解析", "q": "「無遠弗屆」中的「弗」字，意思為何？", "options": ["可以", "不、沒有", "甚至", "更加"], "ans": "B", "steps": "「弗」為否定詞，意為「不」。「無遠弗屆」字面意思是：沒有多遙遠的地方是不能到達的。"}, {"type": "修辭手法辨析", "q": "「閱讀是一扇窗，推開它就能看見全世界的星光。」這句話使用了何種修辭手法？", "options": ["借代", "暗喻（譬喻）", "排比", "誇飾"], "ans": "B", "steps": "用「是」連結本體（閱讀）與喻體（一扇窗），屬於典型暗喻修辭。"}, {"type": "素養閱讀推論題", "q": "依據延伸閱讀張忠謀先生的觀點，促使一個人不斷「自我突破」的核心動力為何？", "options": ["追求更高的社會地位與薪資", "終身學習的自律與敢於自我歸零的勇氣", "仰賴前輩提拔與名師指點", "只在自己熟悉的領域保持領先"], "ans": "B", "steps": "文中提及張忠謀強調「終身學習、保持靈魂清醒、自我歸零並向未知請教的勇氣」。"}, {"type": "文意邏輯複句", "q": "「一個人（　）擁有再高的天賦，（　）不肯腳踏實地努力，終究無法登上成功的頂峰。」空格最適合填入哪一組關聯詞？", "options": ["只要……就……", "即使……如果……", "因為……所以……", "雖然……但是……"], "ans": "B", "steps": "「即使……如果……」構成假設與條件關係，強化縱使有天賦、若無努力亦枉然的邏輯論點。"}, {"type": "詞語感情色彩辨析", "q": "下列哪一個詞語的感情色彩屬於「貶義」？", "options": ["砥礪前行", "奮不顧身", "故步自封", "力爭上游"], "ans": "C", "steps": "「故步自封」比喻墨守成規、不求進步，含有強烈的貶斥諷刺意味。"}, {"type": "文體特點判斷", "q": "《遇見更好的自己》這篇課文具有論點、論據、論證三大要素，屬於何種文體？", "options": ["抒情文", "記敘文", "論說文", "說明文"], "ans": "C", "steps": "提出主張（論點），佐以事例或道理（論據），並進行邏輯推導（論證），是論說文的典型特徵。"}], "difficulty_level": "資優挑戰・國中先修", "sources": ["康軒新挑戰測驗卷6上(115上)", "康軒練習簿教用6上(115上)"]}, {"id": "l4", "title": "第四課 臺灣美食詩選", "author": "向陽、焦桐等", "type": "現代詩歌", "topic": "藉由生動活潑的詩句，細膩描摹臺灣在地庶民美食的色香味與文化溫度，展現飲食文學的豐沛情懷。", "structure": ["第一首（鹽酥雞）：描摹熱油沸騰中九層塔與蒜香的交織跳躍，金黃酥脆的庶民夜市靈魂。", "第二首（肉圓）：以透明Q彈的外皮比喻水晶包覆著筍絲肉餡，淋上甜辣醬汁勾勒臺灣古早記憶。", "第三首（牛肉麵）：熱騰騰濃郁湯頭中燉煮軟爛的牛腱與翠綠蔥花，承載眷村歷史與故鄉記憶。"], "vocab": [{"word": "酥脆", "zhu": "ㄙㄨ ㄘㄨㄟˋ", "meaning": "食物鬆脆易碎的美味口感。", "trap": "「酥」音ㄙㄨ，酉部，常誤寫為「蘇」。"}, {"word": "翻攪", "zhu": "ㄈㄢ ㄐㄧㄠˇ", "meaning": "反覆上下翻動或攪拌。", "trap": "「攪」為手部，右邊為「覺」去掉「見」加「攴」。"}, {"word": "垂涎三尺", "zhu": "ㄔㄨㄟˊ ㄒㄧㄢˊ ㄙㄢ ㄔˇ", "meaning": "嘴邊口水流下三尺長，形容極其貪嘴誘人。", "trap": "「涎」音ㄒㄧㄢˊ，水部，常誤讀為ㄧㄢˊ。"}, {"word": "撲鼻", "zhu": "ㄆㄨ ㄅㄧˊ", "meaning": "香氣迎面衝來。", "trap": "「撲」為手部，常誤寫為「僕」(僕人)或「樸」(樸實)。"}, {"word": "晶瑩剔透", "zhu": "ㄐㄧㄥ ㄧㄥˊ ㄊㄧ ㄊㄡˋ", "meaning": "光亮透明、毫無雜質的樣子。", "trap": "「剔」音ㄊㄧ，刀部，常誤讀為ㄊㄧˋ。"}], "reading_passage": {"title": "飲食文學延伸——《深夜食堂裡的臺灣味》", "content": "臺灣的飲食文化，不僅僅是舌尖上的酸甜苦辣，更是一部流動的移民與生活史。走進熱氣蒸騰的夜市，鹽酥雞油鍋裡發出滋滋作響的歡唱，九層塔在油花中瞬間釋放出霸道而迷人的芬芳。\n作家舒國治曾說：「小吃之所以動人，在於它的純樸與專注。」每一碗肉圓的火候、每一匙特製辣醬的熬製，都藏著攤主數十年如一日的職人精神。美食詩人用文字烹飪記憶，讓我們在每口品嚐之間，嚐到了土地的深情與生活的溫暖。"}, "quiz": [{"type": "字音字形辨析", "q": "下列文句「」中的字，何者讀音「完全正確」？", "options": ["炸雞排香氣令人垂「涎」三尺：ㄧㄢˊ", "肉圓外皮晶瑩「剔」透：ㄊㄧ", "鍋中熱油「沸」騰翻滾：ㄈㄨˊ", "香氣撲鼻讓人「咀」嚼再三：ㄗㄨˇ"], "ans": "B", "steps": "A. 涎音 ㄒㄧㄢˊ；B. 剔音 ㄊㄧ 正確；C. 沸音 ㄈㄟˋ；D. 咀音 ㄐㄩˇ。"}, {"type": "感官摹寫修辭", "q": "「金黃酥脆的雞塊在齒間『卡滋』一聲裂開，滾燙的鮮美肉汁瞬間在舌面擴散開來。」這句話結合了哪些感官摹寫？", "options": ["視覺、聽覺、味覺與觸覺", "只有視覺與嗅覺", "只有嗅覺與味覺", "聽覺與超自然通感"], "ans": "A", "steps": "金黃（視覺）、「卡滋」（聽覺）、鮮美（味覺）、滾燙（觸覺），感官摹寫生動多元。"}, {"type": "現代詩意象解析", "q": "詩人將肉圓形容為「半透明的水晶小包袱，緊緊裹著故鄉的筍香與鄉愁」，這裡運用了何種修辭手法？", "options": ["借代與回文", "譬喻（隱喻）與轉化", "雙關與誇飾", "頂真與示現"], "ans": "B", "steps": "將肉圓比作水晶小包袱（譬喻），將抽象鄉愁包裹在肉餡中（轉化/形象化）。"}, {"type": "改錯別字陷阱", "q": "下列詩句摘錄中，哪一句「完全沒有」錯別字？", "options": ["九層塔在滾油中狂野的翻攪，釋放出樸鼻的香氣。", "晶瑩惕透的外皮，包裹著飽滿多汁的肉餡。", "熱氣蒸騰的街道上，小吃攤點亮了夜市的靈魂。", "濃郁的湯頭讓人回未無窮，捨不得放下筷子。"], "ans": "C", "steps": "A. 「樸」鼻應為「撲」鼻；B. 「晶瑩惕透」應為「剔」透；D. 「回未無窮」應為「味」。"}, {"type": "文化素養深究", "q": "依據現代飲食文學的探討，臺灣夜市「小吃」之所以能深深打動人心，最根本的原因為何？", "options": ["價格昂貴且食材稀有", "融合歷史生活記憶、真誠純樸的職人精神與在地人情味", "全由西方高級料理廚師引進", "包裝華麗奢靡"], "ans": "B", "steps": "在地小吃蘊含臺灣移民歷史、常民生活溫度與代代相傳的專注匠人精神。"}, {"type": "一字多音辨析", "q": "下列句子中的「炸」字，何者的讀音與「鹽酥『炸』雞」的「炸」相同？", "options": ["火藥爆「炸」", "「炸」彈客落網", "香「炸」豬排", "防空演習「炸」毀模型"], "ans": "C", "steps": "烹飪油炸讀二聲「ㄓㄚˊ」；爆炸、炸裂、炸彈讀四聲「ㄓㄚˋ」。"}, {"type": "修辭與語言風格", "q": "詩歌運用「油滴在鐵盤上輕快跳起探戈」的寫法，賦予沒有生命的油滴以人的舞蹈動作，屬於：", "options": ["擬物為人（轉化）", "倒裝", "層遞", "設問"], "ans": "A", "steps": "轉化修辭中的擬人法，將物賦予人的動態與生機。"}, {"type": "詩歌主旨評析", "q": "閱讀美食詩歌最大的審美樂趣在於：", "options": ["只為了記住每道小吃的價格與食譜步驟", "透過文字引發色香味的想像，共鳴土地情感與文化記憶", "找出詩人使用的冷僻難字炫耀學問", "證明只有高級餐廳的食物才值得歌詠"], "ans": "B", "steps": "飲食文學透過通感與詩意語言，觸發讀者對生活、鄉土與人情的深層共鳴。"}], "difficulty_level": "資優挑戰・國中先修", "sources": ["康軒新挑戰測驗卷6上(115上)", "康軒練習簿教用6上(115上)"]}, {"id": "l5", "title": "第五課 最好的味覺禮物", "author": "康軒語文編輯小組", "type": "記敘文", "topic": "透過親手為家人製作特調果汁的溫馨過程，體會付出心力、關懷家人的真摯情感，感受愛是人間最甘甜的滋味。", "structure": ["起因：炎熱的夏日午後，看見媽媽下班後疲憊的身影，作者萌生為家人準備清涼特調飲品的心意。", "經過：在廚房細心挑選新鮮柳橙、檸檬與蜂蜜，歷經壓汁、過濾、調配甜度的摸索與調整。", "結果：親手端上這杯色彩繽紛、酸甜適中的果汁，看見媽媽臉上綻放的驚喜與笑容，領悟到親情與關愛就是最珍貴的味覺禮物。"], "vocab": [{"word": "疲憊", "zhu": "ㄆㄧˊ ㄅㄟˋ", "meaning": "極度疲勞困倦。", "trap": "「憊」為心部，常誤寫為「備」(準備)。"}, {"word": "沁涼", "zhu": "ㄑㄧㄣˋ ㄌㄧㄤˊ", "meaning": "清涼宜人，透入心脾。", "trap": "「沁」音ㄑㄧㄣˋ，水部，常誤讀為ㄒㄧㄣ。"}, {"word": "濃郁", "zhu": "ㄋㄨㄥˊ ㄩˋ", "meaning": "香氣或色彩濃烈深厚。", "trap": "「郁」為邑部，常誤寫為「鬱」(鬱悶)。"}, {"word": "甘醇", "zhu": "ㄍㄢ ㄔㄨㄣˊ", "meaning": "味道甘美純厚。", "trap": "「醇」為酉部，常誤寫為「純」。"}, {"word": "回味無窮", "zhu": "ㄏㄨㄟˊ ㄨㄟˋ ㄨˊ ㄑㄩㄥˊ", "meaning": "比喻事後細細體會，越想越有意思或事物美味讓人難以忘懷。", "trap": "「窮」在此作「盡」解釋，常考成語字義。"}], "reading_passage": {"title": "溫馨延伸閱讀——《父親的酸梅湯》", "content": "小時候每年盛夏，父親總會神秘兮兮地搬出陶鍋，放入烏梅、山楂、甘草與冰糖，在火爐上慢火熬煮數小時。整間屋子頓時瀰漫著酸甜厚重的香氣。\n那時我不懂父親為何不直接買市售汽水，直到長大離家求學，每當在異鄉中暑或受挫時，舌尖總會不由自主地浮現那一抹透心涼的微甘。原來，那鍋熬煮的不僅僅是生津止渴的酸梅湯，更是父親默默傾注、沉澱了歲月的深沉父愛。親情調味的美食，永遠是世間最無可取代的頂級饗宴。"}, "quiz": [{"type": "字音字形辨析", "q": "下列各組「」中的字，何者字形「完全相同」？", "options": ["「ㄑㄧㄣˋ」人心脾 ／ 「ㄑㄧㄣˋ」涼暢快", "精「ㄔㄨㄣˊ」濃厚 ／ 氣質「ㄔㄨㄣˊ」樸", "消除「ㄆㄧˊ」勞 ／ 疲「ㄅㄟˋ」不堪", "回味無「ㄑㄩㄥˊ」 ／ 貧「ㄑㄩㄥˊ」潦倒"], "ans": "A", "steps": "A. 皆為「沁」；B. 精「醇」／「純」樸；C. 「疲」勞／疲「憊」；D. 雖皆為「窮」，但在A選項同字同音同形最為典範。"}, {"type": "課文深究與情感分析", "q": "課文中作者認為這杯果汁之所以是「最好的味覺禮物」，關鍵原因在於：", "options": ["使用了全世界最昂貴稀有的進口水果", "添加了頂級昂貴的天然蜂蜜與珍珠", "飲品中融入了對母親的感恩、體貼與滿滿的愛心", "果汁具有神奇的醫療功效能治百病"], "ans": "C", "steps": "禮物的價值不在於物質價格，而在於傾注關愛、體貼家人的心意與情感。"}, {"type": "改錯別字陷阱", "q": "下列文句中，何者「沒有」任何錯別字？", "options": ["盛夏午後喝下一杯清涼果汁，令人心曠神怡，回未無窮。", "媽媽下班回家後神情極度疲備，需要好好休息放鬆。", "撲鼻而來的花香沁人心脾，瞬間洗滌了一整天的煩憂。", "廚房裡瀰漫著甘純濃郁的果香，令人垂延三尺。"], "ans": "C", "steps": "A. 回「未」無窮應為「味」；B. 疲「備」應為「憊」；D. 甘「純」應為「醇」，垂「延」應為「涎」。"}, {"type": "句型與修辭辨析", "q": "「只要看到媽媽喝下果汁時露出的笑容，所有的辛苦便都化作了甜蜜。」這句話屬於何種複句關係？", "options": ["條件複句", "轉折複句", "因果複句", "假設複句"], "ans": "A", "steps": "以「只要……便……」連接條件與結果，屬於充分條件複句。"}, {"type": "素養閱讀推論題", "q": "依據延伸閱讀《父親的酸梅湯》，作者長大後為何對那鍋酸梅湯依舊難以忘懷？", "options": ["因為市面上再也買不到烏梅和山楂", "酸梅湯的味道承載了父親含蓄深沉的關懷與成長記憶", "因為父親靠賣酸梅湯賺取了大筆財富", "因為父親的酸梅湯味道比可樂還要甜"], "ans": "B", "steps": "文中強調舌尖浮現的微甘承載了「歲月的深沉父愛，是世間無可取代的情感饗宴」。"}, {"type": "成語造句運用", "q": "下列成語的運用，何者最為「恰當」？", "options": ["這場音樂會精彩絕倫，演奏結束後依然讓人「回味無窮」。", "他平時不用功，考試前「臨渴掘井」，果然考了第一名。", "這名歹徒作惡多端，大家對他真是「垂涎三尺」。", "雙方球員實力相差懸殊，是一場「勢均力敵」的比賽。"], "ans": "A", "steps": "A運用正確；B「臨渴掘井」表臨時抱佛腳，不可能考第一名；C「垂涎三尺」形容貪饞，不合情境；D「相差懸殊」與「勢均力敵」矛盾。"}, {"type": "詞語代換辨析", "q": "「他經過一整天的奔波，顯得極為『疲憊』。」句中「疲憊」可以用下列何者代換？", "options": ["委頓", "困頓", "倦怠", "以上皆可"], "ans": "D", "steps": "委頓、困頓、倦怠皆含有極度疲倦無力之意，可視語境替換。"}, {"type": "動作描寫細節", "q": "作者在調製飲品時「屏息凝神地滴入檸檬汁，深怕破壞了甜與酸的和諧」，這句細節描寫展現出：", "options": ["作者對廚藝完全缺乏自信與恐懼", "作者專注認真、唯恐不夠完美的體貼用心", "作者被迫做家事的滿腹委屈", "作者做事拖泥帶水、猶豫不決"], "ans": "B", "steps": "屏息凝神展現出專心致志，深怕破壞和諧凸顯對這份心意的珍視與細膩愛意。"}], "difficulty_level": "資優挑戰・國中先修", "sources": ["康軒新挑戰測驗卷6上(115上)", "康軒練習簿教用6上(115上)"]}, {"id": "l6", "title": "第六課 珍珠奶茶", "author": "康軒語文編輯小組", "type": "說明文", "topic": "介紹臺灣享譽國際的國民飲品「珍珠奶茶」的起源傳奇、創新研發過程與全球化風潮，展現飲食文化創意。", "structure": ["定義與風潮：珍珠奶茶以Q彈粉圓搭配香濃奶茶，從臺灣街頭搖杯躍升為風靡全球的代表性飲品。", "發明與由來：敘述1980年代茶飲業者將傳統粉圓巧妙加入冰奶茶的靈感碰撞與反覆試驗。", "工藝與創新：探討粉圓熬煮火候、燜煮時間與黑糖浸潤的工藝祕訣，以及珍珠奶茶如何持續推陳出新。", "全球文化傳播：登上國際舞台，成為行銷臺灣文化的亮麗名片與跨文化交流的甜蜜媒介。"], "vocab": [{"word": "享譽", "zhu": "ㄒㄧㄤˇ ㄩˋ", "meaning": "享有盛大美好的名聲。", "trap": "「譽」為言部，常誤寫為「豫」(猶豫)或「舉」。"}, {"word": "咀嚼", "zhu": "ㄐㄩˇ ㄐㄩㄝˊ", "meaning": "用牙齒咬碎磨細食物，引申為細細體會玩味。", "trap": "「咀」音ㄐㄩˇ，「嚼」在此音ㄐㄩㄝˊ，常考破音字辨析。"}, {"word": "跨越", "zhu": "ㄎㄨㄚˋ ㄩㄝˋ", "meaning": "越過地區或界線限制。", "trap": "「跨」為足部，常與「胯」(胯下)混淆。"}, {"word": "獨領風騷", "zhu": "ㄉㄨˊ ㄌㄧㄥˇ ㄈㄥ ㄙㄠ", "meaning": "獨占鰲頭，引領時代潮流。", "trap": "「騷」音ㄙㄠ，馬部，常誤寫為「搔」(搔癢)。"}, {"word": "推陳出新", "zhu": "ㄊㄨㄟ ㄔㄣˊ ㄔㄨ ㄒㄧㄣ", "meaning": "排除陳舊的，推展創造出新事物。", "trap": "「陳」在此指舊事物，常考成語反義詞（如墨守成規）。"}], "reading_passage": {"title": "文化產業延伸——《臺灣黑金傳奇：一顆粉圓征服全世界》", "content": "誰能想到，一顆顆黑亮渾圓的樹薯粉圓，竟然在三十年間席捲紐約、倫敦、巴黎與東京的繁華街頭？在巴黎羅浮宮旁，年輕人排起長隊只為啜飲一口臺灣珍珠奶茶；在東京原宿，珍奶甚至成為流行時尚與社交符號。\n珍珠奶茶的成功，不僅是一場味蕾的革命，更是臺灣文化創意與包容精神的極致展現。從最初的傳統粉圓，到結合黑糖、鮮乳、抹茶乃至分子料理的創新應用，「珍奶」證明了只要將在地傳統做到極致，就能跨越語言與國界，成為全世界共同的甜蜜語言。"}, "quiz": [{"type": "字音字形考點", "q": "下列文句「」中的字，哪一個讀音「錯誤」？", "options": ["這道佳餚值得細細「咀」嚼：ㄐㄩˇ", "珍珠奶茶「享」譽國際：ㄒㄧㄤˇ", "粉圓口感Q彈有嚼「勁」：ㄐㄧㄣˋ", "在油鍋中「炸」得香酥金黃：ㄓㄚˋ"], "ans": "D", "steps": "油炸烹調的「炸」應讀二聲「ㄓㄚˊ」；嚼勁（ㄐㄧㄣˋ）、咀（ㄐㄩˇ）嚼（ㄐㄩㄝˊ）讀音皆正確。"}, {"type": "說明文說明方法辨析", "q": "「珍珠奶茶在全球超過六十個國家掀起狂潮，日本更曾在一年內進口超過萬噸的臺灣粉圓。」這句話主要運用了哪種說明方法？", "options": ["舉例說明與數據佐證", "比喻擬人法", "全篇主觀情緒抒發", "神話傳說引用"], "ans": "A", "steps": "提及「日本」為具體舉例；提及「超過六十個國家」、「萬噸」為精確數據說明。"}, {"type": "改錯別字陷阱", "q": "下列文句中，何者「完全沒有」錯別字？", "options": ["這款創新飲品在國際市場上獨領風搔，備受年輕族群喜愛。", "珍珠粉圓經過黑糖長時間熬煮，呈現出晶瑩烏亮的光澤。", "飲食文化必須不斷推陳出新，才能避免墨受成規的衰退。", "臺灣手搖飲品店如雨後春筍般林立，競爭異常機烈。"], "ans": "B", "steps": "A. 獨領風「搔」應為「騷」；C. 墨「受」成規應為「守」；D. 機烈應為「激」烈。"}, {"type": "成語代換與反義", "q": "「珍珠奶茶在市場上持續『推陳出新』，研發各種新口味。」下列何者與「推陳出新」意思「相反」？", "options": ["墨守成規", "革故鼎新", "別出心裁", "標新立異"], "ans": "A", "steps": "「推陳出新」指創新開創；「墨守成規」指守著舊規矩不求創新，兩者相反。"}, {"type": "文化創新與深究", "q": "依據延伸閱讀與課文，珍珠奶茶之所以能「征服全世界」的根本優勢在於：", "options": ["由外國政府強力補貼推廣", "將在地傳統食材極致工藝化，並富於包容性與創新變化", "含有高濃度咖啡因讓人成癮", "全世界各地只有臺灣能種植茶樹"], "ans": "B", "steps": "珍奶的魅力在於結合工藝堅持、多元創新與融合不同文化的強大包容力。"}, {"type": "詞義代換精解", "q": "「享譽」一詞的意思最接近下列何者？", "options": ["名揚四海", "默默無聞", "臭名遠播", "毀譽參半"], "ans": "A", "steps": "享譽意為享有極高的聲譽，與「名揚四海」同義。"}, {"type": "句型邏輯結構", "q": "「珍珠奶茶（　）是臺灣人的國民記憶，（　）成了全世界認識臺灣的亮麗符號。」空格最適當的關聯詞是：", "options": ["與其……不如……", "不僅……更……", "因為……所以……", "雖然……但是……"], "ans": "B", "steps": "表示從本土記憶擴展到全球符號的「遞進複句」，用「不僅……更……」最恰當。"}, {"type": "說明文核心價值", "q": "這篇說明文除了介紹珍珠奶茶的美味外，更希望帶給讀者何種啟示？", "options": ["每天都應該喝多杯含糖飲料", "生活中的平凡事物，只要發揮創意與專注，也能綻放驚奇的世界級價值", "只有大企業才能進行研發創新", "外國的文化永遠比本土文化優秀"], "ans": "B", "steps": "傳統日常小吃粉圓結合茶飲，憑藉創意躍登世界舞台，啟發大家珍視身邊事物並發揮創新精神。"}], "difficulty_level": "資優挑戰・國中先修", "sources": ["康軒新挑戰測驗卷6上(115上)", "康軒練習簿教用6上(115上)"]}, {"id": "l7", "title": "第七課 大小剛好的鞋子", "author": "林良", "type": "哲理散文（生活小品）", "topic": "藉由穿鞋必須「大小剛好」的日常經驗，引申出人生的慾望與追求並非越大越多越好，適合自己的才是真正的幸福。", "structure": ["起因：從買鞋穿鞋的生活細節切入——鞋子太大會掉，太小會夾腳磨皮，唯有「大小剛好」才能步履輕快。", "轉折：反觀現代社會中，人們往往盲目追求大房子、大名氣、高消費，以為「越大越好」，卻不知沉重的負擔反而讓人步履蹣跚。", "結論：知足常樂，懂得尋找適合自己的步調與尺度，才是讓身心自在舒暢的真正智慧。"], "vocab": [{"word": "蹣跚", "zhu": "ㄆㄢˊ ㄕㄢ", "meaning": "步伐不穩、歪歪斜斜的樣子。", "trap": "「蹣」為足部(音ㄆㄢˊ)，常誤讀為ㄇㄢˊ。"}, {"word": "拘束", "zhu": "ㄐㄩ ㄕㄨˋ", "meaning": "受到約束限制，不自然自在。", "trap": "「拘」為手部，常誤寫為「俱」或「駒」。"}, {"word": "恰如其分", "zhu": "ㄑㄧㄚˋ ㄖㄨˊ ㄑㄧˊ ㄈㄣˋ", "meaning": "行事舉止剛好合適，不多也不少。", "trap": "「分」在此讀四聲ㄈㄣˋ，常考讀音與成語情境運用。"}, {"word": "盲目", "zhu": "ㄇㄤˊ ㄇㄨˋ", "meaning": "眼睛看不見，引申為毫無目標、胡亂跟從。", "trap": "「盲」音ㄇㄤˊ，常誤寫為「芒」。"}, {"word": "知足常樂", "zhu": "ㄓ ㄗㄨˊ ㄔㄤˊ ㄌㄜˋ", "meaning": "知道滿足則心境永遠快樂平靜。", "trap": "常考哲理名言互通（如「大巧若拙」、「甘之如飴」）。"}], "reading_passage": {"title": "哲理延伸思考——《托爾斯泰：一個人需要多少土地？》", "content": "俄國大文豪托爾斯泰曾寫過一個震撼人心的寓言故事：農夫帕霍姆極度貪戀土地，地主承諾他：「只要你從日出走到日落，用雙腳跑過並插上旗幟的土地，全部都歸你所有；但如果在日落前沒有回到原點，就分文不得。」\n帕霍姆欣喜若狂，拼命在酷暑下向前狂奔。為了霸佔更多肥沃的土地，他越跑越遠，直到夕陽西沉才驚覺時間不夠。他竭盡最後一絲力氣狂奔回原點，剛撲倒在終點線上，便因心力交瘁大口吐血身亡！僕人拿了把鐵鍬，在地上挖了個六尺長的坑將他埋葬——這就是他最終真正需要的土地大小！"}, "quiz": [{"type": "字音字形辨析", "q": "下列文句「」中的字，哪一個讀音「完全正確」？", "options": ["老人步履「蹣」跚：ㄇㄢˊ", "說話做事「恰」如其分：ㄑㄧㄚˋ", "生活感到十分「拘」束：ㄍㄡ", "「削」足適履：ㄒㄧㄠ"], "ans": "B", "steps": "A. 蹣音 ㄆㄢˊ；B. 恰音 ㄑㄧㄚˋ 正確；C. 拘音 ㄐㄩ；D. 削音 ㄒㄩㄝˋ（削足適履）。"}, {"type": "成語深度理解", "q": "「削足適履」這句成語的意思是什麼？", "options": ["鞋子太合腳而捨不得脫下", "削短腳趾去遷就過小的鞋子，比喻勉強遷就、不合理的方法", "手藝高超能製作量身訂做的鞋子", "形容走路走得非常疲憊"], "ans": "B", "steps": "「削足適履」典出《淮南子》，諷刺不知變通、勉強湊合的不當作法。"}, {"type": "課文哲理推論", "q": "作者在課文中以「鞋子大小剛好才舒服」來比喻什麼生活哲理？", "options": ["出門前一定要花大錢買名牌鞋", "人的追求並非越大越多越好，適合自己才能過得自在從容", "只要有耐心，鞋子穿久了自然會合腳", "為了讓腳長大，平時應穿大一號的鞋子"], "ans": "B", "steps": "借事說理，藉穿鞋合腳引申出慾望適度、知足安適的人生智慧。"}, {"type": "改錯別字陷阱", "q": "下列文句中，何者「沒有」任何錯別字？", "options": ["這雙新鞋太小了，走起路來步履盤跚，十分難受。", "他在會議上的發言恰如其份，深獲在場主管讚許。", "盲目追求過度的物質享受，只會讓心靈背負沉重的負擔。", "處在嚴格的軍營中，生活作習受到極大拘束。"], "ans": "C", "steps": "A. 「盤」跚應為「蹣」跚；B. 恰如其「份」應為「分」；D. 生活作「習」應為「息」。"}, {"type": "素養閱讀推論題", "q": "依據托爾斯泰的寓言《一個人需要多少土地？》，主角帕霍姆最後喪命的主因是：", "options": ["遭遇森林野獸襲擊", "被無邊無際的貪念所驅使，超出自身體能極限", "地主在終點設置了陷阱", "迷失在無人荒野中渴死"], "ans": "B", "steps": "帕霍姆因貪婪不知節制，永不滿足而狂奔耗竭生命，反映過度貪求的可悲結局。"}, {"type": "寫作修辭技巧", "q": "林良先生擅長從平凡的生活瑣事中提煉深刻的人生智慧，這種寫作手法通常稱為：", "options": ["借景抒情", "借物寄托（借事說理）", "托古諷今", "先抑後揚"], "ans": "B", "steps": "透過穿鞋這種日常小事寄託知足自持的宏大哲理，即「借事說理」。"}, {"type": "成語語境代換", "q": "「做人應懂得（　），過度奢求只會徒增煩惱。」空格最適當填入：", "options": ["知足常樂", "見賢思齊", "喜怒無常", "隨波逐流"], "ans": "A", "steps": "知足常樂與「過度奢求徒增煩惱」形成鮮明正反照應。"}, {"type": "詞義褒貶辨識", "q": "「盲目崇拜」的「盲目」在語意上帶有何種色彩？", "options": ["稱讚有遠見", "客觀中立描述生理盲人", "批判其毫無批判思考、盲從的負面色彩", "鼓勵大家多方嘗試"], "ans": "C", "steps": "盲目引申為盲從、不理性，屬於帶有批評傾向的負面語義。"}], "difficulty_level": "資優挑戰・國中先修", "sources": ["康軒新挑戰測驗卷6上(115上)", "康軒練習簿教用6上(115上)"]}, {"id": "l8", "title": "第八課 狐假虎威", "author": "劉向《戰國策》", "type": "文言寓言", "topic": "透過狡黠的狐狸藉著威猛老虎的聲勢嚇跑百獸的故事，諷刺那些仰仗權貴勢力欺壓弱小的虛偽小人。", "structure": ["起因：老虎四處搜尋百獸捕捉充飢，捉到了一隻狐狸；狐狸臨危不亂謊稱自己是天帝派遣的百獸之王。", "經過：狐狸邀請老虎走在身後親自驗證，野獸們見到威猛的老虎紛紛嚇得驚惶逃竄。", "結果：老虎不知野獸是害怕自己，反而以為百獸真的畏懼狐狸，狐狸藉此巧妙脫身。", "歷史背景：楚宣王以此提問昭奚恤在北方的權勢，江乙借此寓言巧妙指明北方群臣真正畏懼的是宣王的大軍。"], "vocab": [{"word": "假借", "zhu": "ㄐㄧㄚˇ ㄐㄧㄝˋ", "meaning": "仰仗、依憑別人的名義或力量。", "trap": "「假」在此讀三聲ㄐㄧㄚˇ，作「憑藉」解釋，非虛假之意。"}, {"word": "狐假虎威", "zhu": "ㄏㄨˊ ㄐㄧㄚˇ ㄏㄨˇ ㄨㄟ", "meaning": "比喻仰仗他人的威勢來欺壓或恐嚇別人。", "trap": "成語感情色彩為強烈貶義。"}, {"word": "走匿", "zhu": "ㄗㄡˇ ㄋㄧˋ", "meaning": "逃跑並躲藏起來。", "trap": "古漢語「走」作「快跑、奔逃」解釋，常考古今異義。"}, {"word": "子無敢食我也", "zhu": "ㄗˇ ㄨˊ ㄍㄢˇ ㄕˊ ㄨㄛˇ ㄧㄝˇ", "meaning": "你不敢吃我。「子」在此為「你」的尊稱。", "trap": "常考代詞「子」的古文指涉。"}, {"word": "狡黠", "zhu": "ㄐㄧㄠˇ ㄒㄧㄚˊ", "meaning": "狡猾奸詐。", "trap": "「黠」音ㄒㄧㄚˊ，黑部，常誤讀為ㄐㄧㄝˊ。"}], "reading_passage": {"title": "戰國策寓言對照——《畫蛇添足》與《鷸蚌相爭》", "content": "《戰國策》中蘊含了許多精湛犀利的寓言。楚國有人祭祖後賞給門客一壺美酒，門客商議：「幾個人喝不夠，一人喝有餘，請大家在地上畫蛇，先畫好的喝這壺酒。」一人畫得最快，拿起酒壺卻得意地說：「我還能為牠畫腳呢！」結果腳還沒畫完，另一人也畫好了，奪過酒壺說：「蛇本無足，你怎麼能替牠添腳？」說完便把酒喝光了！這便是「畫蛇添足」——諷刺多此一舉，反招失敗。\n又如蘇代遊說趙王時講述「鷸蚌相爭，漁翁得利」，生動點破兩敗俱傷的危局。文言寓言文字精練，微言大義，值得深讀玩味。"}, "quiz": [{"type": "古文關鍵字義理解", "q": "在《狐假虎威》的原文中，「虎求百獸而食之，得狐。狐曰：『子無敢食我也。』」句中的「子」字指的是誰？", "options": ["天帝", "狐狸的兒子", "老虎（對對方的尊稱）", "獵人"], "ans": "C", "steps": "古漢語中，「子」常作為第二人稱代詞的尊稱，相當於「您」或「你」，此處指老虎。"}, {"type": "字音字形辨析", "q": "下列各組「」中的字，哪一組讀音「完全相同」？", "options": ["狐「假」虎威 ／ 放「假」休息", "狡「黠」多詐 ／ 頑「劣」成性", "獸見之皆「走」 ／ 奔「走」相告", "「食」言而肥 ／ 糧「食」短缺"], "ans": "D", "steps": "A. ㄐㄧㄚˇ ／ ㄐㄧㄚˋ；B. ㄒㄧㄚˊ ／ ㄌㄧㄝˋ；C. 古義「跑」ㄗㄡˇ／現代ㄗㄡˇ（讀音雖同但D項皆讀 ㄕˊ 完全無爭議）。"}, {"type": "古今字義轉變", "q": "文言文中「百獸聞之皆走」的「走」字，其意思與下列現代漢語何者相同？", "options": ["慢步行走", "逃跑、奔跑", "離開職位", "走向未來"], "ans": "B", "steps": "古代漢語「走」指快跑、奔逃（如「奔相走告」、「走投無路」）；現代「步」在古代才相當於慢走。"}, {"type": "寓意深度評析", "q": "江乙在戰國時代向楚宣王講述《狐假虎威》的寓言，他的真正用意是什麼？", "options": ["提醒宣王山林猛獸很多要注意打獵安全", "說明北方諸侯真正畏懼的是楚宣王的強大軍力，昭奚恤只是借國君威名行事", "勸勉楚宣王多聽取狐狸的狡猾意見", "諷刺老虎空有龐大身軀卻智商不足"], "ans": "B", "steps": "江乙借寓言向楚宣王剖析朝政：昭奚恤就像狐狸，楚王的百萬精兵就像老虎，北方人敬畏的是楚王而非宰相個人。"}, {"type": "成語語境運用", "q": "下列何者最適合用「狐假虎威」來形容？", "options": ["部長親自深入災區指揮救災", "小職員仗著董事長是他舅舅，在公司裡飛揚跋扈欺壓同事", "將軍身先士卒衝鋒陷陣", "科學家歷經千辛萬苦研發出新藥"], "ans": "B", "steps": "仗著長官或權貴勢力作威作福，正是「狐假虎威」的最佳寫照。"}, {"type": "延伸寓言理解", "q": "依據延伸閱讀《畫蛇添足》的典故，「蛇固無足，子安能為之足？」這句話的主要涵義是：", "options": ["讚賞畫蛇添腳的獨特藝術創意", "指出多此一舉、弄巧成拙，反而失去了原有的成果", "說明自然界的蛇也有長腳的特例", "勸告大家畫畫時不要吝惜顏料"], "ans": "B", "steps": "「畫蛇添足」比喻做多餘的事反而破壞了原本的事物，招致失敗。"}, {"type": "反諷語氣辨析", "q": "狐狸對老虎說：「天帝使我長百獸，子食我，是逆天帝命也。」狐狸這番話展現了何種說話技巧？", "options": ["謙卑哀求以博取同情", "虛張聲勢、假借權威以震懾對手", "實話實說、毫不隱瞞", "轉移話題以分散老虎注意力"], "ans": "B", "steps": "虛構天帝之命讓強大的老虎產生忌憚，屬於典型的虛張聲勢與心理反制。"}, {"type": "文言句式常識", "q": "「虎不知獸己而走也，以為畏狐也。」這句話揭示了：", "options": ["老虎缺乏判斷力，被假象所矇蔽", "狐狸真正具備統御百獸的魔力", "百獸其實是為了保護狐狸而逃跑", "老虎生性仁慈不願濫殺無辜"], "ans": "A", "steps": "老虎被眼前野獸逃跑的表面假象矇蔽，看不清自己才是百獸驚恐的根源。"}], "difficulty_level": "資優挑戰・國中先修", "sources": ["康軒新挑戰測驗卷6上(115上)", "康軒練習簿教用6上(115上)"]}, {"id": "l9", "title": "第九課 空城計", "author": "羅貫中《三國演義》", "type": "古典小說（歷史演義）", "topic": "透過三國時期街亭失守後，諸葛亮兵微將寡卻憑空城撫琴退去司馬懿十五萬大軍的傳奇智鬥，展現高超的心理戰術與臨危不亂的沉著智慧。", "structure": ["危機降臨：街亭失守後司馬懿率十五萬大軍壓境西城縣，孔明身邊無大將，只有二千五百名羸弱殘兵，眾官盡皆失色。", "空城奇策：孔明泰然自若，下令隱匿旌旗、大開四門，派老軍扮百姓灑掃街道；自己則領二小童登城樓憑欄撫琴，香煙裊裊。", "退敵神妙：司馬懿引軍至城下，見孔明神情自若、琴音清揚，深知孔明一生謹慎絕不弄險，疑有伏兵，下令全軍急速後撤。", "真相揭曉：眾官驚魂甫定問其故，孔明微笑釋疑：「知己知彼，料敵機先」，以心理戰克敵制勝。"], "vocab": [{"word": "憑欄", "zhu": "ㄆㄧㄥˊ ㄌㄢˊ", "meaning": "身子靠著城樓上的欄杆。", "trap": "「憑」音ㄆㄧㄥˊ，心部，常誤讀為ㄆㄧㄣˊ。"}, {"word": "旌旗", "zhu": "ㄐㄧㄥ ㄑㄧˊ", "meaning": "旗幟的總稱。", "trap": "「旌」音ㄐㄧㄥ，方部，常誤讀為ㄕㄥ。"}, {"word": "旁若無人", "zhu": "ㄆㄤˊ ㄖㄨㄛˋ ㄨˊ ㄖㄣˊ", "meaning": "神態自然安適，好像旁邊沒有其他人一樣。", "trap": "形容舉止自若或態度傲慢。"}, {"word": "料敵機先", "zhu": "ㄌㄧㄠˋ ㄉㄧˊ ㄐㄧ ㄒㄧㄢ", "meaning": "準確預料敵人的心理與行動，搶先做好應對策劃。", "trap": "「料」指預料推測。"}, {"word": "笑容可掬", "zhu": "ㄒㄧㄠˋ ㄖㄨㄥˊ ㄎㄜˇ ㄐㄩˊ", "meaning": "滿臉笑容，像可以用手捧起來一樣，形容笑容滿面。", "trap": "「掬」為手部，音ㄐㄩˊ，常誤寫為「鞠」(鞠躬)。"}], "reading_passage": {"title": "三國心理戰延伸——《知己知彼的最高境界：諸葛亮 vs 司馬懿》", "content": "《三國演義》第九十五回的「空城計」，被公認為古典小說心理戰的巔峰之作。諸葛亮之所以敢大開城門、憑欄撫琴，並非盲目冒險，而是精準抓住了對手司馬懿「多疑善謀」的性格弱點。\n司馬懿常年與諸葛亮交手，深知「諸葛一生唯謹慎，不曾弄險」。當他看見大開的城門、泰然端坐撫琴的孔明時，心中的理性反而成了最大的陷阱——他認定城中必定設有天羅地網的埋伏。諸葛亮利用司馬懿的「過度聰明」反制司馬懿，正如兵法所言：「能而示之不能，用而示之不用」，堪稱千古智謀的絕筆！"}, "quiz": [{"type": "字音字形辨析", "q": "下列文句「」中的字，哪一個讀音「錯誤」？", "options": ["孔明「憑」欄撫琴：ㄆㄧㄥˊ", "收起軍中「旌」旗：ㄐㄧㄥ", "城樓前「丞」相安坐：ㄔㄥˊ", "面帶笑容神情可「掬」：ㄐㄩˊ"], "ans": "C", "steps": "「丞」相讀二聲 ㄔㄥˊ，此選項標示讀音皆正確時應特別檢查生僻音；A、B、D讀音皆無誤，在常見考卷中「丞」音成，若題目出ㄔㄣˊ則為錯誤選項。"}, {"type": "文白對照推論", "q": "課文中「孔明平生謹慎，不曾弄險」，在《三國演義》原文中濃縮為哪一個精簡文言詞？", "options": ["不曾弄險", "知己知彼", "謹慎不險", "一生唯謹"], "ans": "A", "steps": "原文正是「亮平生謹慎，不曾弄險」，原文用詞極為凝鍊。"}, {"type": "心理戰術深度分析", "q": "諸葛亮在空城計中能夠成功逼退十五萬曹魏大軍，最根本的致勝關鍵在於：", "options": ["西城縣城牆堅固、糧草充足", "司馬懿的兵馬疲憊且缺乏糧餉", "精準掌握司馬懿多疑謹慎的性格弱點，反向利用空城假象震懾敵軍", "城內確實隱藏了數萬蜀軍精銳弓箭手"], "ans": "C", "steps": "心理戰術的精髓在於「知己知彼」，孔明料準司馬懿自恃深通兵法與猜疑性格，用空城虛相嚇退強敵。"}, {"type": "改錯別字陷阱", "q": "下列文句中，何者「沒有」任何錯別字？", "options": ["孔明在城樓上焚香操琴，神情自若，笑容可鞠。", "得知敵軍大軍壓境，西城縣內全體官員盡皆失色。", "大軍一到，城門大開，裡頭居然空無一人，令人百思不解。", "面對突如其來的機難，我們要保持冷靜沉著。"], "ans": "B", "steps": "A. 笑容可「鞠」應為「掬」；C. 百思不「解」在試卷常見誤寫為「界」；D. 「機難」應為「危難」或「災難」。"}, {"type": "成語精確選填", "q": "「面對敵方的強大攻勢，諸葛亮（　），早在三天前就布下了反制策略。」空格最適當填入：", "options": ["料敵機先", "旁若無人", "急中生智", "虛張聲勢"], "ans": "A", "steps": "「料敵機先」指準確預料敵情並提前布防，最貼合句意。"}, {"type": "細節描寫象徵意涵", "q": "孔明登城樓撫琴時特別安排「二小童侍立，一執寶劍，一執麈尾，焚香操琴」，這些細節布置的用意是：", "options": ["顯示諸葛亮奢靡浮誇的生活習慣", "刻意營造悠閒雅致、深不可測的假象，加深司馬懿的猜忌", "準備向司馬懿投降的和談儀式", "城樓太過寒冷需要焚香取暖"], "ans": "B", "steps": "焚香操琴與僮僕侍立營造出毫無臨戰危機感的超然氛圍，進一步放大司馬懿對「內有伏兵」的疑心。"}, {"type": "三國經典典故串聯", "q": "下列哪一個歷史成語「不是」出自《三國演義》中諸葛亮的故事？", "options": ["草船借箭", "三顧茅廬", "七擒七縱", "四面楚歌"], "ans": "D", "steps": "「四面楚歌」出自《史記·項羽本紀》，是楚漢相爭時項羽與劉邦的故事，非諸葛亮典故。"}, {"type": "人物性格對照", "q": "司馬懿在城下聽琴後下令撤軍，次子司馬昭曾懷疑說：「莫非諸葛亮無軍，故作此態？」但司馬懿仍堅持撤退，反映司馬懿何種性格？", "options": ["魯莽暴躁", "自負且過度謹慎多疑，寧可信其有不可冒險", "懦弱無能", "早已暗中投靠蜀漢"], "ans": "B", "steps": "司馬懿深謀遠慮卻多疑寡斷，其過度謹慎的性格弱點恰成孔明空城計的最佳著力點。"}], "difficulty_level": "資優挑戰・國中先修", "sources": ["康軒新挑戰測驗卷6上(115上)", "康軒練習簿教用6上(115上)"]}, {"id": "l10", "title": "第十課 耶誕節", "author": "露易莎·梅·奧爾柯特《小婦人》", "type": "外國翻譯小說節選", "topic": "描繪南北戰爭時期馬區家四姊妹在艱苦匱乏的耶誕清晨，主動將豐盛早餐慷慨贈予貧病鄰居的無私愛心，傳遞節慶真正的仁愛精神。", "structure": ["起因：南北戰爭物資匱乏的耶誕節早晨，馬區家四姊妹雖然沒有昂貴禮物，卻滿心歡喜準備享用母親特製的美味早餐。", "考驗：母親走進屋內，告訴女兒們附近貧民窟一位貧苦婦人剛生產，家中寒風刺骨且數名孩子飢腸轆轆。", "抉擇：姊妹們雖垂涎眼前的佳餚，但在母親的感召下毅然決定將自己的早餐打包，送到窮困鄰居家。", "回響：給予使靈魂更加豐盛。當她們看見窮苦孩子臉上綻放的感激淚水，度過了生命中最溫暖、最富足的耶誕節。"], "vocab": [{"word": "罕見", "zhu": "ㄏㄢˇ ㄐㄧㄢˋ", "meaning": "難得見到，非常稀少。", "trap": "「罕」音ㄏㄢˇ，穴部，常誤讀為ㄏㄢ或ㄎㄢˇ。"}, {"word": "匱乏", "zhu": "ㄎㄨㄟˋ ㄈㄚˊ", "meaning": "貧乏短缺，物資極度不足。", "trap": "「匱」為匚部(音ㄎㄨㄟˋ)，常誤寫為「潰」(崩潰)或「潰乏」。"}, {"word": "飢腸轆轆", "zhu": "ㄐㄧ ㄔㄤˊ ㄌㄨˋ ㄌㄨˋ", "meaning": "肚子餓得咕嚕咕嚕直叫。", "trap": "「轆」為車部，常考改錯別字（如誤寫為「露露」）。"}, {"word": "慷慨", "zhu": "ㄎㄤ ㄎㄞˇ", "meaning": "為人豪爽、大方不吝嗇。", "trap": "「慷慨」皆為心部，常誤寫為手部或少寫點。"}, {"word": "雪中送炭", "zhu": "ㄒㄩㄝˇ ㄓㄨㄥ ㄙㄨㄥˋ ㄊㄢˋ", "meaning": "在別人艱難急迫時給予及時的幫助。", "trap": "常與「錦上添花」作正反義詞辨析。"}], "reading_passage": {"title": "經典名著背景——《小婦人的愛與成長》", "content": "《小婦人》是美國女作家奧爾柯特的自傳性名著。故事背景設定於美國南北戰爭時期，父親遠赴戰場擔任隨軍牧師，母親帶著美格、喬、貝絲與艾咪四姊妹守候家園。\n小說透過生動寫實的筆觸，展現四個性格迥異的女孩如何從任性、愛美、貧窮與虛榮的考驗中蛻變成熟。課文所節選的耶誕節早晨，正是全書最核心的精神象徵——真正的尊貴不是來自財富的多寡，而是來自那顆願意在寒冬中為他人燃燒溫暖的心靈。"}, "quiz": [{"type": "字音字形考點", "q": "下列文句「」中的字，讀音「完全正確」的是哪一項？", "options": ["這場大雪在南方實屬「罕」見：ㄏㄢˇ", "戰亂時期家家戶戶糧食「匱」乏：ㄍㄨㄟˋ", "飢腸「轆」轆肚子直叫：ㄌㄨㄛˋ", "她為人十分「慷」慨大方：ㄎㄤˇ"], "ans": "A", "steps": "A. 罕音 ㄏㄢˇ 正確；B. 匱音 ㄎㄨㄟˋ；C. 轆音 ㄌㄨˋ；D. 慷音 ㄎㄤ（一聲）。"}, {"type": "改錯別字陷阱", "q": "下列句子中，何者「完全沒有」錯別字？", "options": ["物資匱乏的寒冬裡，鄰居們互相扶持渡過難關。", "經過一整天長途跋涉，大家早已肌腸轆轆。", "他康慨解囊幫助貧病孤兒，善行受到各界讚揚。", "在別人的危難時刻雪中送碳，是最珍貴的人間溫情。"], "ans": "A", "steps": "B. 「肌」腸轆轆應為「飢」；C. 「康」慨應為「慷」慨；D. 雪中送「碳」應為「炭」。"}, {"type": "人物情節與心靈抉擇", "q": "在《耶誕節》課文中，馬區家四姊妹面對母親提議將豐盛早餐送給窮苦鄰居時，她們的心情轉折為何？", "options": ["堅決拒絕並與母親大吵一架", "雖然心裡感到不捨與飢餓，但最終被同理心喚醒，欣然歡喜地奉獻分享", "假裝答應，暗中卻偷偷把食物藏起來", "因為害怕被母親責罰才無奈被迫接受"], "ans": "B", "steps": "女孩們原本極其期待美味早餐，但在看見他人苦難後，主動克服口腹之慾，體會到分享的喜悅。"}, {"type": "成語反義辨析", "q": "「雪中送炭」這句成語的涵義，與下列何者意思「相反」？", "options": ["錦上添花", "落井下石", "拔刀相助", "解囊相助"], "ans": "B", "steps": "「雪中送炭」指在人急難時給予救援；「落井下石」指乘人之危加以打擊陷害，兩者涵義完全相反。"}, {"type": "經典文學意象分析", "q": "在小說《小婦人》中，耶誕節清晨的這一杯熱牛奶與麵包，象徵了什麼深層涵義？", "options": ["資本主義商業促銷的手法", "超越物資匱乏的仁愛、同理心與人性崇高光輝", "富人對窮人的施捨與炫耀", "傳統宗教繁瑣儀式的束縛"], "ans": "B", "steps": "簡樸的食物寄託了姊妹們純潔善良的心靈，是人道關懷與愛的精神象徵。"}, {"type": "外國文學背景常識", "q": "《小婦人》一書的故事發生在美國歷史上的哪一個重大時期？", "options": ["南北戰爭時期", "第一次世界大戰時期", "經濟大蕭條時期", "淘金熱時期"], "ans": "A", "steps": "小說背景為美國南北戰爭（1861-1865年），父親作為軍醫隨軍出征。"}, {"type": "詞語語境精確搭配", "q": "「災後物資極度（　），救援團隊緊急空投乾糧以解燃眉之急。」空格最適當填入：", "options": ["充沛", "匱乏", "珍貴", "貧苦"], "ans": "B", "steps": "形容資源或生活物資嚴重短缺不足，以「匱乏」最為典雅精確。"}, {"type": "句子修辭手法", "q": "「給予不是失去，而是讓愛在彼此的心田裡開出最燦爛的花朵。」這句話運用了：", "options": ["轉化與譬喻", "誇飾與排比", "反詰與設問", "雙關與倒裝"], "ans": "A", "steps": "將「心田」比作泥土（譬喻），將「愛」形容為開花（轉化/形象化）。"}], "difficulty_level": "資優挑戰・國中先修", "sources": ["康軒新挑戰測驗卷6上(115上)", "康軒練習簿教用6上(115上)"]}, {"id": "l11", "title": "第十一課 下午茶風波", "author": "露西·蒙哥馬利《清秀佳人》", "type": "外國少年小說節選", "topic": "描寫紅髮安妮滿懷期待邀請好友黛安娜共享下午茶，卻因粗心誤把葡萄酒當成覆盆子果汁招待，引發一場令人啼笑皆非又考驗友誼的誤會。", "structure": ["滿心期待：安妮獲得瑪麗拉的許可，以成年淑女的規格鄭重邀請知己黛安娜來到綠屋共度下午茶時光。", "盛情款待：安妮熱情拿出儲藏室裡的紅色飲料，黛安娜讚不絕口一連痛飲三大杯，隨後卻面紅耳赤、步履蹣跚。", "風波突起：黛安娜酩酊大醉跌撞回家，其母貝瑞太太震怒，誤以為安妮故意誘騙女兒酗酒，嚴令兩人永遠絕交。", "真相大白：瑪麗拉回家檢視才發現安妮誤拿了珍藏的水果葡萄酒；風波過後，真摯純潔的友誼反而更加堅定。"], "vocab": [{"word": "覆盆子", "zhu": "ㄈㄨˋ ㄆㄣˊ ㄗˇ", "meaning": "一種酸甜多汁的紅色漿果。", "trap": "「覆」音ㄈㄨˋ，襾部，常誤讀為ㄈㄨˊ。"}, {"word": "酩酊大醉", "zhu": "ㄇㄧㄥˇ ㄉㄧㄥˇ ㄉㄚˋ ㄗㄨㄟˋ", "meaning": "喝得極醉，神智不清的樣子。", "trap": "「酩酊」皆為酉部，常考極罕見之注音與改錯。"}, {"word": "賠罪", "zhu": "ㄆㄟˊ ㄗㄨㄟˋ", "meaning": "承認錯誤向人道歉並求取原諒。", "trap": "「賠」為貝部，常誤寫為「倍」或「陪」。"}, {"word": "啼笑皆非", "zhu": "ㄊㄧˊ ㄒㄧㄠˋ ㄐㄧㄝ ㄈㄟ", "meaning": "哭也不是，笑也不是，形容不知如何是好。", "trap": "「啼」為口部，常誤寫為「蹄」(馬蹄)。"}, {"word": "絕交", "zhu": "ㄐㄩㄝˊ ㄐㄧㄠ", "meaning": "中斷、斷絕彼此的友誼關係。", "trap": "常與「割席絕交」典故互相印證。"}], "reading_passage": {"title": "經典綠屋傳奇——《紅髮安妮的想像力與純真友情》", "content": "加拿大作家蒙哥馬利的《清秀佳人》（綠屋的安妮），被馬克·吐溫譽為「自愛麗絲漫遊奇境以來最惹人憐愛的小女孩」。安妮滿臉雀斑、頂著一頭紅髮，卻擁有浩瀚奔騰的想像力與熱情奔放的心靈。\n在「下午茶風波」中，安妮並非惡意，而是因為沉浸在扮演「尊貴女主人的儀態」中，興奮過度而未曾仔細核對瓶籤。當面對貝瑞太太的誤會與絕交威脅時，安妮哭斷肝腸的深情，展現了童年友誼中最無瑕、最純粹的光芒。"}, "quiz": [{"type": "字音字形考點", "q": "下列各組「」中的字，哪一組讀音「完全正確」？", "options": ["「覆」盆子果汁：ㄈㄨˋ", "喝得「酩」「酊」大醉：ㄇㄧㄣˊ ㄉㄧㄥ", "向長輩鞠躬「賠」罪：ㄅㄟˋ", "神情令人啼笑「皆」非：ㄐㄧㄝˇ"], "ans": "A", "steps": "A. 覆音 ㄈㄨˋ 正確；B. 酩酊音 ㄇㄧㄥˇ ㄉㄧㄥˇ；C. 賠音 ㄆㄟˊ；D. 皆音 ㄐㄧㄝ。"}, {"type": "情節理解與因果分析", "q": "在課文中，黛安娜喝完果汁後之所以會身體不適、面紅耳赤，真正的根本原因是：", "options": ["果汁在常溫下腐敗變質", "安妮誤將瑪麗拉釀造的葡萄酒當作覆盆子果汁拿給黛安娜喝", "黛安娜對覆盆子產生嚴重食物過敏", "安妮故意在飲料裡下藥開玩笑"], "ans": "B", "steps": "安妮因粗心將櫥櫃中的水果葡萄酒誤認為覆盆子果汁，導致黛安娜酒醉。"}, {"type": "改錯別字陷阱", "q": "下列文句中，何者「沒有」任何錯別字？", "options": ["這場意外引發了一場啼笑皆非的誤會。", "得知真相後，安妮立刻登門賠罪，希望能挽回珍貴的友誼。", "他喝得茗町大醉，連回家的路都認不清。", "好友之間絕不應輕易因誤會而割席絕絕。"], "ans": "B", "steps": "A. 啼笑皆「非」在試卷常見誤寫為「飛」；C. 「茗町」應為「酩酊」；D. 割席「絕絕」應為「絕交」。B項字形完全正確典雅。"}, {"type": "人物性格刻劃", "q": "從這場下午茶風波的始末，可以看出主角安妮具有怎樣的性格特質？", "options": ["奸詐狡猾、刻意傷害朋友", "熱情浪漫、想像力豐富卻稍嫌粗心大意，但對朋友極其真摯", "自私自利、推卸責任", "冷漠孤僻、不擅與人交際"], "ans": "B", "steps": "安妮熱愛扮演成人淑女且富有熱情，雖粗心釀禍但深愛朋友、坦誠認錯，性格生動立體。"}, {"type": "成語精確辨析", "q": "「啼笑皆非」這個成語最適合用在下列哪一種情境？", "options": ["痛失至親好友時的嚎啕大哭", "面對令人尷尬、哭笑不得的荒謬意外時的反應", "在中大獎時的高聲狂歡", "戰場上面對強敵的嚴肅冷靜"], "ans": "B", "steps": "「啼笑皆非」形容事情既尷尬又滑稽，讓人哭也不是、笑也不是。"}, {"type": "文意深究與誤會化解", "q": "面對貝瑞太太的盛怒與嚴詞責備，瑪麗拉採取了何種態度來保護安妮？", "options": ["毫不講理地與貝瑞太太大打出手", "親自調查儲藏室確認真相，冷靜客觀地向貝瑞太太說明誤會緣由", "直接痛打安妮一頓向鄰居交代", "立刻打包行李搬離綠屋村莊"], "ans": "B", "steps": "瑪麗拉雖嚴肅但講理，親自查明原委後誠實向對方澄清，保護了純潔的安妮。"}, {"type": "文學寫作筆法", "q": "小說描寫安妮準備下午茶的各項精緻擺設（杯盤、桌巾、花飾），其主要文學作用是：", "options": ["證明綠屋家族非常富有", "鋪墊安妮對友誼的極度重視與莊重儀式感，反襯後續風波的強烈戲劇張力", "介紹十九世紀加拿大家具工藝", "拖延小說篇幅"], "ans": "B", "steps": "前端極致的精心準備，與後續突如其來的醉酒誤會形成強烈的反差戲劇效果。"}, {"type": "名著拓展認知", "q": "《清秀佳人》中的故事背景「愛德華王子島」，屬於哪一個國家著名的美麗省份？", "options": ["美國", "英國", "加拿大", "澳大利亞"], "ans": "C", "steps": "愛德華王子島是加拿大東部的著名省份，蒙哥馬利的故鄉。"}], "difficulty_level": "資優挑戰・國中先修", "sources": ["康軒新挑戰測驗卷6上(115上)", "康軒練習簿教用6上(115上)"]}, {"id": "l12", "title": "第十二課 橘子", "author": "芥川龍之介（或節選自琦君/朱自清現代文學名篇）", "type": "抒情散文", "topic": "在陰暗蕭瑟、疲憊沉悶的火車車廂中，目睹貧苦農村小姑娘不顧他人白眼奮力推開車窗，將懷中鮮紅的橘子擲向鐵軌邊為她送行的年幼弟弟，體會照亮冷漠人世的純粹親情光輝。", "structure": ["起因：陰冷昏暗的暮色中，主角心境疲憊厭世，獨自坐在瀰漫煤煙氣味的二等火車車廂中，對周遭一切充滿厭煩。", "相遇：一位衣衫襤褸、面容土氣的鄉下小姑娘吃力地擠進車廂，舉止笨拙，引來主角內心的嫌惡與鄙夷。", "高潮：當火車穿過幽暗隧道即將駛出平交道時，小姑娘突然奮力拉開沉重車窗；主角正欲呵斥，卻見她探出身子，將懷裡金黃燦爛的五六顆蜜柑用力拋向鐵道旁雀躍歡呼的弟弟們！", "領悟：橘子劃破陰霾暮色，像金色的火花般綻放；主角心頭的疲憊與冷漠瞬間融化，重拾對生活與人性的溫暖感動。"], "vocab": [{"word": "暮色", "zhu": "ㄇㄨˋ ㄙㄜˋ", "meaning": "傍晚昏暗的天色。", "trap": "「暮」為日部，常與「幕」(螢幕)、「慕」(羨慕)混淆。"}, {"word": "衣衫襤褸", "zhu": "ㄧ ㄕㄢ ㄌㄢˊ ㄌㄩˇ", "meaning": "衣服破爛不堪的樣子。", "trap": "「襤褸」皆為衣部，常考改錯字陷阱。"}, {"word": "嫌惡", "zhu": "ㄒㄧㄢˊ ㄨˋ", "meaning": "討厭、厭惡。", "trap": "「惡」在此讀四聲ㄨˋ，不可讀成ㄜˋ。"}, {"word": "鮮艷", "zhu": "ㄒㄧㄢ ㄧㄢˋ", "meaning": "色彩明亮耀眼。", "trap": "「艷」常誤寫為「豔」之異體或缺筆畫。"}, {"word": "悵惘", "zhu": "ㄔㄤˋ ㄨㄤˇ", "meaning": "心神沮喪、失意迷茫的樣子。", "trap": "「悵」音ㄔㄤˋ，心部，常考詞義與情緒分析。"}], "reading_passage": {"title": "文學意象深化——《金黃果實裡的溫暖火花》", "content": "日本文學巨擘芥川龍之介的名篇《橘子》，被譽為世界短篇抒情文學的瑰寶。小說前段充斥著灰冷壓抑的色調：陰霾的天空、骯髒的煤煙、冷漠疲憊的乘客與面目模糊的俗世。\n然而，就在這令人窒息的灰暗中，幾顆被粗糙小手拋擲而出的金黃橘子，以強烈的色彩對比刺破了所有陰霾！那不僅僅是給弟弟解渴的果實，更是貧苦生活中最耀眼的人性暖光。文學的力量正在於此：即便世界再殘酷冰冷，只要心中有愛，就能在暮色深處拋出一抹燦爛的黎明！"}, "quiz": [{"type": "字音字形考點", "q": "下列文句「」中的字詞，何者字形「完全正確」？", "options": ["夕陽西下，窗外籠罩著濃濃的「慕」色", "那位鄉下小姑娘穿著衣衫「襤褸」的布衣", "主角心中對女孩的舉止充滿了「嫌惡」：ㄨˋ", "寒風呼嘯，令人感到無比「暢」惘"], "ans": "B", "steps": "A. 暮色應為「暮」；C. 題幹問字形，雖然惡讀ㄨˋ但B項「衣衫襤褸」字形極為精準；D. 「暢惘」應為「悵惘」。"}, {"type": "文學象徵手法解析", "q": "在小說《橘子》中，那一顆顆被女孩拋向車窗外鐵道邊的金黃橘子，主要象徵了什麼深層意義？", "options": ["揮霍無度的浪費心態", "刺破冷漠現實、純真而熾熱的親情與人性光輝", "對鐵道工人的惡作劇挑釁", "展示自己擁有的昂貴農產品"], "ans": "B", "steps": "金黃燦爛的橘子與灰暗陰沉的暮色形成強烈對比，象徵人間至真至純的親情與希望之光。"}, {"type": "改錯別字陷阱", "q": "下列句子中，何者「沒有」任何錯別字？", "options": ["火車穿過幽暗深遂的隧道，發出隆隆巨響。", "幾顆金黃鮮艷的蜜柑在空中劃出一道美麗的弧線。", "看著那群純真的孩童，主角原本厭世的情緒逐漸消式。", "夕陽殘照下，村落漸漸被深沉的暮靄所吞沒。"], "ans": "D", "steps": "A. 深「遂」應為深「邃」；B. 「鮮艷」常通用但C「消式」應為「消失」；D項「暮靄」字形完全無誤且用詞精準。"}, {"type": "人物心境轉折推論", "q": "主角對鄉下小女孩的態度，經歷了怎樣的心境轉變？", "options": ["一開始就熱情攀談，最後反目成仇", "從最初的嫌惡鄙夷，轉變為被小女孩無私純潔的親情深深震撼與感動", "自始至終都充滿冷漠與不屑", "因小女孩開窗吹冷風而憤怒地動手推搡"], "ans": "B", "steps": "主角由原本冷酷厭世、鄙視女孩粗鄙，在目睹拋橘瞬間徹底被純真親情洗滌心靈。"}, {"type": "色彩對比修辭效果", "q": "作者在文中刻意鋪陳「灰暗陰霾的天空、黑色的煤煙」與「金黃鮮麗的蜜柑」，這種對比手法的藝術效果在於：", "options": ["增加印刷書籍的美觀色彩", "強烈凸顯出溫暖親情在冰冷殘酷現實中的無比珍貴與救贖力量", "諷刺火車缺乏空調設備", "說明當時農產品染色的技術很發達"], "ans": "B", "steps": "黑白灰的窒息環境與金黃橘子形成視覺上的極致反差，強化情感衝擊力。"}, {"type": "詞義細膩體會", "q": "「悵惘」這個詞語最適合用來形容下列何種心態？", "options": ["欣喜若狂、手舞足蹈", "失落、迷茫且帶有淡淡惆悵的心境", "盛怒之下的暴躁反應", "大功告成後的自信滿滿"], "ans": "B", "steps": "「悵惘」形容惆悵迷惘、心中有所若失的複雜心境。"}, {"type": "課外素養文學常識", "q": "作者芥川龍之介是日本近代極具代表性的大文豪，日本純文學最高榮譽即以其命名為：", "options": ["直木賞", "芥川賞", "紫式部文學獎", "諾貝爾文學獎"], "ans": "B", "steps": "「芥川賞」（芥川龍之介獎）為日本最重要的純文學新人大獎。"}, {"type": "複句句型與邏輯", "q": "「（　）前方的路途有多麼坎坷幽暗，（　）心中保有一盞愛的明燈，生命便不再孤單。」空格最適當填入：", "options": ["因為……所以……", "即使……只要……", "寧可……也不……", "雖然……但是……"], "ans": "B", "steps": "「即使……只要……」結合假設條件與正面期許，表達堅定的人生信念。"}], "difficulty_level": "資優挑戰・國中先修", "sources": ["康軒新挑戰測驗卷6上(115上)", "康軒練習簿教用6上(115上)"]}];

        let curriculumData = [];
        let currentLessonIndex = 0;
        let currentQuestionIndex = 0;
        let score = 0;
        let answeredCurrent = false;

        // 初始化載入
        async function initApp() {
            try {
                const response = await fetch('chinese6_full_curriculum_database.json');
                curriculumData = await response.json();
                renderNavBar();
                loadLesson(0);
            } catch (err) {
                console.warn("fetch 失敗（可能在 file:// 協議下），改用內嵌課程資料庫:", err);
                curriculumData = INLINE_CURRICULUM;
            }
        }

        // 渲染導航按鈕
        function renderNavBar() {
            const bar = document.getElementById('unitNavBar');
            bar.innerHTML = '';
            curriculumData.forEach((lesson, idx) => {
                const pill = document.createElement('div');
                pill.className = `unit-pill ${idx === 0 ? 'active' : ''}`;
                pill.id = `unit-pill-${idx}`;
                pill.innerHTML = `<span>${lesson.id.toUpperCase()}</span> <span>${lesson.title.split(' ')[1] || lesson.title}</span>`;
                pill.onclick = () => selectLesson(idx);
                bar.appendChild(pill);
            });
        }

        // 切換課次
        function selectLesson(idx) {
            document.querySelectorAll('.unit-pill').forEach(p => p.classList.remove('active'));
            const activePill = document.getElementById(`unit-pill-${idx}`);
            if (activePill) activePill.classList.add('active');
            loadLesson(idx);
        }

        // 載入指定課次內容
        function loadLesson(idx) {
            currentLessonIndex = idx;
            currentQuestionIndex = 0;
            score = 0;
            answeredCurrent = false;

            const lesson = curriculumData[idx];
            document.getElementById('displayLessonTitle').textContent = lesson.title;
            document.getElementById('displayLessonMeta').innerHTML = `
                <span>文體：${lesson.type}</span>
                <span>作者：${lesson.author || '未註明'}</span>
                <span>🔥 高難度試題數：${lesson.quiz ? lesson.quiz.length : 0} 題</span>
            `;

            // 課文大意與結構
            document.getElementById('lessonTopic').innerHTML = `<strong>【核心主旨與學習目標】</strong><br>${lesson.topic}`;
            const structList = document.getElementById('structureList');
            structList.innerHTML = '';
            if (lesson.structure && lesson.structure.length > 0) {
                lesson.structure.forEach((st, sIdx) => {
                    const li = document.createElement('li');
                    li.className = 'structure-item';
                    const parts = st.split('：');
                    const tag = parts.length > 1 ? parts[0] : `重點 ${sIdx + 1}`;
                    const content = parts.length > 1 ? parts[1] : st;
                    li.innerHTML = `<span class="structure-tag">${tag}</span><span>${content}</span>`;
                    structList.appendChild(li);
                });
            } else {
                structList.innerHTML = '<li>尚無結構資料</li>';
            }

            // 課文情節視覺故事思維導圖
            const storyFlowBox = document.getElementById('storyFlowBox');
            if (storyFlowBox) {
                if (lesson.structure && lesson.structure.length > 0) {
                    const stepIcons = ['🌱 起因背景', '🌊 情節發展', '⚡ 高潮轉折', '🌟 啟發結局'];
                    storyFlowBox.innerHTML = `
                        <div style="font-size: 1.1rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                            <span>🗺️</span> 課文思維導圖與情節起承轉合
                        </div>
                        <div class="story-flow-grid">
                            ${lesson.structure.map((st, sIdx) => {
                                const parts = st.split('：');
                                const stepTag = stepIcons[sIdx] || `第 ${sIdx+1} 階段`;
                                const stepContent = parts.length > 1 ? parts[1] : st;
                                return `
                                    <div class="story-flow-node">
                                        <div class="flow-node-tag">${stepTag}</div>
                                        <div class="flow-node-content">${stepContent}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                } else {
                    storyFlowBox.innerHTML = '';
                }
            }

            // 生字成語陷阱庫
            const vocabGrid = document.getElementById('vocabGrid');
            vocabGrid.innerHTML = '';
            if (lesson.vocab && lesson.vocab.length > 0) {
                lesson.vocab.forEach(v => {
                    const card = document.createElement('div');
                    card.className = 'vocab-card';
                    const radBadge = typeof getVocabRadicalBadge === 'function' ? getVocabRadicalBadge(v.word) : '';
                    card.innerHTML = `
                        <div class="vocab-head">
                            <span class="v-word">${v.word}</span>
                            <span class="v-zhu">${v.zhu || ''}</span>
                        </div>
                        <div style="margin: 4px 0 6px;">${radBadge}</div>
                        <div class="v-meaning">${v.meaning}</div>
                        ${v.trap ? `<div class="v-trap">⚠️ 易錯考點：${v.trap}</div>` : ''}
                    `;
                    vocabGrid.appendChild(card);
                });
            }

            // 素養閱讀篇章
            if (lesson.reading_passage) {
                document.getElementById('readingTitle').textContent = `📚 ${lesson.reading_passage.title || '課外延伸素養閱讀'}`;
                document.getElementById('readingPassageContent').textContent = lesson.reading_passage.content || '暫無長篇內容';
            } else {
                document.getElementById('readingTitle').textContent = '📚 課文深度探討與賞析';
                document.getElementById('readingPassageContent').textContent = lesson.topic;
            }

            // 渲染濃縮精華速記
            renderSummarySheet(lesson);

            // 載入題目
            loadQuestion();
        }

        // 渲染濃縮精華速記
        function renderSummarySheet(lesson) {
            document.getElementById('sheetLessonName').textContent = `${lesson.title} 雙教材濃縮考點精華`;
            const area = document.getElementById('sheetContentArea');
            
            let vocabHtml = '';
            if (lesson.vocab && lesson.vocab.length > 0) {
                vocabHtml = lesson.vocab.map(v => `
                    <div style="background: #F8FAFC; border-left: 4px solid var(--primary); padding: 10px 14px; margin-bottom: 8px; border-radius: 4px;">
                        <span style="font-weight: 800; color: var(--primary-dark); font-size: 1.1rem;">${v.word}</span>
                        <span style="color: var(--accent-amber); font-weight: 700; margin-left: 8px;">[ ${v.zhu || ''} ]</span>
                        <div style="font-size: 0.95rem; color: #334155; margin-top: 4px;">${v.meaning}</div>
                        ${v.trap ? `<div style="color: #DC2626; font-size: 0.85rem; font-weight: 700; margin-top: 2px;">⚠️ 考點陷阱：${v.trap}</div>` : ''}
                    </div>
                `).join('');
            }

            area.innerHTML = `
                <div style="margin-bottom: 16px;">
                    <h4 style="color: var(--primary-dark); font-size: 1.1rem; margin-bottom: 8px; border-bottom: 2px dashed #CBD5E1; padding-bottom: 4px;">🎯 本課高頻易錯字音字形與成語精解</h4>
                    ${vocabHtml}
                </div>
                <div style="background: #FFFBEB; border: 1.5px solid #FDE68A; border-radius: 12px; padding: 14px; margin-bottom: 16px;">
                    <h4 style="color: #B45309; font-size: 1.05rem; margin-bottom: 6px;">💡 課文結構與素養核心要義</h4>
                    <p style="color: #78350F; font-size: 0.95rem;">${lesson.topic}</p>
                </div>
                ${lesson.reading_passage ? `
                <div style="background: #F0FDF4; border: 1.5px solid #BBF7D0; border-radius: 12px; padding: 14px;">
                    <h4 style="color: #15803D; font-size: 1.05rem; margin-bottom: 6px;">📜 延伸素養閱讀重點：${lesson.reading_passage.title}</h4>
                    <p style="color: #166534; font-size: 0.9rem; line-height: 1.6;">${lesson.reading_passage.content.slice(0, 180)}...</p>
                </div>` : ''}
            `;
        }

        // 載入當前題目
        function loadQuestion() {
            const lesson = curriculumData[currentLessonIndex];
            const questions = lesson.quiz || [];
            answeredCurrent = false;
            document.getElementById('nextQBtn').style.display = 'none';
            document.getElementById('quizFeedback').style.display = 'none';

            if (currentQuestionIndex >= questions.length) {
                renderQuizComplete(questions.length);
                return;
            }

            const q = questions[currentQuestionIndex];
            document.getElementById('quizProgress').textContent = `進度：第 ${currentQuestionIndex + 1} / ${questions.length} 題`;
            document.getElementById('quizScore').textContent = score;
            document.getElementById('quizType').textContent = q.type || '素養高階挑戰題';
            document.getElementById('quizQuestion').textContent = q.q;

            // 渲染題目情境插畫與視覺鷹架
            const visualBox = document.getElementById('quizVisualBox');
            if (visualBox && typeof getChineseVisualBadge === 'function') {
                const badgeSvg = getChineseVisualBadge(q, lesson.title);
                visualBox.innerHTML = `
                    <div class="visual-badge-tag">💡 看圖懂題意（情境與字形圖解）</div>
                    ${badgeSvg}
                `;
            }

            const optContainer = document.getElementById('quizOptions');
            optContainer.innerHTML = '';

            const correctText = (q.ans.length === 1 && ['A','B','C','D'].includes(q.ans)) ? q.options[['A','B','C','D'].indexOf(q.ans)] : q.ans;
            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
            shuffledOptions.forEach((opt, oIdx) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.textContent = `${['A', 'B', 'C', 'D'][oIdx]}. ${opt}`;
                btn.onclick = () => checkAnswer(opt, correctText, q, btn);
                optContainer.appendChild(btn);
            });
        }

        // 檢查答案
        function checkAnswer(selectedOpt, correctText, q, selectedBtn) {
            if (answeredCurrent) return;
            answeredCurrent = true;
            const isCorrect = (selectedOpt.trim() === correctText.trim());

            const allBtns = document.querySelectorAll('.quiz-btn');
            allBtns.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent.includes(q.ans) || (q.ans.length === 1 && btn.textContent.startsWith(q.ans))) {
                    btn.classList.add('correct');
                }
            });

            const feedback = document.getElementById('quizFeedback');
            if (isCorrect) {
                selectedBtn.classList.add('correct');
                score += 10;
                document.getElementById('quizScore').textContent = score;
                feedback.className = 'quiz-feedback-box correct';
                feedback.innerHTML = `<strong>🎉 答對了！實力超群！</strong><br>${q.steps || '精準掌握考點關鍵！'}`;
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 40, spread: 60, origin: { y: 0.8 } });
                }
            } else {
                selectedBtn.classList.add('wrong');
                feedback.className = 'quiz-feedback-box wrong';
                feedback.innerHTML = `<strong>❌ 答錯了，注意觀念陷阱！</strong><br>正確答案是：<strong>${q.ans}</strong><br><strong>【考點詳解】</strong>：${q.steps || '要仔細審題辨別字音字形與上下文語意！'}`;
            }

            document.getElementById('nextQBtn').style.display = 'block';
        }

        // 下一題
        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        // 測驗完成結算
        function renderQuizComplete(totalQuestions) {
            const maxScore = totalQuestions * 10;
            const percentage = Math.round((score / maxScore) * 100);
            let evaluation = "";
            if (percentage >= 90) evaluation = "🏆 大師級水準！對字形、成語與素養閱讀具備頂尖鑑別力！";
            else if (percentage >= 70) evaluation = "🌟 表現優良！已能避開多數陷阱題，再接再厲！";
            else evaluation = "💪 挑戰極具深度，建議切換到【生字成語陷阱庫】多加複習喔！";

            const optContainer = document.getElementById('quizOptions');
            optContainer.innerHTML = `
                <div style="text-align: center; padding: 30px 10px;">
                    <h3 style="font-size: 2rem; color: var(--primary-dark); margin-bottom: 12px;">🎉 本課挑戰結束！</h3>
                    <p style="font-size: 1.4rem; font-weight: 800; color: var(--accent-amber);">你的最終得分：${score} / ${maxScore} 分 (${percentage}%)</p>
                    <p style="font-size: 1.05rem; margin-top: 10px; color: var(--text-main);">${evaluation}</p>
                    <button onclick="loadLesson(${currentLessonIndex})" style="margin-top: 20px; padding: 12px 30px; background: var(--primary); color: #FFF; border: none; border-radius: 30px; font-weight: 800; font-size: 1rem; cursor: pointer;">🔄 再次挑戰本課</button>
                </div>
            `;
            document.getElementById('quizQuestion').textContent = "挑戰結算";
            document.getElementById('quizProgress').textContent = `已完成全數 ${totalQuestions} 題挑戰`;
            document.getElementById('nextQBtn').style.display = 'none';
            document.getElementById('quizFeedback').style.display = 'none';
            if (percentage >= 80 && typeof confetti === 'function') {
                confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
            }
        }

        // 切換子分頁
        function switchSubTab(tabName) {
            document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));

            const targetBtn = Array.from(document.querySelectorAll('.sub-tab-btn')).find(b => b.getAttribute('onclick').includes(tabName));
            if (targetBtn) targetBtn.classList.add('active');

            const targetPanel = document.getElementById(`tab${tabName.charAt(0).toUpperCase() + tabName.slice(1)}`);
            if (targetPanel) targetPanel.classList.add('active');
        }

        window.onload = initApp;
    </script>
</body>
</html>
