<meta name="description" content="6年級上學期 數學第2單元：分數的除法。最簡分數、整數除分數、異分母分數除法、被除數與商的關係，5大闖關與作業簿第4-6回完整題庫！">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --kitchen-red: #D9383A;
    --kitchen-orange: #E76F51;
    --kitchen-yellow: #F4A261;
    --kitchen-green: #2A9D8F;
    --ink: #264653;
    --gold: #FFB703;
    --gold-dark: #D48800;
    --parchment: #FFFDF5;
    --parchment-dark: #E9D9A6;
    --coral: #E76F51;
    --leaf: #2A9D8F;
    --shadow: 0 10px 0 rgba(38, 70, 83, 0.22);
  }

  /* KaTeX 數學排版極致清晰優化 */
  .katex {
    font-size: 1.18em;
    font-weight: 700;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }
  /* 主題目大卡片直式分數 */
  .fraction-display .katex {
    font-size: 1.65em;
    line-height: 1.4;
  }
  /* 選項按鈕內分數 */
  .wb-opt-btn .katex, .opt-btn .katex {
    font-size: 1.26em;
    display: inline-block;
    vertical-align: middle;
  }
  /* 作業簿題幹與解析步驟內分數 */
  .wb-q-text .katex, .wb-sol-steps .katex, .wb-sol-ans .katex {
    font-size: 1.22em;
  }
  /* 分數線加粗，不再模糊隱沒 */
  .katex .frac-line {
    border-bottom-width: 1.8px !important;
    border-bottom-color: currentColor !important;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.18), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(255, 255, 255, 0.15), transparent 45%),
      linear-gradient(180deg, #4A1E00 0%, #8C3A00 40%, #D95D1E 80%, #F4A261 100%);
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 16px 12px 60px;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    padding-bottom: max(60px, calc(env(safe-area-inset-bottom) + 40px));
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }

  /* 背景動態烘焙泡泡動畫 */
  .bg-waves {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 120px;
    background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(255, 255, 255, 0.08)" d="M0,192L48,197.3C96,203,192,213,288,192C384,171,480,117,576,112C672,107,768,149,864,165.3C960,181,1056,171,1152,149.3C1248,128,1344,96,1392,80L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x;
    background-size: 1440px 120px;
    animation: waveMove 12s infinite linear;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes waveMove {
    0% { background-position-x: 0; }
    100% { background-position-x: 1440px; }
  }

  .app {
    width: 100%;
    max-width: 780px;
    position: relative;
    z-index: 1;
  }

  button, .term, .isle {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  h1, h2, h3 { font-family: 'Baloo 2', 'Noto Sans TC', sans-serif; margin: 0; }

  /* ---------- Top Navigation Bar ---------- */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 20px;
    color: #FFF;
    font-weight: 700;
    font-size: 0.9rem;
    text-decoration: none;
    backdrop-filter: blur(5px);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .nav-btn:hover {
    background: rgba(255, 255, 255, 0.35);
    transform: translateY(-2px);
  }

  .combo-badge {
    background: linear-gradient(135deg, #FF9E00, #FF0054);
    color: #FFF;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 800;
    font-size: 0.92rem;
    box-shadow: 0 4px 10px rgba(255, 0, 84, 0.3);
    display: flex;
    align-items: center;
    gap: 4px;
    animation: pulse 1.5s infinite alternate;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.08); }
  }

  /* ---------- Header ---------- */
  .header {
    text-align: center;
    color: #fff;
    margin-bottom: 14px;
  }

  .header .eyebrow {
    font-size: 14px;
    letter-spacing: 3px;
    font-weight: 700;
    opacity: 0.9;
    background: rgba(255, 255, 255, 0.15);
    display: inline-block;
    padding: 3px 12px;
    border-radius: 12px;
    margin-bottom: 4px;
  }

  .header h1 {
    font-size: clamp(28px, 6.5vw, 42px);
    text-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
    margin: 4px 0 2px;
    letter-spacing: 1px;
  }

  .header p {
    font-size: 16px;
    opacity: 0.95;
    margin: 0;
  }

  /* ---------- Animated Chef Mascot & Progress path ---------- */
  .mascot-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    padding: 10px 16px;
    backdrop-filter: blur(4px);
  }

  .mascot-avatar {
    font-size: 2.8rem;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
    animation: floatMascot 2s ease-in-out infinite alternate;
    user-select: none;
  }

  @keyframes floatMascot {
    0% { transform: translateY(0) rotate(-3deg); }
    100% { transform: translateY(-6px) rotate(3deg); }
  }

  .mascot-speech {
    background: #FFFFFF;
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 16px;
    font-size: 0.95rem;
    font-weight: 700;
    position: relative;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    max-width: 80%;
  }

  .mascot-speech::before {
    content: '';
    position: absolute;
    left: -10px;
    top: 50%;
    transform: translateY(-50%);
    border-width: 6px 10px 6px 0;
    border-style: solid;
    border-color: transparent #FFFFFF transparent transparent;
  }

  /* Path bar */
  .path-wrap {
    background: rgba(255, 255, 255, 0.16);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    padding: 16px 10px 12px;
    margin-bottom: 18px;
    backdrop-filter: blur(4px);
    position: relative;
  }

  .path {
    display: flex;
    justify-content: space-between;
    position: relative;
    padding: 0 4px;
  }

  .path::before {
    content: "";
    position: absolute;
    top: 22px; left: 6%; right: 6%;
    height: 6px;
    background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.8) 0 10px, transparent 10px 18px);
    z-index: 0;
    border-radius: 3px;
  }

  .isle {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 19%;
    cursor: pointer;
  }

  .isle .dot {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: var(--parchment-dark);
    border: 3px solid #fff;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .isle.active .dot {
    background: var(--kitchen-red);
    transform: scale(1.2);
    animation: bob 1.2s ease-in-out infinite;
    box-shadow: 0 0 15px rgba(217, 56, 58, 0.6);
  }

  .isle.done .dot {
    background: var(--leaf);
    border-color: #E2F1E7;
  }

  .isle .stars {
    font-size: 13px;
    color: #fff;
    min-height: 16px;
    letter-spacing: 1px;
  }

  .isle .label {
    font-size: 12.5px;
    color: #fff;
    text-align: center;
    font-weight: 700;
    opacity: 0.95;
    line-height: 1.2;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) scale(1.2); }
    50% { transform: translateY(-6px) scale(1.2); }
  }

  /* ---------- Main Card ---------- */
  .card {
    background: var(--parchment);

<script>
/* ================= 音效合成器 (Web Audio API Synthesizer) ================= */
let soundEnabled = true;
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇';
  document.getElementById('soundText').textContent = soundEnabled ? '音效 ON' : '音效 OFF';
}

function playSound(type) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;
    if (type === 'click') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, now);
      osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'correct') {
      const freqs = [523.25, 659.25, 783.99, 1046.50];
      freqs.forEach((f, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now + idx * 0.08);
        gain.gain.setValueAtTime(0.25, now + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 0.25);
      });
    } else if (type === 'wrong') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.linearRampToValueAtTime(120, now + 0.25);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'fanfare') {
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      notes.forEach((f, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(f, now + idx * 0.12);
        gain.gain.setValueAtTime(0.2, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + 0.4);
      });
    }
  } catch (e) {}
}

/* ================= 數學排版輔助函數 (KaTeX) ================= */
function formatMath(text) {
  if (text === null || text === undefined) return '';
  let str = String(text);
  
  // 1. 帶分數：例如 6又1/3 -> 6\,\dfrac{1}{3}（加入微間隙與大分數）
  str = str.replace(/(\d+)\s*又\s*(\d+)\/(\d+)/g, '$1\\,\\dfrac{$2}{$3}');
  
  // 2. 一般純分數：例如 1/3 -> \dfrac{1}{3}
  str = str.replace(/(?<![\d\/])(\d+)\/(\d+)(?![\d\/])/g, '\\dfrac{$1}{$2}');
  
  // 3. 括號算式分數：例如 (3×4)/5 -> \dfrac{3 \times 4}{5}
  str = str.replace(/\(([0-9\s×\*\+\-\÷]+)\)\/([0-9]+)/g, '\\dfrac{$1}{$2}');
  
  // 4. 運算符號
  str = str.replace(/÷/g, ' \\div ');
  str = str.replace(/×/g, ' \\times ');
  str = str.replace(/□/g, ' \\square ');
  str = str.replace(/=>/g, ' \\Rightarrow ');

  if (typeof katex !== 'undefined') {
    // 尋找含有數學公式的片段進行 KaTeX 渲染
    return str.replace(/((?:\\dfrac\{[^{}]+\}\{[^{}]+\}|[0-9\+\-\=\>\<\(\)\.\,\s]|\b\d+\b|\\div|\\times|\\square|\\Rightarrow|\\,)+)/g, function(match) {
      const trimmed = match.trim();
      if (!trimmed) return match;
      if (trimmed.includes('\\dfrac') || trimmed.includes('\\div') || trimmed.includes('\\times') || trimmed.includes('\\square') || trimmed.includes('\\Rightarrow') || (trimmed.includes('=') && /\d/.test(trimmed))) {
        try {
          return katex.renderToString('\\displaystyle ' + trimmed, { throwOnError: false, displayMode: false });
        } catch(e) {
          return match;
        }
      }
      return match;
    });
  }
  return str;
}

const GLOSSARY = [
  { key:'simplest', title:'最簡分數', def:'當一個分數的分子和分母「互質」（最大公因數是 1）時，這個分數就叫作最簡分數。例如 2/3、5/7。' },
  { key:'reciprocal', title:'倒數 (上下顛倒)', def:'把一個分數的分子和分母位置對調，得到的新分數就是它的倒數。例如 3/5 的倒數是 5/3。除以一個分數就等於乘以它的倒數！' },
  { key:'sameDenom', title:'同分母除法', def:'分母相同的分數相除，分母會互相抵消，直接等於「分子除以分子」。例如 (8/9) ÷ (2/9) = 8 ÷ 2 = 4。' },
  { key:'diffDenom', title:'異分母分數除法', def:'分母不同的分數相除時，可以先通分再算，或者直接使用黃金法則：「除號變乘號，除數顛倒成倒數」。' },
  { key:'quotientRule', title:'被除數、除數和商的關係', def:'當除數 > 1 時，商 < 被除數；當除數 < 1 時，商 > 被除數；當除數 = 1 時，商 = 被除數。' }
];

/* ================= 進度列渲染 ================= */
function renderPath(){
  const bar = document.getElementById('pathBar');
  bar.innerHTML = '';
  const order = ['l1','l2','l3','l4','l5'];
  order.forEach((key,i)=>{
    const isle = ISLES[i];
    const div = document.createElement('div');
    div.className = 'isle';
    if(state.stars[key] > 0) div.classList.add('done');
    if(state.stage === key) div.classList.add('active');
    div.onclick = () => goto(key);
    div.innerHTML = `
      <div class="dot">${state.stars[key] > 0 ? '✅' : isle.icon}</div>
      <div class="stars">${state.stars[key] > 0 ? starsToText(state.stars[key]) : ''}</div>
      <div class="label">${isle.label}</div>`;
    bar.appendChild(div);
  });
}

function goto(stage){
  playSound('click');
  state.stage = stage;
  renderPath();
  const c = document.getElementById('content');
  c.innerHTML = '';
  if(stage === 'intro') renderIntro(c);
  else if(stage === 'l1') renderLevel1(c);
  else if(stage === 'l2') renderLevel2(c);
  else if(stage === 'l3') renderLevel3(c);
  else if(stage === 'l4') renderLevel4(c);
  else if(stage === 'l5') renderLevel5(c);
  else if(stage === 'final') renderFinal(c);
}

  updateMascot('🥳', `太棒了！${title} 順利過關！拿到 ${stars} 顆星星！`);
  c.innerHTML = `
    <div class="hero-emoji">🍕🎉🏆</div>
    <h2 class="stage-title" style="justify-content:center;">${title} 順利過關！</h2>
    <div class="star-line">${starsToText(stars)}</div>
    <p class="lead-text">${tip}</p>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn coral" onclick="goto('${nextStage}')">${nextStage==='final'?'前往領取特級大廚獎章 🏅':'前進下一道料理關卡 🍕'}</button>
    </div>
  `;
}

function renderFinal(c){
  playSound('fanfare');
  updateMascot('👑', '米其林三星特級大廚誕生！你已經完全征服分數的除法王國！');
  c.innerHTML = `
    <div class="hero-emoji">👨‍🍳🍕🏅</div>
    <h2 class="stage-title" style="justify-content:center;">榮獲米其林三星特級大廚！</h2>
    <div class="star-line">總星星數：15 / 15</div>
    <p class="lead-text">太厲害了！你已經完全融會貫通最簡分數、同分母除法、異分母分數除法與商的規律！隨時可以點擊上方「作業簿隨堂考」挑戰期中評量！</p>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn gold" onclick="openFracWbModal()">📑 挑戰作業簿隨堂考 (第4~6回)</button>
      <button class="btn leaf" onclick="restartGame()">🔁 重新挑戰闖關</button>
    </div>
  `;
  if(window.confetti) confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
}

function restartGame(){
  resetCombo();
  state.stars = {l1:0,l2:0,l3:0,l4:0,l5:0};
  goto('intro');
}

let fracCurrentRevId = 4;
let fracAnswers = {};

function openFracWbModal() {
  playSound('click');
  document.getElementById('fracWbModalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  switchFracWbRev(4);
}
function closeFracWbModal() {
  document.getElementById('fracWbModalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function switchFracWbRev(revId) {
  fracCurrentRevId = revId;
  fracAnswers = {};
  document.querySelectorAll('#fracWbModalOverlay .wb-tab').forEach((t, i) => t.classList.toggle('active', i + 4 === revId));
  document.getElementById('fracWbScoreDisp').textContent = '狀態：做題中（未交卷）';
  renderFracWbQuizBody();
}

function fracPick(itemId, val, btnEl) {
  playSound('click');
  fracAnswers[itemId] = val;
  const parent = btnEl.closest('.wb-opt-grid');
  if (parent) {
    parent.querySelectorAll('.wb-opt-btn').forEach(b => b.classList.remove('selected'));
    btnEl.classList.add('selected');
  }
}

  // 2. 水管切段 (長 12/5m，每 3/5m 剪成 1 段)

    return `
      <svg class="frac-svg" width="240" height="140" viewBox="0 0 240 140">

        <rect x="25" y="35" width="55" height="70" rx="8" fill="#FDE047" stroke="#CA8A04" stroke-width="2.5"/>
        <text x="52" y="65" font-size="20" text-anchor="middle">🧃</text>
        <text x="52" y="92" font-size="10.5" fill="#854D0E" text-anchor="middle">整桶大容量</text>
        <text x="52" y="122" font-size="11" fill="#CA8A04" text-anchor="middle">被除數</text>

        <text x="120" y="132" font-size="11.5" fill="#C2410C" text-anchor="middle" font-weight="bold">總瓶數 = 大容量 ÷ 每瓶容量</text>
      </svg>
    `;
  }

  // 4. 長方形面積除以寬求長
  if (text.includes('長方形') && (text.includes('面積') || text.includes('寬'))) {
    return `
      <svg class="frac-svg" width="220" height="140" viewBox="0 0 220 140">
        <rect x="30" y="30" width="160" height="70" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
        <text x="110" y="65" font-size="12" fill="#5B21B6" text-anchor="middle" font-weight="bold">長方形面積</text>
        <text x="110" y="82" font-size="11" fill="#7C3AED" text-anchor="middle">面積 = 長 × 寬</text>
        <text x="110" y="20" font-size="12" fill="#DC2626" text-anchor="middle" font-weight="bold">長 = 面積 ÷ 寬 (？)</text>
        <text x="18" y="70" font-size="11" fill="#5B21B6" text-anchor="middle">寬</text>
        <text x="110" y="125" font-size="11.5" fill="#4338CA" text-anchor="middle">長度 = 面積 ÷ 寬</text>
      </svg>
    `;
  }

  // 5. 南王國小合唱團 (長條比例模型 Bar Model)
  if (text.includes('合唱團') || text.includes('全校人數')) {
    return `
      <svg class="frac-svg" width="240" height="140" viewBox="0 0 240 140">
        <rect x="20" y="45" width="200" height="30" rx="4" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>

        <rect x="20" y="45" width="45" height="30" rx="4" fill="#F43F5E" stroke="#BE123C" stroke-width="2"/>
        <text x="42" y="65" font-size="11" fill="#FFFFFF" text-anchor="middle">5份</text>
        <text x="42" y="32" font-size="11" fill="#BE123C" text-anchor="middle" font-weight="bold">合唱團 75人</text>
        <text x="145" y="65" font-size="11" fill="#475569" text-anchor="middle">其餘 19 份</text>
        <text x="120" y="98" font-size="11" fill="#1E293B" text-anchor="middle">全校共 24 份 (75 ÷ 5/24 = 360人)</text>
        <text x="120" y="122" font-size="11.5" fill="#047857" text-anchor="middle" font-weight="bold">1份 = 75 ÷ 5 = 15人 ➜ 15 × 24 = 360人</text>
      </svg>

  // 6. 水果比較問題 (香蕉 vs 芭樂)
  if (text.includes('香蕉') || text.includes('芭樂')) {

      <svg class="frac-svg" width="220" height="135" viewBox="0 0 220 135">

        <text x="110" y="118" font-size="11.5" fill="#B91C1C" text-anchor="middle" font-weight="bold">除數 3/5 &lt; 1 ➜ 商大於 18元 (芭樂較貴)</text>
      </svg>
    `;
  }

  // 7. 比大小 (商與被除數的關係)
  if (text.includes('□') || text.includes('商小於被除數') || text.includes('商大於被除數')) {
    return `
      <svg class="frac-svg" width="220" height="120" viewBox="0 0 220 120">
        <rect x="20" y="25" width="180" height="70" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
        <text x="110" y="48" font-size="13" fill="#1E293B" text-anchor="middle" font-weight="bold">⚖️ 商的放大縮小規律</text>
        <text x="110" y="70" font-size="11" fill="#2563EB" text-anchor="middle">除數 &gt; 1 ➜ 商變小 (商 &lt; 被除數)</text>
        <text x="110" y="87" font-size="11" fill="#DC2626" text-anchor="middle">除數 &lt; 1 ➜ 商變大 (商 &gt; 被除數)</text>
      </svg>
    `;
  }

  // 8. 通用分數模型 (長條帶或披薩模型)
  return `
    <svg class="frac-svg" width="220" height="110" viewBox="0 0 220 110">
      <rect x="25" y="25" width="170" height="30" rx="4" fill="#FED7AA" stroke="#EA580C" stroke-width="2"/>
      <line x1="81" y1="25" x2="81" y2="55" stroke="#EA580C" stroke-width="2"/>
      <line x1="138" y1="25" x2="138" y2="55" stroke="#EA580C" stroke-width="2"/>
      <text x="110" y="45" font-size="11.5" fill="#9A3412" text-anchor="middle" font-weight="bold">長條分數分割模型</text>
      <text x="110" y="85" font-size="11.5" fill="#C2410C" text-anchor="middle">除以分數 ➜ 乘以倒數 (上下顛倒)</text>
    </svg>
  `;
}

function renderFracWbQuizBody() {
  const rev = U2_WB_DATA.reviews.find(r => r.review_id === fracCurrentRevId);
  const container = document.getElementById('fracWbQuizBody');
  if (!rev) return;

  let html = '';
  rev.sections.forEach((sec, sIdx) => {
    html += `<div class="wb-sec-card">
      <div class="wb-sec-title">📌 ${sec.section_title}</div>`;

    if (sec.type === 'quotient_relations' && sec.options_pool) {
      html += '<div style="background:#FFF8F0; padding:10px; border-radius:10px; margin-bottom:12px; font-size:14px; border:1px solid #F4A261;"><b>算式代號庫：</b><br>';
      for (const [k, v] of Object.entries(sec.options_pool)) {
        html += `【${k}】 ${formatMath(v)}　`;
      }
      html += '</div>';
    }

    sec.items.forEach((item, iIdx) => {
      const itemId = `u2_r${fracCurrentRevId}_s${sIdx}_${iIdx}`;
      let itemOpts = item.options || [];

      if (!itemOpts || itemOpts.length === 0) {
        if (sec.type === 'comparison') itemOpts = ['>', '<', '='];
        else itemOpts = [item.ans, '1又1/2', '2/3', '4'];
      }

      const visualSvg = getFracDiagramSvg(item);

      html += `
        <div class="wb-q-item">
          <div class="wb-q-text">${formatMath(item.q)}</div>
          ${visualSvg ? `<div class="wb-diagram-box"><div class="diagram-tag">💡 看圖懂題意（分數模型）</div>${visualSvg}</div>` : ''}
          <div class="wb-opt-grid">
            ${itemOpts.map(opt => `
              <button type="button" class="wb-opt-btn ${fracAnswers[itemId] === opt ? 'selected' : ''}" data-opt="${opt}" onclick="fracPick('${itemId}', '${opt}', this)">
                ${formatMath(opt)}
              </button>
            `).join('')}
          </div>
          <div class="wb-sol-panel" id="sol_${itemId}">
            <div class="wb-sol-steps">${formatMath(item.steps || item.explanation || '')}</div>
            <div class="wb-sol-ans">標準答案：${formatMath(item.ans)}</div>
          </div>
        </div>`;
    });

    html += '</div>';
  });
  container.innerHTML = html;
}

function gradeFracWbQuiz() {
  const rev = U2_WB_DATA.reviews.find(r => r.review_id === fracCurrentRevId);
  let total = 0, correct = 0;

  rev.sections.forEach((sec, sIdx) => {
    sec.items.forEach((item, iIdx) => {
      total++;
      const itemId = `u2_r${fracCurrentRevId}_s${sIdx}_${iIdx}`;
      const userVal = fracAnswers[itemId] || '';
      let isRight = false;

      const cleanUser = userVal.replace(/[\s]/g, '').replace(/段|公尺|次|倍|瓶|元|包|公升/g, '');
      const cleanAns = String(item.ans).replace(/[\s]/g, '').replace(/段|公尺|次|倍|瓶|元|包|公升/g, '');

      if (cleanUser === cleanAns || cleanUser.includes(cleanAns)) {
        isRight = true;
      } else if (cleanAns.includes('或')) {
        const parts = cleanAns.split('或');
        isRight = parts.some(p => cleanUser.includes(p.trim().replace(/[\s\(\)]/g, '')));
      } else if (cleanAns.includes('、')) {
        const parts = cleanAns.split('、');
        isRight = parts.every(p => cleanUser.includes(p.trim()));
      }

      if (isRight) correct++;

      // 取得題目卡片與該題所有選項按鈕
      const panel = document.getElementById(`sol_${itemId}`);
      const qItem = panel ? panel.closest('.wb-q-item') : null;
      
      if (qItem) {
        // 設定題目卡片邊框與背景
        qItem.classList.remove('is-correct', 'is-wrong');
        qItem.classList.add(isRight ? 'is-correct' : 'is-wrong');
        
        // 移除舊 badge
        const oldBadge = qItem.querySelector('.wb-q-badge');
        if (oldBadge) oldBadge.remove();
        
        // 插入醒目標籤
        const badge = document.createElement('div');
        badge.className = `wb-q-badge ${isRight ? 'correct' : 'wrong'}`;
        badge.innerHTML = isRight ? '✓ 答對了！' : (userVal ? '✕ 答錯了！' : '⚠️ 未作答！');
        qItem.insertBefore(badge, qItem.firstChild);

        // 遍歷所有選項按鈕標註顏色
        const btns = qItem.querySelectorAll('.wb-opt-btn');
        btns.forEach(btn => {
          btn.classList.remove('opt-correct', 'opt-wrong', 'opt-should-be');
          const btnVal = btn.dataset.opt || btn.textContent.trim();
          const cleanBtn = btnVal.replace(/[\s]/g, '').replace(/段|公尺|次|倍|瓶|元|包|公升/g, '');
          
          const isBtnAns = (cleanBtn === cleanAns || cleanBtn.includes(cleanAns) || (cleanAns.includes('或') && cleanAns.split('或').some(p => cleanBtn.includes(p.trim().replace(/[\s\(\)]/g, '')))));
          
          if (btnVal === userVal) {
            if (isRight) {
              btn.classList.add('opt-correct');
              btn.innerHTML = `✓ ${formatMath(btnVal)}`;
            } else {
              btn.classList.add('opt-wrong');
              btn.innerHTML = `✕ ${formatMath(btnVal)}`;
            }
          } else if (isBtnAns && !isRight) {
            btn.classList.add('opt-should-be');
            btn.innerHTML = `★ 正解：${formatMath(btnVal)}`;
          }
        });
      }

      if (panel) {
        panel.classList.add('show');
        panel.style.borderLeft = isRight ? '6px solid #10B981' : '6px solid #EF4444';
      }
    });
  });

  const score = Math.round((correct / total) * 100);
  document.getElementById('fracWbScoreDisp').innerHTML = `得分：<b>${score} 分</b> (${correct} / ${total} 題正確)`;
  if (score >= 80) {
    playSound('fanfare');
    if (window.confetti) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
  } else {
    playSound('correct');
  }
  alert(`🎉 隨堂測驗批改完成！\n\n得分：${score} 分\n綠色為答對選項，紅色為答錯選項，綠色虛線為標準正解！✨`);
}

function resetFracWbQuiz() {
  fracAnswers = {};
  renderFracWbQuizBody();
  document.getElementById('fracWbScoreDisp').textContent = '狀態：做題中（未交卷）';
}

goto('intro');
