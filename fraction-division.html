<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>分數廚師大挑戰 🍕 南一版 6上數學 第2單元</title>
<meta name="description" content="南一版 6年級上學期 數學第2單元：分數的除法。最簡分數、整數除分數、異分母分數除法、被除數與商的關係，5大闖關與作業簿第4-6回完整題庫！">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  :root {
    --kitchen-red: #D9383A;
    --kitchen-orange: #E76F51;
    --kitchen-yellow: #F4A261;
    --kitchen-green: #2A9D8F;
    --ink: #264653;
    --gold: #FFB703;
    --gold-dark: #D48800;
    --parchment: #FFFDF5;
    --parchment-dark: #E9D9A6;
    --coral: #E76F51;
    --leaf: #2A9D8F;
    --shadow: 0 10px 0 rgba(38, 70, 83, 0.22);
  }

  /* KaTeX 數學排版極致清晰優化 */
  .katex {
    font-size: 1.18em;
    font-weight: 700;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }
  /* 主題目大卡片直式分數 */
  .fraction-display .katex {
    font-size: 1.65em;
    line-height: 1.4;
  }
  /* 選項按鈕內分數 */
  .wb-opt-btn .katex, .opt-btn .katex {
    font-size: 1.26em;
    display: inline-block;
    vertical-align: middle;
  }
  /* 作業簿題幹與解析步驟內分數 */
  .wb-q-text .katex, .wb-sol-steps .katex, .wb-sol-ans .katex {
    font-size: 1.22em;
  }
  /* 分數線加粗，不再模糊隱沒 */
  .katex .frac-line {
    border-bottom-width: 1.8px !important;
    border-bottom-color: currentColor !important;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.18), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(255, 255, 255, 0.15), transparent 45%),
      linear-gradient(180deg, #4A1E00 0%, #8C3A00 40%, #D95D1E 80%, #F4A261 100%);
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 16px 12px 60px;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    padding-bottom: max(60px, calc(env(safe-area-inset-bottom) + 40px));
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }

  /* 背景動態烘焙泡泡動畫 */
  .bg-waves {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 120px;
    background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(255, 255, 255, 0.08)" d="M0,192L48,197.3C96,203,192,213,288,192C384,171,480,117,576,112C672,107,768,149,864,165.3C960,181,1056,171,1152,149.3C1248,128,1344,96,1392,80L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x;
    background-size: 1440px 120px;
    animation: waveMove 12s infinite linear;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes waveMove {
    0% { background-position-x: 0; }
    100% { background-position-x: 1440px; }
  }

  .app {
    width: 100%;
    max-width: 780px;
    position: relative;
    z-index: 1;
  }

  button, .term, .isle {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  h1, h2, h3 { font-family: 'Baloo 2', 'Noto Sans TC', sans-serif; margin: 0; }

  /* ---------- Top Navigation Bar ---------- */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 20px;
    color: #FFF;
    font-weight: 700;
    font-size: 0.9rem;
    text-decoration: none;
    backdrop-filter: blur(5px);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .nav-btn:hover {
    background: rgba(255, 255, 255, 0.35);
    transform: translateY(-2px);
  }

  .combo-badge {
    background: linear-gradient(135deg, #FF9E00, #FF0054);
    color: #FFF;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 800;
    font-size: 0.92rem;
    box-shadow: 0 4px 10px rgba(255, 0, 84, 0.3);
    display: flex;
    align-items: center;
    gap: 4px;
    animation: pulse 1.5s infinite alternate;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.08); }
  }

  /* ---------- Header ---------- */
  .header {
    text-align: center;
    color: #fff;
    margin-bottom: 14px;
  }

  .header .eyebrow {
    font-size: 14px;
    letter-spacing: 3px;
    font-weight: 700;
    opacity: 0.9;
    background: rgba(255, 255, 255, 0.15);
    display: inline-block;
    padding: 3px 12px;
    border-radius: 12px;
    margin-bottom: 4px;
  }

  .header h1 {
    font-size: clamp(28px, 6.5vw, 42px);
    text-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
    margin: 4px 0 2px;
    letter-spacing: 1px;
  }

  .header p {
    font-size: 16px;
    opacity: 0.95;
    margin: 0;
  }

  /* ---------- Animated Chef Mascot & Progress path ---------- */
  .mascot-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    padding: 10px 16px;
    backdrop-filter: blur(4px);
  }

  .mascot-avatar {
    font-size: 2.8rem;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
    animation: floatMascot 2s ease-in-out infinite alternate;
    user-select: none;
  }

  @keyframes floatMascot {
    0% { transform: translateY(0) rotate(-3deg); }
    100% { transform: translateY(-6px) rotate(3deg); }
  }

  .mascot-speech {
    background: #FFFFFF;
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 16px;
    font-size: 0.95rem;
    font-weight: 700;
    position: relative;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    max-width: 80%;
  }

  .mascot-speech::before {
    content: '';
    position: absolute;
    left: -10px;
    top: 50%;
    transform: translateY(-50%);
    border-width: 6px 10px 6px 0;
    border-style: solid;
    border-color: transparent #FFFFFF transparent transparent;
  }

  /* Path bar */
  .path-wrap {
    background: rgba(255, 255, 255, 0.16);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    padding: 16px 10px 12px;
    margin-bottom: 18px;
    backdrop-filter: blur(4px);
    position: relative;
  }

  .path {
    display: flex;
    justify-content: space-between;
    position: relative;
    padding: 0 4px;
  }

  .path::before {
    content: "";
    position: absolute;
    top: 22px; left: 6%; right: 6%;
    height: 6px;
    background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.8) 0 10px, transparent 10px 18px);
    z-index: 0;
    border-radius: 3px;
  }

  .isle {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 19%;
    cursor: pointer;
  }

  .isle .dot {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: var(--parchment-dark);
    border: 3px solid #fff;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .isle.active .dot {
    background: var(--kitchen-red);
    transform: scale(1.2);
    animation: bob 1.2s ease-in-out infinite;
    box-shadow: 0 0 15px rgba(217, 56, 58, 0.6);
  }

  .isle.done .dot {
    background: var(--leaf);
    border-color: #E2F1E7;
  }

  .isle .stars {
    font-size: 13px;
    color: #fff;
    min-height: 16px;
    letter-spacing: 1px;
  }

  .isle .label {
    font-size: 12.5px;
    color: #fff;
    text-align: center;
    font-weight: 700;
    opacity: 0.95;
    line-height: 1.2;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) scale(1.2); }
    50% { transform: translateY(-6px) scale(1.2); }
  }

  /* ---------- Main Card ---------- */
  .card {
    background: var(--parchment);
    border: 4px solid var(--ink);
    border-radius: 26px;
    padding: clamp(18px, 4vw, 28px) clamp(16px, 4vw, 26px) clamp(22px, 5vw, 30px);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    min-height: 340px;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(38, 70, 83, 0.04) 1.5px, transparent 1.5px);
    background-size: 16px 16px;
    pointer-events: none;
  }

  .stage-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(22px, 5vw, 30px);
    color: var(--kitchen-red);
    margin-bottom: 8px;
    font-weight: 800;
  }

  .stage-sub {
    font-size: 16.5px;
    color: #4b5a5f;
    margin-bottom: 18px;
    line-height: 1.65;
  }

  .content { position: relative; z-index: 1; }

  /* Buttons & Option Grid */
  .btn {
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 800;
    font-size: 19px;
    padding: 14px 26px;
    min-height: 52px;
    border-radius: 16px;
    border: 3px solid var(--ink);
    cursor: pointer;
    background: var(--kitchen-orange);
    color: #fff;
    box-shadow: 0 5px 0 #9E4732;
    transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #9E4732; }

  .btn.gold { background: var(--gold); box-shadow: 0 5px 0 var(--gold-dark); color: #3a2600; }
  .btn.coral { background: var(--kitchen-red); box-shadow: 0 5px 0 #8E2022; }
  .btn.leaf { background: var(--leaf); box-shadow: 0 5px 0 #1b635a; }

  .opt-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin: 20px 0;
  }

  .opt-btn {
    font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
    font-size: 22px;
    font-weight: 800;
    padding: 16px 20px;
    border-radius: 18px;
    border: 3px solid var(--ink);
    background: #FFF;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(38, 70, 83, 0.2);
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .opt-btn:hover {
    background: #FFF3E0;
    border-color: var(--kitchen-orange);
    transform: translateY(-2px);
    box-shadow: 0 8px 0 rgba(38, 70, 83, 0.25);
  }

  .opt-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(38, 70, 83, 0.2);
  }

  .btn-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
  .btn.small { padding: 10px 18px; font-size: 16px; border-radius: 12px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25); }

  /* Interactive Elements */
  .fraction-display {
    font-family: 'Fredoka', 'Baloo 2', sans-serif;
    font-size: 36px;
    font-weight: 700;
    color: var(--ink);
    background: #FFF;
    border: 3px solid var(--ink);
    border-radius: 20px;
    padding: 18px 24px;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    margin: 12px auto;
    box-shadow: 0 6px 0 rgba(38, 70, 83, 0.2);
  }

  .feedback {
    margin-top: 16px;
    font-weight: 700;
    font-size: 17.5px;
    min-height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 12px;
    transition: all 0.3s ease;
  }
  .feedback.ok { color: #0E7C7B; background: #E6F8F6; border: 2px solid #2EC4B6; }
  .feedback.bad { color: #D63031; background: #FFE5E5; border: 2px solid #FF4757; }

  .shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px); }
    40%, 80% { transform: translateX(10px); }
  }

  /* Glossary Tooltip & FAB */
  .term {
    color: var(--kitchen-red);
    font-weight: 800;
    border-bottom: 2px dotted var(--kitchen-orange);
    cursor: pointer;
    padding: 0 2px;
    white-space: nowrap;
  }
  .term:hover { background: rgba(231, 111, 81, 0.18); border-radius: 4px; }
  .term sup { font-size: 12px; color: var(--kitchen-red); margin-left: 1px; }

  .glossary-fab {
    position: fixed;
    right: 18px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    z-index: 50;
    background: var(--gold);
    color: #3a2600;
    border: 3px solid #fff;
    border-radius: 999px;
    padding: 12px 18px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    cursor: pointer;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(38, 70, 83, 0.7);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }

  .modal-card {
    background: var(--parchment);
    border: 4px solid var(--ink);
    border-radius: 24px;
    max-width: 580px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
  }

  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-close { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; font-weight: 800; cursor: pointer; }

  .def-card {
    background: #fff;
    border: 2px solid var(--parchment-dark);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .def-card h3 { font-size: 18px; color: var(--kitchen-red); margin-bottom: 6px; }
  .def-card p { font-size: 15px; line-height: 1.7; color: #3d4a4e; margin: 0; }

  /* Floating coin effect */
  .coin-burst {
    position: absolute;
    pointer-events: none;
    font-size: 2rem;
    font-weight: 800;
    color: #FFD166;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    animation: floatCoin 1.2s ease-out forwards;
    z-index: 99;
  }
  @keyframes floatCoin {
    0% { opacity: 1; transform: translateY(0) scale(0.8); }
    50% { opacity: 1; transform: translateY(-40px) scale(1.3); }
    100% { opacity: 0; transform: translateY(-80px) scale(1); }
  }

  /* Intro / final */
  .hero-emoji { font-size: 72px; text-align: center; margin-bottom: 8px; }
  .lead-text { text-align: center; font-size: 17px; color: #4b5a5f; line-height: 1.7; margin-bottom: 18px; }
  .rules-list { font-size: 15.5px; color: #3d4a4e; line-height: 1.9; background: #FFF; border-radius: 16px; padding: 16px 20px; border: 3px solid var(--parchment-dark); }
  .star-line { font-size: 32px; letter-spacing: 4px; text-align: center; margin: 8px 0; }
  .footer-note { text-align: center; color: #FFF; font-size: 14px; margin-top: 18px; opacity: 0.9; }

  /* 作業簿隨堂考 Modal 與按鈕式選項 */
  .wb-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(74, 30, 0, 0.85);
    backdrop-filter: blur(8px);
    z-index: 1000;
    overflow-y: auto;
    padding: 20px 12px 60px;
  }
  .wb-modal-overlay.open { display: block; }
  .wb-modal-content {
    background: #FFFDF5;
    border: 4px solid var(--ink);
    border-radius: 24px;
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 20px;
    color: var(--ink);
    box-shadow: 0 16px 40px rgba(0,0,0,0.4);
  }
  .wb-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--parchment-dark);
    padding-bottom: 12px;
    margin-bottom: 16px;
  }
  .wb-title { font-size: 21px; font-weight: 800; color: var(--kitchen-red); display: flex; align-items: center; gap: 8px; }
  .wb-close-btn {
    width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--ink); background: #FFF;
    font-weight: 900; font-size: 18px; cursor: pointer;
  }
  .wb-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .wb-tab {
    flex: 1; min-width: 140px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--parchment-dark);
    background: #FFF; font-weight: 800; font-size: 13.5px; cursor: pointer; color: #5C6B70;
    text-align: center; transition: all 0.2s;
  }
  .wb-tab.active { background: var(--gold); border-color: var(--gold-dark); color: #3a2600; box-shadow: 0 4px 0 var(--gold-dark); }
  .wb-sec-card { background: #FFF; border: 2px solid var(--parchment-dark); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  .wb-sec-title { font-size: 16px; font-weight: 800; color: var(--kitchen-red); margin-bottom: 12px; border-bottom: 1.5px dashed var(--parchment-dark); padding-bottom: 6px; }
  .wb-q-item { background: #FBF0D3; border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 2px solid var(--parchment-dark); transition: all 0.3s ease; position: relative; }
  .wb-q-item.is-correct { border: 3px solid #10B981 !important; background: #ECFDF5 !important; }
  .wb-q-item.is-wrong { border: 3px solid #EF4444 !important; background: #FEF2F2 !important; }
  .wb-q-badge {
    display: inline-block; padding: 3px 10px; border-radius: 8px; font-size: 13px; font-weight: 800; margin-bottom: 8px;
  }
  .wb-q-badge.correct { background: #10B981; color: #FFF; }
  .wb-q-badge.wrong { background: #EF4444; color: #FFF; }
  
  .wb-q-text { font-size: 15.5px; font-weight: 700; line-height: 1.6; margin-bottom: 10px; color: var(--ink); }
  
  /* 作業簿選項大按鈕網格 (直接點選) */
  .wb-opt-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-top: 8px;
  }
  .wb-opt-btn {
    background: #FFFFFF;
    border: 2px solid #E76F51;
    border-radius: 14px;
    padding: 10px 14px;
    min-height: 54px;
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 0 rgba(38, 70, 83, 0.15);
    user-select: none;
  }
  .wb-opt-btn:hover {
    background: #FFF3E0;
    border-color: var(--kitchen-red);
    transform: translateY(-2px);
    box-shadow: 0 5px 0 rgba(38, 70, 83, 0.2);
  }
  .wb-opt-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(38, 70, 83, 0.15);
  }
  .wb-opt-btn.selected {
    background: var(--gold) !important;

<script>
/* ================= 音效合成器 (Web Audio API Synthesizer) ================= */
let soundEnabled = true;
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇';
  document.getElementById('soundText').textContent = soundEnabled ? '音效 ON' : '音效 OFF';
}

function playSound(type) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;
    if (type === 'click') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, now);
      osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'correct') {
      const freqs = [523.25, 659.25, 783.99, 1046.50];
      freqs.forEach((f, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now + idx * 0.08);
        gain.gain.setValueAtTime(0.25, now + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 0.25);
      });
    } else if (type === 'wrong') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.linearRampToValueAtTime(120, now + 0.25);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'fanfare') {
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      notes.forEach((f, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(f, now + idx * 0.12);
        gain.gain.setValueAtTime(0.2, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + 0.4);
      });
    }
  } catch (e) {}
}

/* ================= 遊戲基本資料與狀態 ================= */
const ISLES = [
  {key:'l1', icon:'🍕', label:'最簡切片'},
  {key:'l2', icon:'🥖', label:'同分母除'},
  {key:'l3', icon:'🥪', label:'整數除分數'},
  {key:'l4', icon:'🧀', label:'異分母除'},
  {key:'l5', icon:'🏆', label:'商之秘寶'},
];

const state = {
  stage: 'intro',
  stars: {l1:0,l2:0,l3:0,l4:0,l5:0},
  combo: 0
};

function starsToText(n){ return '⭐'.repeat(n) + '☆'.repeat(3-n); }

function updateMascot(avatar, speech) {
  const elAvatar = document.getElementById('mascotAvatar');
  const elSpeech = document.getElementById('mascotSpeech');
  if (elAvatar) elAvatar.textContent = avatar;
  if (elSpeech) elSpeech.textContent = speech;
}

function addCombo() {
  state.combo++;
  const badge = document.getElementById('comboBadge');
  const txt = document.getElementById('comboText');
  if (state.combo >= 2) {
    badge.style.display = 'flex';
    txt.textContent = `連勝 x${state.combo}`;
  }
}
function resetCombo() {
  state.combo = 0;
  document.getElementById('comboBadge').style.display = 'none';
}

function spawnCoinEffect(event) {
  const coin = document.createElement('div');
  coin.className = 'coin-burst';
  coin.textContent = '🍕 +10';
  const rect = event ? event.target.getBoundingClientRect() : { left: window.innerWidth/2, top: window.innerHeight/2 };
  coin.style.left = `${rect.left + 10}px`;
  coin.style.top = `${rect.top - 20}px`;
  document.body.appendChild(coin);
  setTimeout(() => coin.remove(), 1200);
}

/* ================= 數學排版輔助函數 (KaTeX) ================= */
function formatMath(text) {
  if (text === null || text === undefined) return '';
  let str = String(text);
  
  // 1. 帶分數：例如 6又1/3 -> 6\,\dfrac{1}{3}（加入微間隙與大分數）
  str = str.replace(/(\d+)\s*又\s*(\d+)\/(\d+)/g, '$1\\,\\dfrac{$2}{$3}');
  
  // 2. 一般純分數：例如 1/3 -> \dfrac{1}{3}
  str = str.replace(/(?<![\d\/])(\d+)\/(\d+)(?![\d\/])/g, '\\dfrac{$1}{$2}');
  
  // 3. 括號算式分數：例如 (3×4)/5 -> \dfrac{3 \times 4}{5}
  str = str.replace(/\(([0-9\s×\*\+\-\÷]+)\)\/([0-9]+)/g, '\\dfrac{$1}{$2}');
  
  // 4. 運算符號
  str = str.replace(/÷/g, ' \\div ');
  str = str.replace(/×/g, ' \\times ');
  str = str.replace(/□/g, ' \\square ');
  str = str.replace(/=>/g, ' \\Rightarrow ');

  if (typeof katex !== 'undefined') {
    // 尋找含有數學公式的片段進行 KaTeX 渲染
    return str.replace(/((?:\\dfrac\{[^{}]+\}\{[^{}]+\}|[0-9\+\-\=\>\<\(\)\.\,\s]|\b\d+\b|\\div|\\times|\\square|\\Rightarrow|\\,)+)/g, function(match) {
      const trimmed = match.trim();
      if (!trimmed) return match;
      if (trimmed.includes('\\dfrac') || trimmed.includes('\\div') || trimmed.includes('\\times') || trimmed.includes('\\square') || trimmed.includes('\\Rightarrow') || (trimmed.includes('=') && /\d/.test(trimmed))) {
        try {
          return katex.renderToString('\\displaystyle ' + trimmed, { throwOnError: false, displayMode: false });
        } catch(e) {
          return match;
        }
      }
      return match;
    });
  }
  return str;
}

/* ================= 名詞小百科 ================= */
const GLOSSARY = [
  { key:'simplest', title:'最簡分數', def:'當一個分數的分子和分母「互質」（最大公因數是 1）時，這個分數就叫作最簡分數。例如 2/3、5/7。' },
  { key:'reciprocal', title:'倒數 (上下顛倒)', def:'把一個分數的分子和分母位置對調，得到的新分數就是它的倒數。例如 3/5 的倒數是 5/3。除以一個分數就等於乘以它的倒數！' },
  { key:'sameDenom', title:'同分母除法', def:'分母相同的分數相除，分母會互相抵消，直接等於「分子除以分子」。例如 (8/9) ÷ (2/9) = 8 ÷ 2 = 4。' },
  { key:'diffDenom', title:'異分母分數除法', def:'分母不同的分數相除時，可以先通分再算，或者直接使用黃金法則：「除號變乘號，除數顛倒成倒數」。' },
  { key:'quotientRule', title:'被除數、除數和商的關係', def:'當除數 > 1 時，商 < 被除數；當除數 < 1 時，商 > 被除數；當除數 = 1 時，商 = 被除數。' }
];

function term(key, label){
  return `<span class="term" tabindex="0" onclick="openGlossary('${key}')">${label}<sup>ⓘ</sup></span>`;
}

function renderGlossaryList(){
  const list = document.getElementById('glossaryList');
  list.innerHTML = GLOSSARY.map(g => `
    <div class="def-card" id="def-${g.key}">
      <h3>🔖 ${g.title}</h3>
      <p>${g.def}</p>
    </div>`).join('');
}

function openGlossary(key){
  playSound('click');
  renderGlossaryList();
  document.getElementById('glossaryOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeGlossary(){
  document.getElementById('glossaryOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

/* ================= 進度列渲染 ================= */
function renderPath(){
  const bar = document.getElementById('pathBar');
  bar.innerHTML = '';
  const order = ['l1','l2','l3','l4','l5'];
  order.forEach((key,i)=>{
    const isle = ISLES[i];
    const div = document.createElement('div');
    div.className = 'isle';
    if(state.stars[key] > 0) div.classList.add('done');
    if(state.stage === key) div.classList.add('active');
    div.onclick = () => goto(key);
    div.innerHTML = `
      <div class="dot">${state.stars[key] > 0 ? '✅' : isle.icon}</div>
      <div class="stars">${state.stars[key] > 0 ? starsToText(state.stars[key]) : ''}</div>
      <div class="label">${isle.label}</div>`;
    bar.appendChild(div);
  });
}

function goto(stage){
  playSound('click');
  state.stage = stage;
  renderPath();
  const c = document.getElementById('content');
  c.innerHTML = '';
  if(stage === 'intro') renderIntro(c);
  else if(stage === 'l1') renderLevel1(c);
  else if(stage === 'l2') renderLevel2(c);
  else if(stage === 'l3') renderLevel3(c);
  else if(stage === 'l4') renderLevel4(c);
  else if(stage === 'l5') renderLevel5(c);
  else if(stage === 'final') renderFinal(c);
}

/* ================= 關卡實作 ================= */
function renderIntro(c){
  updateMascot('👨‍🍳', '歡迎來到披薩烘焙坊！一起挑戰五大分數料理關卡，成為特級大廚吧！');
  c.innerHTML = `
    <div class="hero-emoji">🍕🥖🥪</div>
    <h2 class="stage-title" style="justify-content:center;">歡迎來到披薩料理廚房！</h2>
    <p class="lead-text">掌握分數除法的神奇秘笈，完成五道關卡，贏得米其林特級大廚星章！</p>
    <div class="rules-list">
      🍕 最簡切片：找出「${term('simplest','最簡分數')}」並約分<br>
      🥖 同分母除：掌握「${term('sameDenom','同分母除法')}」，分子直接除分子<br>
      🥪 整數除分數：整數轉換成「${term('reciprocal','顛倒相乘')}」<br>
      🧀 異分母除：「${term('diffDenom','異分母分數除法')}」料理大考驗<br>
      🏆 商之秘寶：判斷「${term('quotientRule','被除數、除數與商的大小關係')}」
    </div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn coral" onclick="goto('l1')">👨‍🍳 立即開始料理！</button>
    </div>
  `;
}

function renderLevel1(c){
  updateMascot('🍕', '第一關：最簡切片！請選出「最簡分數」（分子與分母不能再約分）。');
  const pool = [
    {q:'22/105', correct:true, note:'22和105互質，是最簡分數！'},
    {q:'18/45', correct:false, note:'18和45可以同除以9，約成 2/5！'},
    {q:'52/91', correct:false, note:'52和91可以同除以13，約成 4/7！'},
    {q:'7/15', correct:true, note:'7和15互質，是最簡分數！'},
    {q:'51/126', correct:false, note:'51和126可以同除以3，約成 17/42！'},
    {q:'11/15', correct:true, note:'11和15互質，是最簡分數！'}
  ];
  let idx = 0, mistakes = 0;

  function draw(){
    if (idx >= pool.length) {
      state.stars.l1 = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
      showLevelDone(c, '🍕 最簡切片', state.stars.l1, 'l2', '太棒了！你已經能精準辨別最簡分數！');
      return;
    }
    const item = pool[idx];
    c.innerHTML = `
      <h2 class="stage-title">🍕 第一關：最簡切片</h2>
      <p class="stage-sub">判斷以下分數是否為 <b>最簡分數</b>？（第 ${idx+1} / ${pool.length} 題）</p>
      <div style="text-align:center;">
        <div class="fraction-display">${formatMath(item.q)}</div>
      </div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn leaf" onclick="checkL1(true, event)">⭕ 是最簡分數</button>
        <button class="btn coral" onclick="checkL1(false, event)">❌ 可以再約分</button>
      </div>
      <div class="feedback" id="fb1"></div>
    `;
  }

  window.checkL1 = function(userPick, ev){
    const item = pool[idx];
    const fb = document.getElementById('fb1');
    if (userPick === item.correct) {
      playSound('correct');
      addCombo();
      spawnCoinEffect(ev);
      fb.className = 'feedback ok';
      fb.innerHTML = `🎉 答對了！${formatMath(item.note)}`;
      setTimeout(() => { idx++; draw(); }, 1000);
    } else {
      playSound('wrong');
      resetCombo();
      mistakes++;
      fb.className = 'feedback bad shake';
      fb.innerHTML = `😅 答錯囉！${formatMath(item.note)}`;
      setTimeout(() => fb.classList.remove('shake'), 400);
    }
  };
  draw();
}

function renderLevel2(c){
  updateMascot('🥖', '第二關：同分母除法！分母相同時，分子直接相除：(A/B) ÷ (C/B) = A ÷ C！');
  const pool = [
    {q:'8/9 ÷ 2/9', ans:'4', options:['4', '2', '16/81', '1/4'], steps:'8 ÷ 2 = 4'},
    {q:'21/20 ÷ 7/20', ans:'3', options:['3', '7', '147/400', '1/3'], steps:'21 ÷ 7 = 3'},
    {q:'10/45 ÷ 2/45', ans:'5', options:['5', '20', '2/9', '1/5'], steps:'10 ÷ 2 = 5'},
    {q:'12/5 ÷ 3/5', ans:'4', options:['4', '36/25', '1/4', '15'], steps:'12 ÷ 3 = 4'}
  ];
  let idx = 0;
  function draw(){
    if (idx >= pool.length) {
      state.stars.l2 = 3;
      showLevelDone(c, '🥖 同分母除法', 3, 'l3', '太神了！同分母除法已經難不倒你！');
      return;
    }
    const item = pool[idx];
    c.innerHTML = `
      <h2 class="stage-title">🥖 第二關：同分母除法</h2>
      <p class="stage-sub">請選擇正確計算結果：（第 ${idx+1} / ${pool.length} 題）</p>
      <div style="text-align:center;">
        <div class="fraction-display">${formatMath(item.q)}</div>
      </div>
      <div class="opt-grid">
        ${item.options.map(opt => `<button class="opt-btn" onclick="checkL2('${opt}', event)">${formatMath(opt)}</button>`).join('')}

let fracCurrentRevId = 4;
let fracAnswers = {};

function openFracWbModal() {
  playSound('click');
  document.getElementById('fracWbModalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  switchFracWbRev(4);
}
function closeFracWbModal() {
  document.getElementById('fracWbModalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function switchFracWbRev(revId) {
  fracCurrentRevId = revId;
  fracAnswers = {};
  document.querySelectorAll('#fracWbModalOverlay .wb-tab').forEach((t, i) => t.classList.toggle('active', i + 4 === revId));
  document.getElementById('fracWbScoreDisp').textContent = '狀態：做題中（未交卷）';
  renderFracWbQuizBody();
}

function fracPick(itemId, val, btnEl) {
  playSound('click');
  fracAnswers[itemId] = val;
  const parent = btnEl.closest('.wb-opt-grid');
  if (parent) {
    parent.querySelectorAll('.wb-opt-btn').forEach(b => b.classList.remove('selected'));
    btnEl.classList.add('selected');
  }
}

function renderFracWbQuizBody() {
  const rev = U2_WB_DATA.reviews.find(r => r.review_id === fracCurrentRevId);
  const container = document.getElementById('fracWbQuizBody');
  if (!rev) return;

  let html = '';
  rev.sections.forEach((sec, sIdx) => {
    html += `<div class="wb-sec-card">
      <div class="wb-sec-title">📌 ${sec.section_title}</div>`;

    if (sec.type === 'quotient_relations' && sec.options_pool) {
      html += '<div style="background:#FFF8F0; padding:10px; border-radius:10px; margin-bottom:12px; font-size:14px; border:1px solid #F4A261;"><b>算式代號庫：</b><br>';
      for (const [k, v] of Object.entries(sec.options_pool)) {
        html += `【${k}】 ${formatMath(v)}　`;
      }
      html += '</div>';
    }

    sec.items.forEach((item, iIdx) => {
      const itemId = `u2_r${fracCurrentRevId}_s${sIdx}_${iIdx}`;
      let itemOpts = item.options || [];

      if (!itemOpts || itemOpts.length === 0) {
        if (sec.type === 'comparison') itemOpts = ['>', '<', '='];
        else itemOpts = [item.ans, '1又1/2', '2/3', '4'];
      }

      html += `
        <div class="wb-q-item">
          <div class="wb-q-text">${formatMath(item.q)}</div>
          <div class="wb-opt-grid">
            ${itemOpts.map(opt => `
              <button type="button" class="wb-opt-btn ${fracAnswers[itemId] === opt ? 'selected' : ''}" data-opt="${opt}" onclick="fracPick('${itemId}', '${opt}', this)">
                ${formatMath(opt)}
              </button>
            `).join('')}
          </div>
          <div class="wb-sol-panel" id="sol_${itemId}">
            <div class="wb-sol-steps">${formatMath(item.steps || item.explanation || '')}</div>
            <div class="wb-sol-ans">標準答案：${formatMath(item.ans)}</div>
          </div>
        </div>`;
    });

    html += '</div>';
  });
  container.innerHTML = html;
}

function gradeFracWbQuiz() {
  const rev = U2_WB_DATA.reviews.find(r => r.review_id === fracCurrentRevId);
  let total = 0, correct = 0;

  rev.sections.forEach((sec, sIdx) => {
    sec.items.forEach((item, iIdx) => {
      total++;
      const itemId = `u2_r${fracCurrentRevId}_s${sIdx}_${iIdx}`;
      const userVal = fracAnswers[itemId] || '';
      let isRight = false;

      const cleanUser = userVal.replace(/[\s]/g, '').replace(/段|公尺|次|倍|瓶|元|包|公升/g, '');
      const cleanAns = String(item.ans).replace(/[\s]/g, '').replace(/段|公尺|次|倍|瓶|元|包|公升/g, '');

      if (cleanUser === cleanAns || cleanUser.includes(cleanAns)) {
        isRight = true;
      } else if (cleanAns.includes('或')) {
        const parts = cleanAns.split('或');
        isRight = parts.some(p => cleanUser.includes(p.trim().replace(/[\s\(\)]/g, '')));
      } else if (cleanAns.includes('、')) {
        const parts = cleanAns.split('、');
        isRight = parts.every(p => cleanUser.includes(p.trim()));
      }

      if (isRight) correct++;

      // 取得題目卡片與該題所有選項按鈕
      const panel = document.getElementById(`sol_${itemId}`);
      const qItem = panel ? panel.closest('.wb-q-item') : null;
      
      if (qItem) {
        // 設定題目卡片邊框與背景
        qItem.classList.remove('is-correct', 'is-wrong');
        qItem.classList.add(isRight ? 'is-correct' : 'is-wrong');
        
        // 移除舊 badge
        const oldBadge = qItem.querySelector('.wb-q-badge');
        if (oldBadge) oldBadge.remove();
        
        // 插入醒目標籤
        const badge = document.createElement('div');
        badge.className = `wb-q-badge ${isRight ? 'correct' : 'wrong'}`;
        badge.innerHTML = isRight ? '✓ 答對了！' : (userVal ? '✕ 答錯了！' : '⚠️ 未作答！');
        qItem.insertBefore(badge, qItem.firstChild);

        // 遍歷所有選項按鈕標註顏色
        const btns = qItem.querySelectorAll('.wb-opt-btn');
        btns.forEach(btn => {
          btn.classList.remove('opt-correct', 'opt-wrong', 'opt-should-be');
          const btnVal = btn.dataset.opt || btn.textContent.trim();
          const cleanBtn = btnVal.replace(/[\s]/g, '').replace(/段|公尺|次|倍|瓶|元|包|公升/g, '');
          
          const isBtnAns = (cleanBtn === cleanAns || cleanBtn.includes(cleanAns) || (cleanAns.includes('或') && cleanAns.split('或').some(p => cleanBtn.includes(p.trim().replace(/[\s\(\)]/g, '')))));
          
          if (btnVal === userVal) {
            if (isRight) {
              btn.classList.add('opt-correct');
              btn.innerHTML = `✓ ${formatMath(btnVal)}`;
            } else {
              btn.classList.add('opt-wrong');
              btn.innerHTML = `✕ ${formatMath(btnVal)}`;
            }
          } else if (isBtnAns && !isRight) {
            btn.classList.add('opt-should-be');
            btn.innerHTML = `★ 正解：${formatMath(btnVal)}`;
          }
        });
      }

      if (panel) {
        panel.classList.add('show');
        panel.style.borderLeft = isRight ? '6px solid #10B981' : '6px solid #EF4444';
      }
    });
  });

  const score = Math.round((correct / total) * 100);
  document.getElementById('fracWbScoreDisp').innerHTML = `得分：<b>${score} 分</b> (${correct} / ${total} 題正確)`;
  if (score >= 80) {
    playSound('fanfare');
    if (window.confetti) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
  } else {
    playSound('correct');
  }
  alert(`🎉 隨堂測驗批改完成！\n\n得分：${score} 分\n綠色為答對選項，紅色為答錯選項，綠色虛線為標準正解！✨`);
}

function resetFracWbQuiz() {
  fracAnswers = {};
  renderFracWbQuizBody();
  document.getElementById('fracWbScoreDisp').textContent = '狀態：做題中（未交卷）';
}

goto('intro');
