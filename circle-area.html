<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>圓周長與圓面積奇幻王國 🌕 南一版 6上數學 第4單元</title>
<meta name="description" content="南一版 6年級上學期 數學第4單元：圓周長和圓面積。認識圓周率 3.14、圓周長公式、圓面積計算、複合圖形塗色面積，5大闖關與作業簿第10-12回完整題庫！">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
<style>
  :root {
    --moon-purple: #5A189A;
    --moon-dark: #240046;
    --moon-violet: #7B2CBF;
    --moon-gold: #FFB703;
    --ink: #240046;
    --gold: #FFB703;
    --gold-dark: #D48800;
    --parchment: #FFFDF5;
    --parchment-dark: #E9D9A6;
    --coral: #9D4EDD;
    --leaf: #06D6A0;
    --shadow: 0 10px 0 rgba(36, 0, 70, 0.25);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.18), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(255, 183, 3, 0.15), transparent 45%),
      linear-gradient(180deg, #10002B 0%, #240046 40%, #5A189A 80%, #7B2CBF 100%);
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 16px 12px 60px;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    padding-bottom: max(60px, calc(env(safe-area-inset-bottom) + 40px));
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }

  /* 背景動態波浪動畫 */
  .bg-waves {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 120px;
    background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(255, 183, 3, 0.08)" d="M0,192L48,197.3C96,203,192,213,288,192C384,171,480,117,576,112C672,107,768,149,864,165.3C960,181,1056,171,1152,149.3C1248,128,1344,96,1392,80L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x;
    background-size: 1440px 120px;
    animation: waveMove 12s infinite linear;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes waveMove {
    0% { background-position-x: 0; }
    100% { background-position-x: 1440px; }
  }

  .app {
    width: 100%;
    max-width: 780px;
    position: relative;
    z-index: 1;
  }

  button, .term, .isle {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  h1, h2, h3 { font-family: 'Baloo 2', 'Noto Sans TC', sans-serif; margin: 0; }

  /* ---------- Top Navigation Bar ---------- */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 20px;
    color: #FFF;
    font-weight: 700;
    font-size: 0.9rem;
    text-decoration: none;
    backdrop-filter: blur(5px);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .nav-btn:hover {
    background: rgba(255, 255, 255, 0.35);
    transform: translateY(-2px);
  }

  .combo-badge {
    background: linear-gradient(135deg, #FF9E00, #FF0054);
    color: #FFF;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 800;
    font-size: 0.92rem;
    box-shadow: 0 4px 10px rgba(255, 0, 84, 0.3);
    display: flex;
    align-items: center;
    gap: 4px;
    animation: pulse 1.5s infinite alternate;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.08); }
  }

  /* ---------- Header ---------- */
  .header {
    text-align: center;
    color: #fff;
    margin-bottom: 14px;
  }

  .header .eyebrow {
    font-size: 14px;
    letter-spacing: 3px;
    font-weight: 700;
    opacity: 0.9;
    background: rgba(255, 255, 255, 0.15);
    display: inline-block;
    padding: 3px 12px;
    border-radius: 12px;
    margin-bottom: 4px;
  }

  .header h1 {
    font-size: clamp(28px, 6.5vw, 42px);
    text-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
    margin: 4px 0 2px;
    letter-spacing: 1px;
  }

  .header p {
    font-size: 16px;
    opacity: 0.95;
    margin: 0;
  }

  /* ---------- Animated Mascot & Progress path ---------- */
  .mascot-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    padding: 10px 16px;
    backdrop-filter: blur(4px);
  }

  .mascot-avatar {
    font-size: 2.8rem;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
    animation: floatMascot 2s ease-in-out infinite alternate;
    user-select: none;
  }

  @keyframes floatMascot {
    0% { transform: translateY(0) rotate(-3deg); }
    100% { transform: translateY(-6px) rotate(3deg); }
  }

  .mascot-speech {
    background: #FFFFFF;
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 16px;
    font-size: 0.95rem;
    font-weight: 700;
    position: relative;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    max-width: 80%;
  }

  .mascot-speech::before {
    content: '';
    position: absolute;
    left: -10px;
    top: 50%;
    transform: translateY(-50%);
    border-width: 6px 10px 6px 0;
    border-style: solid;
    border-color: transparent #FFFFFF transparent transparent;
  }

  /* Path bar */
  .path-wrap {
    background: rgba(255, 255, 255, 0.16);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    padding: 16px 10px 12px;
    margin-bottom: 18px;
    backdrop-filter: blur(4px);
    position: relative;
  }

  .path {
    display: flex;
    justify-content: space-between;
    position: relative;
    padding: 0 4px;
  }

  .path::before {
    content: "";
    position: absolute;
    top: 22px; left: 6%; right: 6%;
    height: 6px;
    background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.8) 0 10px, transparent 10px 18px);
    z-index: 0;
    border-radius: 3px;
  }

  .isle {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 19%;
    cursor: pointer;
  }

  .isle .dot {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: var(--parchment-dark);
    border: 3px solid #fff;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .isle.active .dot {
    background: #FFB703;
    transform: scale(1.2);
    animation: bob 1.2s ease-in-out infinite;
    box-shadow: 0 0 15px rgba(255, 183, 3, 0.6);
  }

  .isle.done .dot {
    background: #06D6A0;
    border-color: #E2F1E7;
  }

  .isle .stars {
    font-size: 13px;
    color: #fff;
    min-height: 16px;
    letter-spacing: 1px;
  }

  .isle .label {
    font-size: 12.5px;
    color: #fff;
    text-align: center;
    font-weight: 700;
    opacity: 0.95;
    line-height: 1.2;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) scale(1.2); }
    50% { transform: translateY(-6px) scale(1.2); }
  }

  /* ---------- Main Card ---------- */
  .card {
    background: var(--parchment);
    border: 4px solid var(--ink);
    border-radius: 26px;
    padding: clamp(18px, 4vw, 28px) clamp(16px, 4vw, 26px) clamp(22px, 5vw, 30px);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    min-height: 340px;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(36, 0, 70, 0.04) 1.5px, transparent 1.5px);
    background-size: 16px 16px;
    pointer-events: none;
  }

  .stage-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(22px, 5vw, 30px);
    color: var(--moon-purple);
    margin-bottom: 8px;
    font-weight: 800;
  }

  .stage-sub {
    font-size: 16.5px;
    color: #4b5a5f;
    margin-bottom: 18px;
    line-height: 1.65;
  }

  .content { position: relative; z-index: 1; }

  /* Buttons */
  .btn {
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 800;
    font-size: 19px;
    padding: 14px 26px;
    min-height: 52px;
    border-radius: 16px;
    border: 3px solid var(--ink);
    cursor: pointer;
    background: var(--moon-purple);
    color: #fff;
    box-shadow: 0 5px 0 #3c096c;
    transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #3c096c; }

  .btn.gold { background: var(--gold); box-shadow: 0 5px 0 var(--gold-dark); color: #3a2600; }
  .btn.coral { background: #9D4EDD; box-shadow: 0 5px 0 #5A189A; }
  .btn.leaf { background: #06D6A0; box-shadow: 0 5px 0 #059669; }

  .btn-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
  .btn.small { padding: 10px 18px; font-size: 16px; border-radius: 12px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25); }

  .feedback {
    margin-top: 16px;
    font-weight: 700;
    font-size: 17.5px;
    min-height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 12px;
    transition: all 0.3s ease;
  }
  .feedback.ok { color: #0E7C7B; background: #E6F8F6; border: 2px solid #2EC4B6; }
  .feedback.bad { color: #D63031; background: #FFE5E5; border: 2px solid #FF4757; }

  .shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px); }
    40%, 80% { transform: translateX(10px); }
  }

  /* Glossary Tooltip & FAB */
  .term {
    color: var(--moon-purple);
    font-weight: 800;
    border-bottom: 2px dotted #9D4EDD;
    cursor: pointer;
    padding: 0 2px;
    white-space: nowrap;
  }
  .term:hover { background: rgba(157, 78, 221, 0.18); border-radius: 4px; }
  .term sup { font-size: 12px; color: var(--moon-purple); margin-left: 1px; }

  .glossary-fab {
    position: fixed;
    right: 18px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    z-index: 50;
    background: var(--gold);
    color: #3a2600;
    border: 3px solid #fff;
    border-radius: 999px;
    padding: 12px 18px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    cursor: pointer;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(36, 0, 70, 0.7);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }

  .modal-card {
    background: var(--parchment);
    border: 4px solid var(--ink);
    border-radius: 24px;
    max-width: 580px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
  }

  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-close { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; font-weight: 800; cursor: pointer; }

  .def-card {
    background: #fff;
    border: 2px solid var(--parchment-dark);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .def-card h3 { font-size: 18px; color: var(--moon-purple); margin-bottom: 6px; }
  .def-card p { font-size: 15px; line-height: 1.7; color: #3d4a4e; margin: 0; }

  /* Floating coin effect */
  .coin-burst {
    position: absolute;
    pointer-events: none;
    font-size: 2rem;
    font-weight: 800;
    color: #FFD166;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    animation: floatCoin 1.2s ease-out forwards;
    z-index: 99;
  }
  @keyframes floatCoin {
    0% { opacity: 1; transform: translateY(0) scale(0.8); }
    50% { opacity: 1; transform: translateY(-40px) scale(1.3); }
    100% { opacity: 0; transform: translateY(-80px) scale(1); }
  }

  /* Intro / final */
  .hero-emoji { font-size: 72px; text-align: center; margin-bottom: 8px; }
  .lead-text { text-align: center; font-size: 17px; color: #4b5a5f; line-height: 1.7; margin-bottom: 18px; }
  .rules-list { font-size: 15.5px; color: #3d4a4e; line-height: 1.9; background: #FFF; border-radius: 16px; padding: 16px 20px; border: 3px solid var(--parchment-dark); }
  .star-line { font-size: 32px; letter-spacing: 4px; text-align: center; margin: 8px 0; }
  .footer-note { text-align: center; color: #FFF; font-size: 14px; margin-top: 18px; opacity: 0.9; }

  /* 作業簿隨堂考 Modal */
  .wb-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(36, 0, 70, 0.85);
    backdrop-filter: blur(8px);
    z-index: 1000;
    overflow-y: auto;
    padding: 20px 12px 60px;
  }
  .wb-modal-overlay.open { display: block; }
  .wb-modal-content {
    background: #FFFDF5;
    border: 4px solid var(--ink);
    border-radius: 24px;
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 20px;
    color: var(--ink);
    box-shadow: 0 16px 40px rgba(0,0,0,0.4);
  }
  .wb-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--parchment-dark);
    padding-bottom: 12px;
    margin-bottom: 16px;
  }
  .wb-title { font-size: 21px; font-weight: 800; color: var(--moon-purple); display: flex; align-items: center; gap: 8px; }
  .wb-close-btn {
    width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--ink); background: #FFF;
    font-weight: 900; font-size: 18px; cursor: pointer;
  }
  .wb-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .wb-tab {
    flex: 1; min-width: 140px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--parchment-dark);
    background: #FFF; font-weight: 800; font-size: 13.5px; cursor: pointer; color: #5C6B70;
    text-align: center; transition: all 0.2s;
  }
  .wb-tab.active { background: var(--gold); border-color: var(--gold-dark); color: #3a2600; box-shadow: 0 4px 0 var(--gold-dark); }
  .wb-sec-card { background: #FFF; border: 2px solid var(--parchment-dark); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  .wb-sec-title { font-size: 16px; font-weight: 800; color: var(--moon-purple); margin-bottom: 12px; border-bottom: 1.5px dashed var(--parchment-dark); padding-bottom: 6px; }
  .wb-q-item { background: #FBF0D3; border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 2px solid var(--parchment-dark); transition: all 0.3s ease; position: relative; }
  .wb-q-item.is-correct { border: 3px solid #10B981 !important; background: #ECFDF5 !important; }
  .wb-q-item.is-wrong { border: 3px solid #EF4444 !important; background: #FEF2F2 !important; }
  .wb-q-badge {
    display: inline-block; padding: 3px 10px; border-radius: 8px; font-size: 13px; font-weight: 800; margin-bottom: 8px;
  }
  .wb-q-badge.correct { background: #10B981; color: #FFF; }
  .wb-q-badge.wrong { background: #EF4444; color: #FFF; }

  .wb-q-text { font-size: 15.5px; font-weight: 700; line-height: 1.6; margin-bottom: 10px; color: var(--ink); }

  /* 作業簿選項大按鈕網格 (直接點選) */
  .wb-opt-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-top: 8px;
  }
  .wb-opt-btn {
    background: #FFFFFF;
    border: 2px solid var(--moon-purple);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.15);
    user-select: none;
  }
  .wb-opt-btn:hover {
    background: #FFF3E0;
    border-color: var(--kitchen-red, #D9383A);
    transform: translateY(-2px);
    box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
  }
  .wb-opt-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
  }
  .wb-opt-btn.selected {
    background: var(--gold) !important;
    border-color: var(--gold-dark) !important;
    color: #3A2600 !important;
    box-shadow: 0 4px 0 var(--gold-dark) !important;
    transform: scale(1.02);
  }

  /* 批改鮮明顏色：選對 (翠綠色)、選錯 (鮮紅色)、正確答案提示 (綠色虛線) */
  .wb-opt-btn.opt-correct {
    background: linear-gradient(135deg, #10B981, #059669) !important;
    color: #FFFFFF !important;
    border: 3px solid #047857 !important;
    box-shadow: 0 0 12px rgba(16, 185, 129, 0.6) !important;
    transform: scale(1.03);
  }
  .wb-opt-btn.opt-wrong {
    background: linear-gradient(135deg, #EF4444, #DC2626) !important;
    color: #FFFFFF !important;
    border: 3px solid #991B1B !important;
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.6) !important;
    transform: scale(1.03);
  }
  .wb-opt-btn.opt-should-be {
    background: #D1FAE5 !important;
    color: #065F46 !important;
    border: 3px dashed #10B981 !important;
    font-weight: 900 !important;
  }

  .wb-sol-panel { display: none; background: #E6F8F6; border: 2px solid #2EC4B6; border-radius: 10px; padding: 12px; margin-top: 12px; font-size: 14px; }
  .wb-sol-panel.show { display: block; }
  .wb-sol-steps { font-family: 'Fredoka', monospace; background: #FFF; padding: 8px; border-radius: 6px; margin: 6px 0; white-space: pre-wrap; color: var(--ink); font-weight: 700; }
  .wb-sol-ans { color: #047857; font-weight: 900; font-size: 15px; }
  .wb-submit-bar {
    position: sticky; bottom: 0; background: #FFFDF5; border-top: 2px solid var(--parchment-dark);
    padding: 14px 0 0; display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; z-index: 10;
  }
  .wb-score-text { font-size: 18px; font-weight: 800; color: var(--moon-purple); }
  .wb-btn-submit {
    background: linear-gradient(135deg, #2EC4B6 0%, #0E7C7B 100%);
    border: none; color: #FFF; font-weight: 800; font-size: 15px; padding: 10px 24px;
    border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 #0A5A59;
  }

  @media (max-width: 480px) {
    .isle .label { display: none; }
    .isle .dot { width: 42px; height: 42px; font-size: 19px; }
    .mascot-speech { font-size: 0.85rem; padding: 6px 12px; }
  }
</style>
</head>
<body>

<div class="bg-waves"></div>

<div class="app">
  <!-- 頂部列：切換頁面、音效與作業簿 -->
  <div class="top-bar">
    <a href="index.html" class="nav-btn">

<script>
/* ================= 音效合成器 (Web Audio API Synthesizer) ================= */
let soundEnabled = true;
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇';
  document.getElementById('soundText').textContent = soundEnabled ? '音效 ON' : '音效 OFF';
}

function playSound(type) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;
    if (type === 'click') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'correct') {
      const freqs = [523.25, 659.25, 783.99, 1046.50];
      freqs.forEach((f, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now + idx * 0.08);
        gain.gain.setValueAtTime(0.25, now + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 0.25);
      });
    } else if (type === 'wrong') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.linearRampToValueAtTime(110, now + 0.25);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'fanfare') {
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      notes.forEach((f, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(f, now + idx * 0.12);
        gain.gain.setValueAtTime(0.2, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + 0.4);
      });
    }
  } catch (e) {}
}

/* ================= 遊戲基本資料與狀態 ================= */

function spawnCoinEffect(event) {

/* ================= 名詞小百科 ================= */
const GLOSSARY = [
  { key:'pi', title:'圓周率 (π ≈ 3.14)', def:'任何圓形的「圓周長除以直徑」所得的商都是一個固定常數，稱為圓周率，國小階段計算通常取 3.14。' },
  { key:'circumference', title:'圓周長公式', def:'圓周長 = 直徑 × 圓周率 = 半徑 × 2 × 3.14。若已知圓周長求直徑，則 直徑 = 圓周長 ÷ 3.14。' },
  { key:'circleArea', title:'圓面積公式', def:'圓面積 = 半徑 × 半徑 × 圓周率 (半徑 × 半徑 × 3.14)。' },
  { key:'ringArea', title:'圓環面積', def:'圓環面積 = 外大圓面積 - 內小圓面積 = (大半徑² - 小半徑²) × 3.14。' },
  { key:'ratioSquare', title:'半徑倍數與面積倍數', def:'當圓的半徑（或直徑）變成 N 倍時，圓周長會變成 N 倍，而圓面積會變成 N² 倍（N × N 倍）！' }
];

function term(key, label){
  return `<span class="term" tabindex="0" onclick="openGlossary('${key}')">${label}<sup>ⓘ</sup></span>`;
}

}

      setTimeout(() => fb.classList.remove('shake'), 400);
    }
  };
  draw();
}

function renderLevel5(c){
  updateMascot('🏆', '第五關：倍數奧秘！半徑變成 3 倍，圓面積會變成 3 × 3 = 9 倍！');
  const pool = [
    {q:'半徑 12 公尺的圓面積是半徑 4 公尺圓面積的幾倍？', ans:'9', steps:'(12 ÷ 4)² = 3² = 9 倍'},
    {q:'直徑 50 公尺的圓面積是直徑 10 公尺圓面積的幾倍？', ans:'25', steps:'(50 ÷ 10)² = 5² = 25 倍'}
  ];
  let idx = 0;
  function draw(){
    if (idx >= pool.length) {
      state.stars.l5 = 3;
      showLevelDone(c, '🏆 倍數奧秘殿堂', 3, 'final', '恭喜你！完整掌握圓形幾何的全部精髓！');
      return;
    }
    const item = pool[idx];
    c.innerHTML = `
      <h2 class="stage-title">🏆 第五關：倍數奧秘</h2>
      <p class="stage-sub">${item.q}（第 ${idx+1} / ${pool.length} 題）</p>
      <div style="text-align:center; margin:20px 0;">
        <input type="text" class="wb-input" id="l5Inp" style="font-size:24px; text-align:center; width:140px;" placeholder="倍數">
      </div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn gold" onclick="checkL5(event)">確認送出</button>
      </div>
      <div class="feedback" id="fb5"></div>
    `;
  }
  window.checkL5 = function(ev){
    const val = document.getElementById('l5Inp').value.trim().replace(/倍/g, '');
    const item = pool[idx];
    const fb = document.getElementById('fb5');
    if (val === item.ans) {
      playSound('correct');
      addCombo();
      spawnCoinEffect(ev);
      fb.className = 'feedback ok';
      fb.textContent = `🎉 答對了！${item.steps}`;
      setTimeout(() => { idx++; draw(); }, 1000);
    } else {
      playSound('wrong');
      resetCombo();
      fb.className = 'feedback bad shake';
      fb.textContent = `😅 記得半徑是 N 倍時，面積是 N × N 倍！(${item.steps})`;
      setTimeout(() => fb.classList.remove('shake'), 400);
    }
  };
  draw();
}

let circleCurrentRevId = 10;
let circleAnswers = {};

function openCircleWbModal() {
  playSound('click');
  document.getElementById('circleWbModalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  switchCircleWbRev(10);
}
function closeCircleWbModal() {
  document.getElementById('circleWbModalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function switchCircleWbRev(revId) {
  circleCurrentRevId = revId;
  circleAnswers = {};
  document.querySelectorAll('#circleWbModalOverlay .wb-tab').forEach((t, i) => t.classList.toggle('active', i + 10 === revId));
  document.getElementById('circleWbScoreDisp').textContent = '狀態：做題中（未交卷）';
  renderCircleWbQuizBody();
}

function circlePick(itemId, val, btnEl) {
  playSound('click');
  circleAnswers[itemId] = val;
  const parent = btnEl.closest('.wb-opt-grid');
  if (parent) {
    parent.querySelectorAll('.wb-opt-btn').forEach(b => b.classList.remove('selected'));
    btnEl.classList.add('selected');
  }
}

function renderCircleWbQuizBody() {
  if (!U4_WB_DATA) return;
  const rev = U4_WB_DATA.reviews.find(r => r.review_id === circleCurrentRevId);
  const container = document.getElementById('circleWbQuizBody');
  if (!rev) return;

  let html = '';
  rev.sections.forEach((sec, sIdx) => {
    html += `<div class="wb-sec-card">
      <div class="wb-sec-title">📌 ${sec.section_title}</div>`;

    if (sec.type === 'pi_table') {
      sec.table_data.forEach((row, rIdx) => {
        const id = `u4_r10_pi_${rIdx}`;
        const opts = ['3.14', '3.15', '3.12', '3.16'];
        html += `
          <div class="wb-q-item">
            <div class="wb-q-text">物品：<b>${row.item}</b> (圓周長: ${row.circumference} cm，直徑: ${row.diameter} cm)<br>計算：圓周長 ÷ 直徑 = ？</div>
            <div class="wb-opt-grid">
              ${opts.map(opt => `
                <button type="button" class="wb-opt-btn ${circleAnswers[id] === opt ? 'selected' : ''}" onclick="circlePick('${id}', '${opt}', this)">
                  ${opt}
                </button>
              `).join('')}
            </div>
            <div class="wb-sol-panel" id="sol_${id}">標準答案：${row.ratio} (${row.calc})</div>
          </div>`;
      });
      html += `
        <div class="wb-q-item" style="background:#FFF;">
          <div class="wb-q-text" style="color:var(--moon-purple); font-weight:800;">💡 ${sec.summary_fill}</div>
        </div>`;
    } else {
      sec.items.forEach((item, iIdx) => {
        const itemId = `u4_r${circleCurrentRevId}_s${sIdx}_${iIdx}`;
        const qTitle = item.title ? `<b>${item.title}</b><br><small style="color:#5A189A;">${item.diagram || ''}</small>` : (item.q || `${item.left} ➜ 圓周長為？`);
        
        let opts = [];
        const ansStr = String(item.ans);
        const numMatch = ansStr.match(/[0-9\.]+/);
        if (numMatch) {
          const n = parseFloat(numMatch[0]);
          const prefix = ansStr.startsWith('約') ? '約 ' : '';
          const unit = ansStr.replace(/^[約\s]+|[0-9\.]/g, '');
          opts = [
            ansStr,
            `${prefix}${(n * 2).toFixed(2).replace(/\.00$/, '')}${unit}`,
            `${prefix}${(n + 10).toFixed(2).replace(/\.00$/, '')}${unit}`,
            `${prefix}${Math.max(1, (n / 2)).toFixed(2).replace(/\.00$/, '')}${unit}`
          ];
        } else {
          opts = [item.ans, '31.4公分', '62.8公分', '15.7公分'];
        }

        html += `
          <div class="wb-q-item">
            <div class="wb-q-text">${qTitle}</div>
            <div class="wb-opt-grid">
              ${opts.map(opt => `
                <button type="button" class="wb-opt-btn ${circleAnswers[itemId] === opt ? 'selected' : ''}" onclick="circlePick('${itemId}', '${opt}', this)">
                  ${opt}
                </button>
              `).join('')}
            </div>
            <div class="wb-sol-panel" id="sol_${itemId}">
              <div class="wb-sol-steps">${item.steps || ''}</div>
              <div class="wb-sol-ans">標準答案：${item.ans}</div>
            </div>
          </div>`;
      });
    }

    html += '</div>';
  });
  container.innerHTML = html;
}

function gradeCircleWbQuiz() {
  if (!U4_WB_DATA) return;
  const rev = U4_WB_DATA.reviews.find(r => r.review_id === circleCurrentRevId);
  let total = 0, correct = 0;

  rev.sections.forEach((sec, sIdx) => {
    if (sec.type === 'pi_table') {
      sec.table_data.forEach((row, rIdx) => {
        total++;
        const itemId = `u4_r10_pi_${rIdx}`;
        const userVal = (circleAnswers[itemId] || '').trim();
        const isRight = userVal === row.ratio;
        if (isRight) correct++;

        const panel = document.getElementById(`sol_${itemId}`);
        const qItem = panel ? panel.closest('.wb-q-item') : null;
        
        if (qItem) {
          qItem.classList.remove('is-correct', 'is-wrong');
          qItem.classList.add(isRight ? 'is-correct' : 'is-wrong');
          
          const oldBadge = qItem.querySelector('.wb-q-badge');
          if (oldBadge) oldBadge.remove();
          
          const badge = document.createElement('div');
          badge.className = `wb-q-badge ${isRight ? 'correct' : 'wrong'}`;
          badge.innerHTML = isRight ? '✓ 答對了！' : (userVal ? '✕ 答錯了！' : '⚠️ 未作答！');
          qItem.insertBefore(badge, qItem.firstChild);

          const btns = qItem.querySelectorAll('.wb-opt-btn');
          btns.forEach(btn => {
            btn.classList.remove('opt-correct', 'opt-wrong', 'opt-should-be');
            const btnVal = btn.textContent.trim();
            if (btnVal === userVal) {
              if (isRight) {
                btn.classList.add('opt-correct');
                btn.innerHTML = `✓ ${btnVal}`;
              } else {
                btn.classList.add('opt-wrong');
                btn.innerHTML = `✕ ${btnVal}`;
              }
            } else if (btnVal === row.ratio && !isRight) {
              btn.classList.add('opt-should-be');
              btn.innerHTML = `★ 正解：${btnVal}`;
            }
          });
        }

        if (panel) {
          panel.classList.add('show');
          panel.style.borderLeft = isRight ? '6px solid #10B981' : '6px solid #EF4444';
        }
      });
    } else {
      sec.items.forEach((item, iIdx) => {
        total++;
        const itemId = `u4_r${circleCurrentRevId}_s${sIdx}_${iIdx}`;
        const userVal = circleAnswers[itemId] || '';
        let isRight = false;

        const cleanUser = userVal.replace(/[\s]/g, '').replace(/約|公分|平方公分|公尺|平方公尺|倍|個|張|段|次|束|元/g, '');
        const cleanAns = String(item.ans).replace(/[\s]/g, '').replace(/約|公分|平方公分|公尺|平方公尺|倍|個|張|段|次|束|元/g, '');

        if (cleanUser === cleanAns || cleanUser.includes(cleanAns)) {
          isRight = true;
        } else if (cleanAns.includes('、')) {
          const parts = cleanAns.split('、');
          isRight = parts.every(p => cleanUser.includes(p.trim()));
        } else if (cleanAns.includes(',')) {
          const parts = cleanAns.split(',');
          isRight = parts.every(p => cleanUser.includes(p.trim()));
        }

        if (isRight) correct++;

        const panel = document.getElementById(`sol_${itemId}`);
        const qItem = panel ? panel.closest('.wb-q-item') : null;
        
        if (qItem) {
          qItem.classList.remove('is-correct', 'is-wrong');
          qItem.classList.add(isRight ? 'is-correct' : 'is-wrong');
          
          const oldBadge = qItem.querySelector('.wb-q-badge');
          if (oldBadge) oldBadge.remove();
          
          const badge = document.createElement('div');
          badge.className = `wb-q-badge ${isRight ? 'correct' : 'wrong'}`;
          badge.innerHTML = isRight ? '✓ 答對了！' : (userVal ? '✕ 答錯了！' : '⚠️ 未作答！');
          qItem.insertBefore(badge, qItem.firstChild);

          const btns = qItem.querySelectorAll('.wb-opt-btn');
          btns.forEach(btn => {
            btn.classList.remove('opt-correct', 'opt-wrong', 'opt-should-be');
            const btnVal = btn.textContent.trim();
            const cleanBtn = btnVal.replace(/[\s]/g, '').replace(/約|公分|平方公分|公尺|平方公尺|倍|個|張|段|次|束|元/g, '');
            
            if (btnVal === userVal) {
              if (isRight) {
                btn.classList.add('opt-correct');
                btn.innerHTML = `✓ ${btnVal}`;
              } else {
                btn.classList.add('opt-wrong');
                btn.innerHTML = `✕ ${btnVal}`;
              }
            } else if ((cleanBtn === cleanAns || cleanBtn.includes(cleanAns)) && !isRight) {
              btn.classList.add('opt-should-be');
              btn.innerHTML = `★ 正解：${btnVal}`;
            }
          });
        }

        if (panel) {
          panel.classList.add('show');
          panel.style.borderLeft = isRight ? '6px solid #10B981' : '6px solid #EF4444';
        }
      });
    }
  });

  const score = Math.round((correct / total) * 100);
  document.getElementById('circleWbScoreDisp').innerHTML = `得分：<b>${score} 分</b> (${correct} / ${total} 題正確)`;
  if (score >= 80) {
    playSound('fanfare');
    if (window.confetti) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
  } else {
    playSound('correct');
  }
  alert(`🎉 隨堂測驗批改完成！\n\n得分：${score} 分\n綠色為答對選項，紅色為答錯選項，綠色虛線為標準正解！✨`);
}

function resetCircleWbQuiz() {
  circleAnswers = {};
  renderCircleWbQuizBody();
  document.getElementById('circleWbScoreDisp').textContent = '狀態：做題中（未交卷）';
}

goto('intro');
</script>

</html>
