<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
<style>
  :root {
    --space-deep: #0D1B2A;
    --space-mid: #1B263B;
    --space-blue: #415A77;
    --space-cyan: #00B4D8;
    --ink: #0D1B2A;
    --gold: #FFB703;
    --gold-dark: #D48800;
    --parchment: #FFFDF5;
    --parchment-dark: #E9D9A6;
    --coral: #FF5A5F;
    --leaf: #00B4D8;
    --shadow: 0 10px 0 rgba(13, 27, 42, 0.25);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.18), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(0, 180, 216, 0.15), transparent 45%),
      linear-gradient(180deg, #050C1A 0%, #0D1B2A 40%, #1B263B 80%, #415A77 100%);
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 16px 12px 60px;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    padding-bottom: max(60px, calc(env(safe-area-inset-bottom) + 40px));
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }

  /* 背景動態星空動畫 */
  .bg-waves {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 120px;
    background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(0, 180, 216, 0.08)" d="M0,192L48,197.3C96,203,192,213,288,192C384,171,480,117,576,112C672,107,768,149,864,165.3C960,181,1056,171,1152,149.3C1248,128,1344,96,1392,80L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x;
    background-size: 1440px 120px;
    animation: waveMove 12s infinite linear;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes waveMove {
    0% { background-position-x: 0; }
    100% { background-position-x: 1440px; }
  }

  .app {
    width: 100%;
    max-width: 780px;
    position: relative;
    z-index: 1;
  }

  button, .term, .isle {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  h1, h2, h3 { font-family: 'Baloo 2', 'Noto Sans TC', sans-serif; margin: 0; }

  /* ---------- Top Navigation Bar ---------- */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 20px;
    color: #FFF;
    font-weight: 700;
    font-size: 0.9rem;
    text-decoration: none;
    backdrop-filter: blur(5px);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .nav-btn:hover {
    background: rgba(255, 255, 255, 0.35);
    transform: translateY(-2px);
  }

  .combo-badge {
    background: linear-gradient(135deg, #FF9E00, #FF0054);
    color: #FFF;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 800;
    font-size: 0.92rem;
    box-shadow: 0 4px 10px rgba(255, 0, 84, 0.3);
    display: flex;
    align-items: center;
    gap: 4px;
    animation: pulse 1.5s infinite alternate;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.08); }
  }

  /* ---------- Header ---------- */
  .header {
    text-align: center;
    color: #fff;
    margin-bottom: 14px;
  }

  .header .eyebrow {
    font-size: 14px;
    letter-spacing: 3px;
    font-weight: 700;
    opacity: 0.9;
    background: rgba(255, 255, 255, 0.15);
    display: inline-block;
    padding: 3px 12px;
    border-radius: 12px;
    margin-bottom: 4px;
  }

  .header h1 {
    font-size: clamp(28px, 6.5vw, 42px);
    text-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
    margin: 4px 0 2px;
    letter-spacing: 1px;
  }

  .header p {
    font-size: 16px;
    opacity: 0.95;
    margin: 0;
  }

  /* ---------- Animated Astronaut Mascot & Progress path ---------- */
  .mascot-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    padding: 10px 16px;
    backdrop-filter: blur(4px);
  }

  .mascot-avatar {
    font-size: 2.8rem;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
    animation: floatMascot 2s ease-in-out infinite alternate;
    user-select: none;
  }

  @keyframes floatMascot {
    0% { transform: translateY(0) rotate(-3deg); }
    100% { transform: translateY(-6px) rotate(3deg); }
  }

  .mascot-speech {
    background: #FFFFFF;
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 16px;
    font-size: 0.95rem;
    font-weight: 700;
    position: relative;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    max-width: 80%;
  }

  .mascot-speech::before {
    content: '';
    position: absolute;
    left: -10px;
    top: 50%;
    transform: translateY(-50%);
    border-width: 6px 10px 6px 0;
    border-style: solid;
    border-color: transparent #FFFFFF transparent transparent;
  }

  /* Path bar */
  .path-wrap {
    background: rgba(255, 255, 255, 0.16);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    padding: 16px 10px 12px;
    margin-bottom: 18px;
    backdrop-filter: blur(4px);
    position: relative;
  }

  .path {
    display: flex;
    justify-content: space-between;
    position: relative;
    padding: 0 4px;
  }

  .path::before {
    content: "";
    position: absolute;
    top: 22px; left: 6%; right: 6%;
    height: 6px;
    background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.8) 0 10px, transparent 10px 18px);
    z-index: 0;
    border-radius: 3px;
  }

  .isle {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 19%;
    cursor: pointer;
  }

  .isle .dot {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: var(--parchment-dark);
    border: 3px solid #fff;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .isle.active .dot {
    background: var(--space-cyan);
    transform: scale(1.2);
    animation: bob 1.2s ease-in-out infinite;
    box-shadow: 0 0 15px rgba(0, 180, 216, 0.6);
  }

  .isle.done .dot {
    background: #06D6A0;
    border-color: #E2F1E7;
  }

  .isle .stars {
    font-size: 13px;
    color: #fff;
    min-height: 16px;
    letter-spacing: 1px;
  }

  .isle .label {
    font-size: 12.5px;
    color: #fff;
    text-align: center;
    font-weight: 700;
    opacity: 0.95;
    line-height: 1.2;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) scale(1.2); }
    50% { transform: translateY(-6px) scale(1.2); }
  }

  /* ---------- Main Card ---------- */
  .card {
    background: var(--parchment);
    border: 4px solid var(--ink);
    border-radius: 26px;
    padding: clamp(18px, 4vw, 28px) clamp(16px, 4vw, 26px) clamp(22px, 5vw, 30px);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    min-height: 340px;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(13, 27, 42, 0.04) 1.5px, transparent 1.5px);
    background-size: 16px 16px;
    pointer-events: none;
  }

  .stage-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(22px, 5vw, 30px);
    color: #0077B6;
    margin-bottom: 8px;
    font-weight: 800;
  }

  .stage-sub {
    font-size: 16.5px;
    color: #4b5a5f;
    margin-bottom: 18px;
    line-height: 1.65;
  }

  .content { position: relative; z-index: 1; }

  /* Buttons */
  .btn {
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 800;
    font-size: 19px;
    padding: 14px 26px;
    min-height: 52px;
    border-radius: 16px;
    border: 3px solid var(--ink);
    cursor: pointer;
    background: #0077B6;

<script>
/* ================= 音效合成器 (Web Audio API Synthesizer) ================= */
let soundEnabled = true;
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇';
  document.getElementById('soundText').textContent = soundEnabled ? '音效 ON' : '音效 OFF';
}

function playSound(type) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;
    if (type === 'click') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(840, now + 0.08);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'correct') {
      const freqs = [523.25, 659.25, 783.99, 1046.50];
      freqs.forEach((f, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now + idx * 0.08);
        gain.gain.setValueAtTime(0.25, now + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 0.25);
      });
    } else if (type === 'wrong') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.linearRampToValueAtTime(110, now + 0.25);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'fanfare') {
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      notes.forEach((f, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(f, now + idx * 0.12);
        gain.gain.setValueAtTime(0.2, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + 0.4);
      });
    }
  } catch (e) {}
}

/* ================= 遊戲基本資料與狀態 ================= */
const ISLES = [
  {key:'l1', icon:'🛸', label:'小數放大鏡'},

  {key:'l5', icon:'🏆', label:'太空總部'},
];

const state = {
  stage: 'intro',
  stars: {l1:0,l2:0,l3:0,l4:0,l5:0},
  combo: 0
};

function starsToText(n){ return '⭐'.repeat(n) + '☆'.repeat(3-n); }

function updateMascot(avatar, speech) {
  const elAvatar = document.getElementById('mascotAvatar');
  const elSpeech = document.getElementById('mascotSpeech');
  if (elAvatar) elAvatar.textContent = avatar;
  if (elSpeech) elSpeech.textContent = speech;
}

function addCombo() {
  state.combo++;
  const badge = document.getElementById('comboBadge');
  const txt = document.getElementById('comboText');
  if (state.combo >= 2) {
    badge.style.display = 'flex';
    txt.textContent = `連勝 x${state.combo}`;
  }
}
function resetCombo() {
  state.combo = 0;
  document.getElementById('comboBadge').style.display = 'none';
}

function spawnCoinEffect(event) {
  const coin = document.createElement('div');
  coin.className = 'coin-burst';
  coin.textContent = '🚀 +10';
  const rect = event ? event.target.getBoundingClientRect() : { left: window.innerWidth/2, top: window.innerHeight/2 };
  coin.style.left = `${rect.left + 10}px`;
  coin.style.top = `${rect.top - 20}px`;
  document.body.appendChild(coin);
  setTimeout(() => coin.remove(), 1200);
}

/* ================= 名詞小百科 ================= */
const GLOSSARY = [
  { key:'shiftDot', title:'小數點向右移 (同乘放大)', def:'當除數是小數時，將除數的小數點向右移幾位變成整數，被除數的小數點也要跟著向右移相同的位數。' },
  { key:'verticalDiv', title:'小數直式除法', def:'商的小數點要和被除數「移動後的新小數點」對齊；如果有餘數，餘數的小數點要和「被除數原來的小數點」對齊。' },
  { key:'rounding', title:'四捨五入求概數', def:'求商到小數點後第一位時，要計算到「小數點後第二位（百分位）」進行四捨五入；求到小數第二位時，要算到第三位（千分位）進行四捨五入。' },
  { key:'quotientRelation', title:'小數除法商的大小關係', def:'當除數 > 1 時，商 < 被除數；當除數 < 1 時，商 > 被除數；當除數 = 1 時，商 = 被除數。' }
];

function term(key, label){
  return `<span class="term" tabindex="0" onclick="openGlossary('${key}')">${label}<sup>ⓘ</sup></span>`;
}

function renderGlossaryList(){
  const list = document.getElementById('glossaryList');
  list.innerHTML = GLOSSARY.map(g => `
    <div class="def-card" id="def-${g.key}">
      <h3>🔖 ${g.title}</h3>
      <p>${g.def}</p>
    </div>`).join('');
}

function openGlossary(key){
  playSound('click');
  renderGlossaryList();
  document.getElementById('glossaryOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeGlossary(){
  document.getElementById('glossaryOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

/* ================= 進度列渲染 ================= */
function renderPath(){
  const bar = document.getElementById('pathBar');
  bar.innerHTML = '';
  const order = ['l1','l2','l3','l4','l5'];
  order.forEach((key,i)=>{
    const isle = ISLES[i];
    const div = document.createElement('div');
    div.className = 'isle';
    if(state.stars[key] > 0) div.classList.add('done');
    if(state.stage === key) div.classList.add('active');
    div.onclick = () => goto(key);
    div.innerHTML = `
      <div class="dot">${state.stars[key] > 0 ? '✅' : isle.icon}</div>
      <div class="stars">${state.stars[key] > 0 ? starsToText(state.stars[key]) : ''}</div>
      <div class="label">${isle.label}</div>`;
    bar.appendChild(div);
  });
}

function goto(stage){
  playSound('click');
  state.stage = stage;
  renderPath();
  const c = document.getElementById('content');
  c.innerHTML = '';
  if(stage === 'intro') renderIntro(c);
  else if(stage === 'l1') renderLevel1(c);
  else if(stage === 'l2') renderLevel2(c);
  else if(stage === 'l3') renderLevel3(c);
  else if(stage === 'l4') renderLevel4(c);
  else if(stage === 'l5') renderLevel5(c);
  else if(stage === 'final') renderFinal(c);
}

let decCurrentRevId = 7;
let decAnswers = {};

function openDecWbModal() {
  playSound('click');
  document.getElementById('decWbModalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  switchDecWbRev(7);
}
function closeDecWbModal() {
  document.getElementById('decWbModalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function switchDecWbRev(revId) {
  decCurrentRevId = revId;
  decAnswers = {};
  document.querySelectorAll('#decWbModalOverlay .wb-tab').forEach((t, i) => t.classList.toggle('active', i + 7 === revId));
  document.getElementById('decWbScoreDisp').textContent = '狀態：做題中（未交卷）';
  renderDecWbQuizBody();
}

function decPick(itemId, val, btnEl) {
  playSound('click');
  decAnswers[itemId] = val;
  const parent = btnEl.closest('.wb-opt-grid');
  if (parent) {
    parent.querySelectorAll('.wb-opt-btn').forEach(b => b.classList.remove('selected'));
    btnEl.classList.add('selected');
  }
}

function getDecDiagramSvg(item) {
  if (!item) return '';
  const text = (item.q || '') + ' ' + (item.explanation || '') + ' ' + (item.steps || '') + ' ' + (item.num || '');
  
  // 1. 四捨五入概數與數位結構 (table_rounding 或包含四捨五入)
  if (item.num || text.includes('四捨五入') || text.includes('概數') || text.includes('取到')) {
    const numVal = item.num || '38.264';
    return `
      <svg class="dec-svg" width="240" height="130" viewBox="0 0 240 130">
        <rect x="20" y="25" width="200" height="55" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>

  // 2. 水塔注水問題
  if (text.includes('水塔') || text.includes('注水')) {

        }

        html += `
          <div class="wb-q-item">
            <div class="wb-q-text">${item.q}</div>
            ${visualSvg ? `<div class="wb-diagram-box"><div class="diagram-tag">💡 看圖懂題意（小數模型）</div>${visualSvg}</div>` : ''}
            <div class="wb-opt-grid">
              ${opts.map(opt => `
                <button type="button" class="wb-opt-btn ${decAnswers[itemId] === opt ? 'selected' : ''}" onclick="decPick('${itemId}', '${opt}', this)">
                  ${opt}
                </button>
              `).join('')}
            </div>
            <div class="wb-sol-panel" id="sol_${itemId}">
              <div class="wb-sol-steps">${item.steps || item.calc || item.explanation || ''}</div>
              <div class="wb-sol-ans">標準答案：${item.ans}</div>
            </div>
          </div>`;
      });
    }
    html += '</div>';
  });
  container.innerHTML = html;
}

function gradeDecWbQuiz() {
  if (!U3_WB_DATA) return;
  const rev = U3_WB_DATA.reviews.find(r => r.review_id === decCurrentRevId);
  let total = 0, correct = 0;

  rev.sections.forEach((sec, sIdx) => {
    if (sec.type === 'table_rounding') {
      sec.table_data.forEach((row, rIdx) => {
        ['1', '2', '3'].forEach((k, colIdx) => {
          total++;
          const itemId = `u3_r${decCurrentRevId}_tab_${rIdx}_${k}`;
          const expected = (colIdx === 0 ? row.to_unit : colIdx === 1 ? row.to_tenth : row.to_hundredth);
          const userVal = (decAnswers[itemId] || '').trim();
          const isRight = userVal === expected;
          if (isRight) correct++;

          const panel = document.getElementById(`sol_${itemId}`);
          if (panel) {
            panel.classList.add('show');
            panel.style.borderLeft = isRight ? '6px solid #10B981' : '6px solid #EF4444';
          }
        });
      });
    } else {
      sec.items.forEach((item, iIdx) => {
        total++;
        const itemId = `u3_r${decCurrentRevId}_s${sIdx}_${iIdx}`;
        const userVal = decAnswers[itemId] || '';
        let isRight = false;

        const cleanUser = userVal.replace(/[\s]/g, '').replace(/袋|倍|朵|分鐘|公升|公分|公尺|公斤|坪|包|約/g, '');
        const cleanAns = String(item.ans).replace(/[\s]/g, '').replace(/袋|倍|朵|分鐘|公升|公分|公尺|公斤|坪|包|約/g, '');

        if (cleanUser === cleanAns || cleanUser.includes(cleanAns)) {
          isRight = true;
        } else if (cleanAns.includes('、')) {
          const parts = cleanAns.split('、');
          isRight = parts.every(p => cleanUser.includes(p.trim()));
        } else if (cleanAns.includes(',')) {
          const parts = cleanAns.split(',');
          isRight = parts.every(p => cleanUser.includes(p.trim()));
        }

        if (isRight) correct++;

        const panel = document.getElementById(`sol_${itemId}`);
        const qItem = panel ? panel.closest('.wb-q-item') : null;
        
        if (qItem) {
          qItem.classList.remove('is-correct', 'is-wrong');
          qItem.classList.add(isRight ? 'is-correct' : 'is-wrong');
          
          const oldBadge = qItem.querySelector('.wb-q-badge');
          if (oldBadge) oldBadge.remove();
          
          const badge = document.createElement('div');
          badge.className = `wb-q-badge ${isRight ? 'correct' : 'wrong'}`;
          badge.innerHTML = isRight ? '✓ 答對了！' : (userVal ? '✕ 答錯了！' : '⚠️ 未作答！');
          qItem.insertBefore(badge, qItem.firstChild);

          const btns = qItem.querySelectorAll('.wb-opt-btn');
          btns.forEach(btn => {
            btn.classList.remove('opt-correct', 'opt-wrong', 'opt-should-be');
            const btnVal = btn.textContent.trim();
            const cleanBtn = btnVal.replace(/[\s]/g, '').replace(/袋|倍|朵|分鐘|公升|公分|公尺|公斤|坪|包|約/g, '');
            
            if (btnVal === userVal) {
              if (isRight) {
                btn.classList.add('opt-correct');
                btn.innerHTML = `✓ ${btnVal}`;
              } else {
                btn.classList.add('opt-wrong');
                btn.innerHTML = `✕ ${btnVal}`;
              }
            } else if ((cleanBtn === cleanAns || cleanBtn.includes(cleanAns)) && !isRight) {
              btn.classList.add('opt-should-be');
              btn.innerHTML = `★ 正解：${btnVal}`;
            }
          });
        }

        if (panel) {
          panel.classList.add('show');
          panel.style.borderLeft = isRight ? '6px solid #10B981' : '6px solid #EF4444';
        }
      });
    }
  });

  const score = Math.round((correct / total) * 100);
  document.getElementById('decWbScoreDisp').innerHTML = `得分：<b>${score} 分</b> (${correct} / ${total} 題正確)`;
  if (score >= 80) {
    playSound('fanfare');
    if (window.confetti) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
  } else {
    playSound('correct');
  }
  alert(`🎉 隨堂測驗批改完成！\n\n得分：${score} 分\n綠色為答對選項，紅色為答錯選項，綠色虛線為標準正解！✨`);
}

function resetDecWbQuiz() {
  decAnswers = {};
  renderDecWbQuizBody();
  document.getElementById('decWbScoreDisp').textContent = '狀態：做題中（未交卷）';
}

goto('intro');
</script>
