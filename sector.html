<script>
// ── Web Audio API 音效引擎 ──
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playTone(freq, type = 'sine', duration = 0.15, vol = 0.25) {
  if (!soundEnabled) return;
  try {
    initAudio();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function playSound(name) {
  if (!soundEnabled) return;
  if (name === 'correct') {
    playTone(523.25, 'triangle', 0.1, 0.2);
    setTimeout(() => playTone(659.25, 'triangle', 0.1, 0.2), 80);
    setTimeout(() => playTone(783.99, 'triangle', 0.2, 0.25), 160);
  } else if (name === 'wrong') {
    playTone(260, 'sawtooth', 0.15, 0.25);
    setTimeout(() => playTone(196, 'sawtooth', 0.25, 0.3), 120);
  } else if (name === 'level_clear') {
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f, idx) => {
      setTimeout(() => playTone(f, 'sine', 0.2, 0.3), idx * 100);
    });
  } else if (name === 'click') {
    playTone(400, 'sine', 0.05, 0.1);
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundEnabled ? '🔊' : '🔇';
  showCastleModal('音效設定', soundEnabled ? '音效已開啟 🔊' : '音效已靜音 🔇', '🎵');
}

// ── 現代彈窗控制 (CastleModal) ──
function showCastleModal(title, bodyHtml, icon = '💡', onClose = null) {
  const overlay = document.getElementById('castleModalOverlay');
  if (!overlay) return;
  document.getElementById('castleModalTitle').textContent = title;
  document.getElementById('castleModalBody').innerHTML = bodyHtml;
  document.getElementById('castleModalIcon').textContent = icon;
  overlay.classList.add('open');
  window._castleModalOnClose = onClose;
}

function closeCastleModal() {
  const overlay = document.getElementById('castleModalOverlay');
  if (overlay) overlay.classList.remove('open');
  if (typeof window._castleModalOnClose === 'function') {
    const cb = window._castleModalOnClose;
    window._castleModalOnClose = null;
    cb();
  }
}

function closeCastleModalOnBackdrop(e) {
  if (e.target && e.target.id === 'castleModalOverlay') {
    closeCastleModal();
  }
}

window.alert = function(msg) {
  showCastleModal('系統提示', `<div style="text-align:left; white-space:pre-line;">${msg}</div>`, '💡');
};

// ── 連擊與分數狀態 ──
let userScore = 0;
let userCombo = 0;
let currentStage = 0;

function addScore(pts = 10) {
  userCombo++;
  const bonus = Math.floor(userCombo / 3) * 5;
  userScore += (pts + bonus);
  document.getElementById('scoreText').textContent = userScore;
  document.getElementById('comboText').textContent = userCombo;
  if (userCombo >= 3) {
    updateMascot(`🔥 全壘打！達成 ${userCombo} 連擊！額外加 ${bonus} 分！`);
  }
}

function resetCombo() {
  userCombo = 0;
  document.getElementById('comboText').textContent = userCombo;
}

function updateMascot(msg) {
  const el = document.getElementById('mascotMessage');
  if (el) el.textContent = msg;
}

function shuffleArray(arr) {
  const newArr = [...arr];
  for (let i = newArr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
  }
  return newArr;
}

  { term: "扇形周長 (Sector Perimeter)", def: "扇形邊界總長度 ＝ 扇形弧長 ＋ 兩條半徑（即 弧長 ＋ 直徑）。" },
  { term: "扇形面積 (Sector Area)", def: "圓面積 × (圓心角 / 360°) ＝ 半徑 × 半徑 × 3.14 × 幾分之幾圓。" },
  { term: "葉片形 (Lens Area)", def: "正方形內兩個相對 1/4 圓弧相交形成的橄欖形區域。面積 ＝ 半圓面積 － 正方形面積。" }
];

// ── 渲染關卡內容 ──
function renderStage(stageIdx) {
  currentStage = stageIdx;
  const container = document.getElementById('stageContainer');
  const tabs = document.querySelectorAll('.stage-tab');
  tabs.forEach((tab, i) => {
    tab.classList.toggle('active', i === stageIdx);
  });

  const data = stageData[stageIdx];
  if (!data) return;

  let html = `
    <div class="section-card">
      <div class="card-header">
        <h2 class="card-title">
          <span>${data.icon}</span>
          <span>${data.title}</span>
        </h2>
        <span class="badge-tag">Stage ${stageIdx} / 5</span>
      </div>

      <div class="concept-box">
        ${data.concept}
      </div>
  `;

  // 若為 Stage 1 加入扇形幾何模擬器
  if (data.hasSectorLab) {
    html += `
      <div class="lab-widget">
        <h3 style="margin-bottom:12px; color:var(--primary-dark); display:flex; align-items:center; gap:8px;">
          <span>🏟️</span><span>道奇球場扇形幾何動態生成器</span>
        </h3>
        <p style="color:var(--text-muted); margin-bottom:16px;">
          拖動滑桿調整「半徑」與「圓心角」，即時繪製扇形，觀察弧長、周長與面積的動態變化！
        </p>
        <div class="sector-sim-wrap">
          <div class="svg-canvas-box">
            <svg id="sectorSvg" width="240" height="240" viewBox="0 0 240 240"></svg>
          </div>
          <div class="sector-controls">
            <div class="slider-row">
              <label>
                <span>扇形半徑 (r)</span>
                <span id="radiusVal" style="color:var(--primary); font-weight:800;">10 公分</span>
              </label>
              <input type="range" id="radiusSlider" min="5" max="30" value="10" oninput="updateSectorSim()">
            </div>
            <div class="slider-row">
              <label>
                <span>圓心角 (θ)</span>
                <span id="angleVal" style="color:#D97706; font-weight:800;">90° (1/4 圓)</span>
              </label>
              <input type="range" id="angleSlider" min="30" max="330" step="15" value="90" oninput="updateSectorSim()">
            </div>
            <div class="sector-metrics">
              <div class="metrics-line" id="metricArc">扇形弧長 ＝ 15.7 公分</div>
              <div class="metrics-line" id="metricPerimeter" style="color:#B45309;">
                扇形周長 ＝ 15.7 ＋ 10 ＋ 10 ＝ 35.7 公分
              </div>
              <div class="metrics-line" id="metricArea" style="color:#047857;">
                扇形面積 ＝ 10 × 10 × 3.14 × (1/4) ＝ 78.5 平方公分
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // 測驗題庫卡片
  html += `
      <h3 style="margin:24px 0 10px; color:var(--text-main); display:flex; align-items:center; gap:8px;">
        <span>✏️</span><span>闖關即時測驗 (選項自動隨機化)</span>
      </h3>
      <div class="quiz-list" id="stageQuizList">
  `;

  data.quizzes.forEach((quiz, qIdx) => {
    const shuffledOptions = shuffleArray(quiz.options);
    html += `
      <div class="quiz-item" id="quizCard_${stageIdx}_${qIdx}">
        <div class="quiz-header">
          <span class="quiz-qnum">題目 ${qIdx + 1}</span>
          <div class="quiz-text">${quiz.q}</div>
        </div>
        <div class="quiz-options">
          ${shuffledOptions.map(opt => `
            <button class="quiz-opt-btn" onclick="checkAnswer(${stageIdx}, ${qIdx}, this, '${encodeURIComponent(opt)}', '${encodeURIComponent(quiz.ans)}')">
              ${opt}
            </button>
          `).join('')}
        </div>
        <div class="quiz-explain" id="explain_${stageIdx}_${qIdx}">
          <strong>💡 詳解分析：</strong> ${quiz.explain}
        </div>
      </div>
    `;
  });

  html += `
      </div>
      <div class="card-footer">
        <button class="back-btn" onclick="prevStage()">⬅️ 上一關</button>
        <button class="btn-next-stage" onclick="nextStage()">
          ${stageIdx === 5 ? '前往榮譽殿堂 🏆' : '前往下一關 ➡️'}
        </button>
      </div>
    </div>
  `;

  container.innerHTML = html;
  window.scrollTo({ top: 180, behavior: 'smooth' });

  if (data.hasSectorLab) {
    updateSectorSim();
  }
}

// ── 扇形幾何 SVG 即時模擬器 ──
function updateSectorSim() {
  const r = parseInt(document.getElementById('radiusSlider').value, 10);
  const ang = parseInt(document.getElementById('angleSlider').value, 10);

  document.getElementById('radiusVal').textContent = `${r} 公分`;
  const frac = (ang / 360).toFixed(3).replace(/\.000$/, '');
  let fracText = `${ang}°`;
  if (ang === 90) fracText = '90° (1/4 圓)';
  else if (ang === 180) fracText = '180° (1/2 圓)';
  else if (ang === 60) fracText = '60° (1/6 圓)';
  else if (ang === 120) fracText = '120° (1/3 圓)';
  else if (ang === 240) fracText = '240° (2/3 圓)';
  else if (ang === 270) fracText = '270° (3/4 圓)';
  document.getElementById('angleVal').textContent = fracText;

  // 數值運算
  const d = r * 2;
  const arcLen = d * 3.14 * (ang / 360);
  const perimeter = arcLen + d;
  const area = r * r * 3.14 * (ang / 360);

  document.getElementById('metricArc').textContent = 
    `扇形弧長 ＝ ${d} × 3.14 × (${ang}/360) ＝ ${arcLen.toFixed(2)} 公分`;
  document.getElementById('metricPerimeter').textContent = 
    `扇形周長 ＝ ${arcLen.toFixed(2)} ＋ ${r} ＋ ${r} ＝ ${perimeter.toFixed(2)} 公分`;
  document.getElementById('metricArea').textContent = 
    `扇形面積 ＝ ${r} × ${r} × 3.14 × (${ang}/360) ＝ ${area.toFixed(2)} 平方公分`;

  // SVG 繪製扇形
  const svg = document.getElementById('sectorSvg');
  if (!svg) return;
  svg.innerHTML = '';

  const cx = 120;
  const cy = 120;
  const scale = 3.2; // 縮放比例
  const visualR = Math.min(100, Math.max(30, r * scale));

  // 角度轉弧度 (0度向右，順時針繪製)
  const rad = (ang * Math.PI) / 180;
  const startX = cx + visualR;
  const startY = cy;
  const endX = cx + visualR * Math.cos(rad);
  const endY = cy + visualR * Math.sin(rad);

  const largeArcFlag = ang > 180 ? 1 : 0;
  const pathD = `M ${cx} ${cy} L ${startX} ${startY} A ${visualR} ${visualR} 0 ${largeArcFlag} 1 ${endX} ${endY} Z`;

  // 扇形主體
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', pathD);
  path.setAttribute('fill', 'rgba(59, 130, 246, 0.25)');
  path.setAttribute('stroke', '#1D4ED8');
  path.setAttribute('stroke-width', '2.5');
  svg.appendChild(path);

  // 圓心點
  const centerCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  centerCircle.setAttribute('cx', cx);
  centerCircle.setAttribute('cy', cy);
  centerCircle.setAttribute('r', '4');
  centerCircle.setAttribute('fill', '#EF4444');
  svg.appendChild(centerCircle);

  // 弧線高亮
  const arcPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const arcD = `M ${startX} ${startY} A ${visualR} ${visualR} 0 ${largeArcFlag} 1 ${endX} ${endY}`;
  arcPath.setAttribute('d', arcD);
  arcPath.setAttribute('fill', 'none');
  arcPath.setAttribute('stroke', '#F59E0B');
  arcPath.setAttribute('stroke-width', '4');
  svg.appendChild(arcPath);
}

// ── 檢查測驗答案 ──
function checkAnswer(stageIdx, qIdx, btn, encodedSelected, encodedCorrect) {
  const selected = decodeURIComponent(encodedSelected);
  const correct = decodeURIComponent(encodedCorrect);
  const card = document.getElementById(`quizCard_${stageIdx}_${qIdx}`);
  const explain = document.getElementById(`explain_${stageIdx}_${qIdx}`);
  const allBtns = card.querySelectorAll('.quiz-opt-btn');

  allBtns.forEach(b => {
    b.disabled = true;
    if (decodeURIComponent(b.getAttribute('onclick').split("'")[7]) === correct) {
      b.classList.add('correct-opt');
    }
  });

  if (selected === correct) {
    btn.classList.add('correct-opt');
    card.classList.add('correct-item');
    playSound('correct');
    addScore(10);
    updateMascot('🎯 漂亮！全壘打！觀念非常清晰！');
  } else {
    btn.classList.add('wrong-opt');
    card.classList.add('wrong-item');
    playSound('wrong');
    resetCombo();
    updateMascot('⚾ 差一點點，看看解題步驟，下一球一定得分！');
  }

  explain.style.display = 'block';
}

// ── 關卡跳轉與榮譽殿堂 ──
function gotoStage(idx) {
  playSound('click');
  renderStage(idx);
}

function nextStage() {
  if (currentStage < 5) {
    playSound('level_clear');
    if (typeof confetti === 'function') {
      confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
    }
    renderStage(currentStage + 1);
  } else {
    renderFinal();
  }
}

function prevStage() {
  if (currentStage > 0) {
    playSound('click');
    renderStage(currentStage - 1);
  } else {
    showCastleModal('提示', '已經是第一關囉！', '🏰');
  }
}

function renderFinal() {
  playSound('level_clear');
  if (typeof confetti === 'function') {
    confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
  }
  const container = document.getElementById('stageContainer');
  const tabs = document.querySelectorAll('.stage-tab');
  tabs.forEach(t => t.classList.remove('active'));

  container.innerHTML = `
    <div class="section-card badge-showcase">
      <div class="medal-icon">🏅</div>
      <h2 style="font-size:2rem; font-weight:900; color:var(--primary-dark); margin-bottom:12px;">
        恭喜完成【扇形奇境】全部挑戰！
      </h2>
      <p style="font-size:1.15rem; color:var(--text-muted); max-width:600px; margin:0 auto 24px;">
        你已完全掌握扇形弧長、周長防漏秘笈、扇形面積、栓狗活動範圍、割補平移與資優幾何推理！獲頒「<strong>幾何全壘打大王</strong>」榮譽勳章！
      </p>
      <div style="display:flex; justify-content:center; gap:16px; margin-bottom:28px;">
        <div class="stat-pill" style="font-size:1.1rem; padding:8px 20px;">
          <span>⭐ 最終總得分：</span><strong style="color:#B45309;">${userScore} 分</strong>
        </div>
      </div>
      <div style="display:flex; justify-content:center; gap:16px;">
        <button class="btn-next-stage" onclick="gotoStage(0)">🔄 再次挑戰複習</button>
        <a href="portal.html" class="back-btn" style="padding:10px 24px; font-size:1.05rem;">🏰 返回傳送門</a>
      </div>
    </div>
  `;
  window.scrollTo({ top: 180, behavior: 'smooth' });
}

// ── 辭典彈窗 ──
function openGlossary() {
  playSound('click');
  let body = '<div style="display:flex; flex-direction:column; gap:14px;">';
  glossaryTerms.forEach(t => {
    body += `
      <div style="background:#EFF6FF; border-left:4px solid var(--primary); padding:10px 14px; border-radius:0 8px 8px 0;">
        <div style="font-weight:800; color:var(--primary-dark); margin-bottom:4px;">${t.term}</div>
        <div style="font-size:0.95rem; color:#334155;">${t.def}</div>
      </div>
    `;
  });
  body += '</div>';
  showCastleModal('扇形幾何・核心知識寶典', body, '📖');
}

// ── 頁面初始化 ──
document.addEventListener('DOMContentLoaded', () => {
  renderStage(0);
});
