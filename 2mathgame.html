<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大耳狗九九乘法：完整練習版</title>
    <style>
        /* --- 全局設定 --- */
        :root {
            --primary-blue: #89CFF0;
            --dark-blue: #5CA0C0;
            --soft-white: #FFFFFF;
            --accent-pink: #FFB7C5;
            --text-color: #444;
            --bg-cloud: #F0F8FF;
            --correct-green: #4CAF50;
            --wrong-red: #FF6B6B;
        }

        body {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-color: var(--bg-cloud);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle, white 20%, transparent 20%),
                radial-gradient(circle, white 20%, transparent 20%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            user-select: none;
        }

        /* --- 主容器 --- */
        #game-container {
            background: var(--soft-white);
            width: 95%;
            max-width: 600px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(137, 207, 240, 0.5);
            padding: 20px;
            text-align: center;
            border: 6px solid var(--primary-blue);
            box-sizing: border-box;
            position: relative;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        h1 { color: var(--dark-blue); margin: 10px 0 5px 0; font-size: 1.8rem; }

        /* 圖片圓框樣式 */
        .character-img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--primary-blue);
            margin: 0 auto 10px auto;
            background-color: #F0F8FF;
            display: block;
            box-shadow: 0 5px 15px rgba(137, 207, 240, 0.3);
        }
        
        #game-img, #report-img {
             width: 110px;
             height: 110px;
             border-color: var(--accent-pink);
        }

        /* --- 畫面切換控制 --- */
        .screen { display: none; flex-direction: column; height: 100%; flex-grow: 1; }
        .screen.active { display: flex; }

        /* --- 選單畫面 --- */
        .mode-section {
            margin: 10px 0;
            padding: 15px;
            background: #F9F9F9;
            border-radius: 20px;
            border: 2px dashed var(--primary-blue);
        }

        .grid-buttons-small {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        /* --- 開關按鈕 (Switch) --- */
        .switch-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            font-size: 1.2rem;
            color: var(--dark-blue);
            font-weight: bold;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
            margin-right: 10px;
        }
        
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider { background-color: var(--primary-blue); }
        input:checked + .slider:before { transform: translateX(26px); }

        /* --- 遊戲畫面 --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            flex-shrink: 0;
        }

        .info-badge {
            font-size: 1.1rem;
            background: #FFF3E0;
            padding: 5px 12px;
            border-radius: 15px;
            border: 2px solid #FFCC80;
            font-weight: bold;
            color: #E65100;
        }

        #question-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        .question-box-basic {
            font-size: 4.5rem;
            color: var(--text-color);
            font-weight: bold;
        }

        .story-text {
            font-size: 1.4rem;
            color: #333;
            text-align: left;
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            line-height: 1.8;
            border: 2px solid var(--primary-blue);
            width: 100%;
            box-sizing: border-box;
        }
        .zhu { color: #888; font-size: 0.8em; margin-right: 2px; font-weight: normal; }
        .highlight { color: #E91E63; font-weight: bold; font-size: 1.5rem; margin: 0 3px; }

        /* --- 選項區 --- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: auto;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .option-btn {
            background-color: white;
            border: 3px solid var(--primary-blue);
            border-radius: 20px;
            color: var(--dark-blue);
            font-size: 2.2rem;
            padding: 15px 0;
            cursor: pointer;
            box-shadow: 0 4px 0 #B0E0E6;
            transition: all 0.1s;
            font-weight: bold;
        }

        .option-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #B0E0E6; }
        .option-btn.wrong-anim { background-color: #FFEBEE; border-color: var(--wrong-red); color: var(--wrong-red); animation: shake 0.5s; }
        .option-btn.correct-anim { background-color: #E8F5E9; border-color: var(--correct-green); color: var(--correct-green); }

        /* --- 結算畫面 --- */
        #report-screen {
            text-align: center;
            padding-top: 20px;
        }
        .result-box {
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            border: 4px solid var(--primary-blue);
            margin: 20px 0;
        }
        .result-item {
            font-size: 1.5rem;
            margin: 15px 0;
            color: #555;
            text-align: left;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 10px;
        }
        .result-value {
            float: right;
            font-weight: bold;
            color: var(--primary-blue);
        }

        /* --- 按鈕 --- */
        .btn { background-color: var(--primary-blue); color: white; border: none; padding: 10px; font-size: 1.3rem; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #5CA0C0; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-menu { width: 100%; margin: 5px 0; }
        .btn-back { background: #FFD54F; box-shadow: 0 4px 0 #FFB300; color: #333; font-size: 1rem; padding: 8px 15px;}
        .btn-home { background: #ccc; box-shadow: 0 4px 0 #999; font-size: 1rem; padding: 8px 15px;}
        .btn-restart { background-color: #4CAF50; box-shadow: 0 4px 0 #2E7D32; width: 100%; margin-top: 20px; padding: 15px;}

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%, 75% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
        }

    </style>
</head>

        // 音效設定
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }

        // 遊戲狀態
        let state = {
            mode: 'basic',
            targetNum: 0,
            isTimerEnabled: false,
            qIndex: 0,
            correctCount: 0,
            wrongCount: 0,
            startTime: 0,
            currentQ: null,
            history: [],
            questionQueue: [] // 儲存預先生成的題目佇列
        };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goHome() {
            showScreen('menu-screen');
            document.getElementById('menu-img').src = "menu_cinnamoroll.png"; 
        }

        function initGame(mode, num) {
            const timerSwitch = document.getElementById('timer-toggle');
            state.isTimerEnabled = timerSwitch.checked;
            state.mode = mode;
            state.targetNum = num;
            state.qIndex = 0;
            state.correctCount = 0;
            state.wrongCount = 0;
            state.history = [];
            
            // 預先生成題目佇列
            generateQuestionQueue(mode, num);

            state.startTime = Date.now();
            showScreen('game-screen');
            nextQuestion(false);
        }

        // 產生一回合的題目佇列
        function generateQuestionQueue(mode, num) {
            state.questionQueue = [];
            
            if (mode === 'basic') {
                if (num > 0) {
                    // 指定數字：產生 n*1 到 n*10
                    let pool = [];
                    for(let i=1; i<=10; i++) {
                        pool.push({ n1: num, n2: i });
                    }
                    // 洗牌
                    shuffleArray(pool);
                    state.questionQueue = pool;
                } else {
                    // 混合練習：產生10題不重複的隨機題目
                    let pool = [];
                    let used = new Set();
                    while(pool.length < 10) {
                        let n1 = Math.floor(Math.random() * 8) + 2; // 2~9
                        let n2 = Math.floor(Math.random() * 9) + 1; // 1~9
                        let key = `${n1}-${n2}`;
                        if (!used.has(key)) {
                            used.add(key);
                            pool.push({ n1: n1, n2: n2 });
                        }
                    }
                    state.questionQueue = pool;
                }
            } else {
                // 素養題：隨機抽10題 (簡單隨機，若要嚴格不重複也可加 Set)
                // 這裡簡單從50題中隨機抽10題不重複
                let indices = Array.from({length: storyQuestions.length}, (_, i) => i);
                shuffleArray(indices);
                let selectedIndices = indices.slice(0, 10);
                state.questionQueue = selectedIndices.map(i => storyQuestions[i]);
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function nextQuestion(isUndo) {
            if (!isUndo && state.qIndex >= QUESTIONS_PER_ROUND) {
                showReport();
                return;
            }

            if (!isUndo) {
                state.qIndex++;
                
                // 從佇列中取出題目
                if (state.mode === 'story') {
                    // 素養題佇列裡存的是完整題目物件
                    // 但我們需要配合 generateQuestionData 的回傳格式，這裡做一點轉換
                    let qData = state.questionQueue[state.qIndex - 1]; // 因為 qIndex 是從 1 開始顯示
                    let qText = qData.t.replace(/\(([^)]+)\)/g, "<span class='zhu'>$1</span>");
                    
                    state.currentQ = { 
                        text: qText, 
                        ans: qData.a, 
                        options: generateOptions(qData.a), 
                        type: 'story' 
                    };

                } else {
                    // 基礎題佇列裡存的是 {n1, n2}
                    let qPair = state.questionQueue[state.qIndex - 1];
                    let val = qPair.n1 * qPair.n2;
                    
                    state.currentQ = {
                        text: `${qPair.n1} × ${qPair.n2} = ?`,
                        ans: val,
                        options: generateOptions(val),
                        type: 'basic'
                    };
                }
                
                state.history.push({...state.currentQ});
            }

            updateStatusDisplay();
            renderGame();
        }

        function undoLast() {
            if (state.history.length <= 1) return;
            state.history.pop();
            const prev = state.history[state.history.length - 1];
            state.currentQ = prev;
            state.qIndex--; 
            updateStatusDisplay();
            renderGame();
        }

        function updateStatusDisplay() {
            const display = document.getElementById('status-display');
            if (state.isTimerEnabled) {
                display.innerText = `第 ${state.qIndex} / ${QUESTIONS_PER_ROUND} 題 (計時中)`;
                display.style.color = "#E65100";
                display.style.borderColor = "#FFCC80";
                display.style.background = "#FFF3E0";
            } else {
                display.innerText = `第 ${state.qIndex} / ${QUESTIONS_PER_ROUND} 題`;
                display.style.color = "#555";
                display.style.borderColor = "#ccc";
                display.style.background = "#eee";
            }
        }

        function generateOptions(correctAnswer) {
            let opts = new Set();
            opts.add(correctAnswer);
            while(opts.size < 4) {
                let offset = Math.floor(Math.random() * 10) - 5; 
                let wrong = correctAnswer + offset;
                if (wrong > 0 && wrong !== correctAnswer) opts.add(wrong);
            }
            return Array.from(opts).sort(() => Math.random() - 0.5);
        }

        function renderGame() {
            const qArea = document.getElementById('question-area');
            const optArea = document.getElementById('options-area');
            const img = document.getElementById('game-img');
            const undoBtn = document.getElementById('btn-undo');
            const feedback = document.getElementById('feedback-area');

            img.src = IMAGES.normal;
            undoBtn.disabled = (state.qIndex <= 1);
            feedback.innerText = "";

            if (state.currentQ.type === 'story') {
                qArea.innerHTML = `<div class='story-text'>${state.currentQ.text}</div>`;
            } else {
                qArea.innerHTML = `<div class='question-box-basic'>${state.currentQ.text}</div>`;
            }

            optArea.innerHTML = "";
            state.currentQ.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optArea.appendChild(btn);
            });
        }

        function checkAnswer(selectedVal, btnElement) {
            const img = document.getElementById('game-img');
            const feedback = document.getElementById('feedback-area');

            if (selectedVal === state.currentQ.ans) {
                playSound('correct');
                btnElement.classList.add('correct-anim');
                img.src = IMAGES.happy;
                
                state.correctCount++;
                feedback.innerText = "答對了！";
                
                const btns = document.querySelectorAll('.option-btn');
                btns.forEach(b => b.disabled = true);
                
                setTimeout(() => nextQuestion(false), 1000);

            } else {
                playSound('wrong');
                btnElement.classList.add('wrong-anim');
                img.src = IMAGES.sad;
                feedback.innerText = "再試試看！";
                state.wrongCount++;
            }
        }

        function showReport() {
            showScreen('report-screen');
            document.getElementById('report-img').src = IMAGES.finish;
            
            document.getElementById('res-correct').innerText = state.correctCount + " 題";
            document.getElementById('res-wrong').innerText = state.wrongCount + " 次";

            const timeRow = document.getElementById('res-time-row');
            if (state.isTimerEnabled) {
                const totalSeconds = ((Date.now() - state.startTime) / 1000).toFixed(1);
                document.getElementById('res-time').innerText = totalSeconds + " 秒";
                timeRow.style.display = 'block';
            } else {
                timeRow.style.display = 'none';
            }
        }

    </script>
</body>
</html>
