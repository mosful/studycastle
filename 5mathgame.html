<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快樂火車數學大冒險 (5分鐘版)</title>
    <style>
        /* --- 1. 全域設定 --- */
        body {
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif;
            background-color: #E0F7FA;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            user-select: none;
        }

        /* --- 2. 遊戲主容器 --- */
        .game-container {
            background-color: #FFFFFF;
            width: 90%;
            max-width: 600px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            border: 6px solid #4DD0E1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 550px;
        }

        .content-wrapper {
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* --- 3. 標題與圖示 --- */
        h1 {
            color: #00838F;
            font-size: 2.2rem;
            margin: 10px 0;
            text-shadow: 1px 1px 0px #FFF;
        }
        
        .train-icon {
            font-size: 4.5rem;
            margin: 15px 0;
            display: inline-block;
            animation: trainMove 2s infinite ease-in-out;
        }

        /* --- 4. 按鈕樣式 --- */
        .btn {
            background-color: #FF7043;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 6px 0 #D84315;
            transition: transform 0.1s;
            width: 85%;
            max-width: 320px;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #D84315;
        }

        .btn-secondary {
            background-color: #26A69A;
            box-shadow: 0 6px 0 #00695C;
        }

        .btn-secondary:active {
            box-shadow: 0 0 0 #00695C;
        }

        /* --- 5. 遊戲畫面元素 --- */
        #game-screen, #result-screen {
            display: none;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            font-size: 1.3rem;
            color: #555;
            background: #E1F5FE;
            padding: 10px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .question-box {
            background-color: #FFF3E0;
            border: 3px dashed #FFAB91;
            padding: 25px;
            border-radius: 20px;
            font-size: 2rem;
            font-weight: bold;
            color: #D84315;
            margin: 10px 0 25px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        /* --- 6. 選項按鈕區 --- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background-color: #4FC3F7;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 20px;
            border: none;
            border-radius: 18px;
            box-shadow: 0 5px 0 #0277BD;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .correct-anim { background-color: #66BB6A !important; box-shadow: 0 5px 0 #2E7D32 !important; transform: scale(1.05); }
        .wrong-anim { background-color: #EF5350 !important; box-shadow: 0 5px 0 #C62828 !important; animation: shake 0.4s; }

        /* --- 7. 動畫 --- */
        @keyframes trainMove {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-5px) rotate(-5deg); }
            75% { transform: translateY(-5px) rotate(5deg); }
        }

        @keyframes shake {
            0% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } 100% { transform: translateX(0); }
        }

        /* --- 8. 底部規則提醒 --- */
        .rules-footer {
            margin-top: 20px;
            border-top: 2px solid #EEE;
            padding-top: 15px;
            font-size: 0.8rem;
            color: #90A4AE;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .question-box { font-size: 1.5rem; padding: 15px; }
            .options-grid { grid-template-columns: 1fr; }
            .option-btn { font-size: 1.6rem; padding: 15px; }
            .game-container { min-height: auto; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <audio id="sound-train" preload="auto" src="https://upload.wikimedia.org/wikipedia/commons/5/53/Steam_train_whistle_02.ogg"></audio>
        <audio id="sound-correct" preload="auto" src="https://upload.wikimedia.org/wikipedia/commons/3/3b/Bubble_pop_one.ogg"></audio>
        <audio id="sound-wrong" preload="auto" src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Buzzer_02.ogg"></audio>

        <div class="content-wrapper">
            <div id="start-screen">
                <div class="train-icon">🚂</div>
                <h1> 9是強 <br>數學大冒險</h1>
                <p style="font-size: 1.2rem; color: #666; margin-bottom: 30px;">
                    小小站長，準備好出發了嗎？<br>
                    <small>挑戰 5 分鐘拿高分！</small>
                </p>
                <button class="btn" onclick="startGame('normal')">🧮 運算挑戰 (一般)</button>
                <br>
                <button class="btn btn-secondary" onclick="startGame('story')">📖 應用題 (素養)</button>
            </div>

            <div id="game-screen">
                <div class="info-bar">
                    <span>⭐ 分數: <span id="score" style="color:#D84315;">0</span></span>
                    <span>⏱️ 時間: <span id="timer">300</span>s</span>
                </div>
                
                <div id="question-text" class="question-box">
                    題目準備中...
                </div>

                <div id="options-area" class="options-grid"></div>
            </div>

            <div id="result-screen">
                <div class="train-icon">🏁</div>
                <h1 id="final-msg">終點站到了！</h1>
                <p style="font-size: 1.3rem; margin: 20px;">
                    恭喜你完成了冒險！<br>
                    你的總分是：
                </p>
                <p style="font-size: 4rem; color:#D84315; font-weight:bold; margin: 0;">
                    <span id="final-score">0</span>
                </p>
                <br>
                <button class="btn" onclick="location.reload()">🔄 再玩一次</button>
            </div>
        </div>

        <div class="rules-footer">
            規則說明：1. 先乘除後加減，括號內先算。<br>
            2. 本遊戲運算過程與結果皆為正整數 (無負數)。<br>
            <span style="display:inline-block;margin-top:6px;color:#1565C0;">📱 支援 iPad / 平板、手機與電腦 ｜ 專為觸控操作最佳化</span>
        </div>

    </div>

    <script>
        // --- 變數與音效 ---
        // 修改點 3：timeLeft 預設變數其實在 startGame 會被覆蓋，但這裡也建議改一下
        let score = 0, timeLeft = 300, timerInterval, currentAnswer = 0, gameMode = 'normal', isAnswering = false;
        const sounds = {
            train: document.getElementById('sound-train'),
            correct: document.getElementById('sound-correct'),
            wrong: document.getElementById('sound-wrong')
        };

        function playSound(type) {
            try { if (sounds[type]) { sounds[type].currentTime = 0; sounds[type].play().catch(e => {}); } } catch(e) {}
        }

        // --- 題庫 (素養題) ---
        const storyQuestions = [
            { q: "火車有 8 節車廂，每節坐 40 人，下車 50 人後，剩幾人？", a: 270 },
            { q: "便當一個 80 元，買 3 個便當，付 500 元，要找回多少？", a: 260 },
            { q: "小明有 200 元，買每本 30 元的筆記本 5 本，剩多少錢？", a: 50 },
            { q: "門票一張 450 元，3 人同行共折 100 元，需付多少？", a: 1250 },
            { q: "24 顆蘋果平分給 6 人，小華吃掉 2 顆，他還剩幾顆？", a: 2 },
            { q: "一小時有 60 分鐘，火車開了 3 小時又 15 分鐘，共幾分鐘？", a: 195 },
            { q: "大座號是 35，小座號是 12，兩數相乘再減去 100 是多少？", a: 320 }
        ];

        // --- 流程控制 ---
        function startGame(mode) {
            gameMode = mode; 
            score = 0; 
            // 修改點 4：設定遊戲時間為 300 秒 (5分鐘)
            timeLeft = 300; 
            
            document.getElementById('score').innerText = score;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.querySelector('.rules-footer').style.display = 'none'; 
            playSound('train');

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if(timeLeft <= 10) document.getElementById('timer').style.color = 'red';
                else document.getElementById('timer').style.color = '#555';
                if (timeLeft <= 0) endGame();
            }, 1000);
            nextQuestion();
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.querySelector('.rules-footer').style.display = 'block';
            document.getElementById('final-score').innerText = score;
            if(score > 0) playSound('correct'); else playSound('train');
        }

        function nextQuestion() {
            isAnswering = false;
            document.getElementById('question-text').style.color = '#D84315';
            if (gameMode === 'story') generateStoryQuestion();
            else generateMathQuestion();
        }

        // --- 嚴格數學邏輯 (過程無負數) ---
        function calculateStep(a, op, b) {
            let res;
            if (op === '+') res = a + b;
            if (op === '-') res = a - b;
            if (op === '*') res = a * b;
            if (op === '/') { if (b === 0) return null; res = a / b; }
            if (!Number.isInteger(res) || res < 0) return null; // 確保整數且非負
            return res;
        }

        function generateMathQuestion() {
            let valid = false, questionText = "", answer = 0;
            while (!valid) {
                let n1 = getRandomInt(2, 20), n2 = getRandomInt(2, 20), n3 = getRandomInt(2, 20);
                let ops = ['+', '-', '*', '/'];
                let op1 = ops[Math.floor(Math.random() * 4)], op2 = ops[Math.floor(Math.random() * 4)];
                let type = Math.floor(Math.random() * 3);
                let step1, step2;

                if (type === 1) { // (A op B) op C
                    step1 = calculateStep(n1, op1, n2);
                    if (step1 !== null) {
                        step2 = calculateStep(step1, op2, n3);
                        if (step2 !== null && step2 < 500) {
                            valid = true; answer = step2;
                            questionText = `(${n1} ${toSymbol(op1)} ${n2}) ${toSymbol(op2)} ${n3} = ?`;
                        }
                    }
                } else if (type === 2) { // A op (B op C)
                    step1 = calculateStep(n2, op2, n3);
                    if (step1 !== null) {
                        step2 = calculateStep(n1, op1, step1);
                        if (step2 !== null && step2 < 500) {
                            valid = true; answer = step2;
                            questionText = `${n1} ${toSymbol(op1)} (${n2} ${toSymbol(op2)} ${n3}) = ?`;
                        }
                    }
                } else { // A op B op C
                    let op1_prio = (op1 === '*' || op1 === '/') ? 2 : 1;
                    let op2_prio = (op2 === '*' || op2 === '/') ? 2 : 1;
                    if (op2_prio > op1_prio) { // 先算後
                        step1 = calculateStep(n2, op2, n3);
                        if (step1 !== null) {
                            step2 = calculateStep(n1, op1, step1);
                            if (step2 !== null && step2 < 500) {
                                valid = true; answer = step2;
                                questionText = `${n1} ${toSymbol(op1)} ${n2} ${toSymbol(op2)} ${n3} = ?`;
                            }
                        }
                    } else { // 先算前
                        step1 = calculateStep(n1, op1, n2);
                        if (step1 !== null) {
                            step2 = calculateStep(step1, op2, n3);
                            if (step2 !== null && step2 < 500) {
                                valid = true; answer = step2;
                                questionText = `${n1} ${toSymbol(op1)} ${n2} ${toSymbol(op2)} ${n3} = ?`;
                            }
                        }
                    }
                }
            }
            renderUI(questionText, answer);
        }

        function generateStoryQuestion() {
            const qData = storyQuestions[Math.floor(Math.random() * storyQuestions.length)];
            renderUI(qData.q, qData.a);
        }

        function renderUI(qText, ans) {
            currentAnswer = ans;
            document.getElementById('question-text').innerText = qText;
            let options = [ans];
            while (options.length < 4) {
                let fake = ans + getRandomInt(-20, 20);
                if (fake >= 0 && !options.includes(fake)) options.push(fake);
            }
            options.sort(() => Math.random() - 0.5);
            const container = document.getElementById('options-area');
            container.innerHTML = "";
            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = (e) => checkAnswer(opt, e.target);
                container.appendChild(btn);
            });
        }

        function checkAnswer(playerAns, btnElem) {
            if (isAnswering) return;
            isAnswering = true;
            if (playerAns === currentAnswer) {
                score += 10; playSound('correct'); btnElem.classList.add('correct-anim');
                document.getElementById('question-text').innerHTML = "<span style='color:#2E7D32'>🎉 答對了！</span>";
            } else {
                timeLeft = Math.max(0, timeLeft - 5); playSound('wrong'); btnElem.classList.add('wrong-anim');
                document.getElementById('question-text').innerHTML = "<span style='color:#C62828'>❌ 哎呀，加油！</span>";
            }
            document.getElementById('score').innerText = score; document.getElementById('timer').innerText = timeLeft;
            setTimeout(() => { if (timeLeft > 0) nextQuestion(); }, 800);
        }

        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function toSymbol(op) { if (op === '*') return '×'; if (op === '/') return '÷'; return op; }
    </script>
</body>
</html>
