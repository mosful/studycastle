<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>單字王奇幻冒險 🔤 | 學習城堡生活英語</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
    <style>
        :root {
            --magic-purple: #7C3AED;
            --magic-deep: #4C1D95;
            --magic-card: #FFFFFF;
            --magic-pink: #EC4899;
            --magic-gold: #F59E0B;
            --magic-bg: #F5F3FF;
            --text-dark: #1F2937;
            --border-purple: #DDD6FE;
            --shadow-magic: 0 10px 30px rgba(124, 58, 237, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
        
        body {
            background-color: var(--magic-bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.08) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 16px 12px 60px;
            color: var(--text-dark);
            user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
        }

        /* --- 頂部導航列 --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 8px;
        }
        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: #FFF;
            border: 2px solid var(--magic-purple);
            border-radius: 20px;
            color: var(--magic-purple);
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 3px 0 #6D28D9;
            transition: all 0.15s ease;
        }
        .nav-btn:hover { background: #EDE9FE; transform: translateY(-2px); box-shadow: 0 5px 0 #6D28D9; }
        .nav-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #6D28D9; }
        .unit-badge {
            font-size: 0.85rem;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 16px;
            background: linear-gradient(135deg, #7C3AED, #EC4899);
            color: #FFF;
            box-shadow: 0 2px 8px rgba(124,58,237,0.3);
        }

        /* --- 主卡片 --- */
        .card {
            background: var(--magic-card);
            border: 3px solid var(--border-purple);
            border-radius: 26px;
            padding: 24px 20px;
            box-shadow: var(--shadow-magic);
            text-align: center;
        }

        .hero-icon { font-size: 4rem; margin-bottom: 8px; display: inline-block; animation: floatIcon 3s ease-in-out infinite; }
        @keyframes floatIcon { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

        h1 {
            font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
            font-size: clamp(1.8rem, 4.5vw, 2.4rem);
            font-weight: 800;
            color: var(--magic-deep);
            margin-bottom: 6px;
        }
        .sub-title { color: #6B7280; font-size: 0.95rem; margin-bottom: 22px; }

        /* 模式選擇卡片 */
        .mode-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; }
        .mode-btn {
            background: #FFF;
            border: 2px solid var(--border-purple);
            border-radius: 18px;
            padding: 16px 18px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.05);
        }
        .mode-btn:hover {
            border-color: var(--magic-purple);
            background: #F5F3FF;
            transform: translateY(-2px);
            box-shadow: 0 5px 0 #6D28D9;
        }
        .mode-btn .m-emoji { font-size: 2.2rem; }
        .mode-btn .m-title { font-size: 1.15rem; font-weight: 800; color: var(--magic-deep); margin-bottom: 3px; }
        .mode-btn .m-desc { font-size: 0.85rem; color: #6B7280; line-height: 1.4; }

        /* --- 遊戲進行畫面 --- */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px dashed var(--border-purple);
        }
        .hud-stat { font-weight: 700; font-size: 0.95rem; color: #4B5563; }
        .hud-score { color: var(--magic-gold); font-size: 1.25rem; font-family: 'Fredoka', sans-serif; font-weight: 800; }

        /* 圖像與發音大按鈕 */
        .vocab-hero-box {
            background: #F5F3FF;
            border: 2px solid var(--border-purple);
            border-radius: 20px;
            padding: 20px;
            margin: 12px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .vocab-emoji { font-size: 4rem; }
        .vocab-zh-prompt { font-size: 1.4rem; font-weight: 800; color: var(--magic-deep); }
        .btn-speak {
            background: linear-gradient(135deg, #7C3AED, #9333EA);
            border: none;
            border-radius: 50px;
            color: #FFF;
            font-size: 1rem;
            font-weight: 700;
            padding: 8px 18px;
            cursor: pointer;
            box-shadow: 0 3px 0 #6D28D9;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }
        .btn-speak:hover { transform: scale(1.05); }
        .btn-speak:active { transform: translateY(2px); }

        /* 字母拼字卡片容器 */
        .spell-target-box {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 14px 0 16px;
            min-height: 52px;
        }
        .letter-slot {
            width: 44px;
            height: 48px;
            border-radius: 10px;
            border: 2px dashed #A78BFA;
            background: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--magic-deep);
        }
        .letter-slot.filled { border-style: solid; background: #EDE9FE; border-color: var(--magic-purple); }

        .letter-pool {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        .letter-chip {
            width: 46px;
            height: 50px;
            border-radius: 12px;
            border: 2px solid var(--magic-purple);
            background: #FFF;
            color: var(--magic-deep);
            font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 3px 0 #6D28D9;
            transition: all 0.15s;
        }
        .letter-chip:hover { background: #EDE9FE; transform: translateY(-2px); }
        .letter-chip:active { transform: translateY(2px); }
        .letter-chip.used { opacity: 0.3; pointer-events: none; }

        /* 選項按鈕格 */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .opt-btn {
            background: #FFF;
            border: 2px solid var(--border-purple);
            border-radius: 16px;
            padding: 14px 10px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
            box-shadow: 0 3px 0 #C4B5FD;
            transition: all 0.15s;
            touch-action: manipulation;
        }
        .opt-btn:hover { background: #F5F3FF; border-color: var(--magic-purple); transform: translateY(-2px); }
        .opt-btn:active { transform: translateY(2px); }
        .opt-btn.correct { background: #D1FAE5 !important; border-color: #10B981 !important; color: #065F46 !important; box-shadow: 0 0 10px rgba(16,185,129,0.4) !important; }
        .opt-btn.wrong { background: #FEE2E2 !important; border-color: #EF4444 !important; color: #991B1B !important; }

        /* 詳解面板 */
        .explanation-card {
            display: none;
            background: #F0FDF4;
            border: 2px solid #86EFAC;
            border-radius: 14px;
            padding: 14px 16px;
            margin-top: 14px;
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #065F46;
        }
        .explanation-card.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }

        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #FFF;
            background: linear-gradient(135deg, #7C3AED, #9333EA);
            cursor: pointer;
            box-shadow: 0 4px 0 #6D28D9;
            transition: all 0.15s;
        }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #6D28D9; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 1px 0 #6D28D9; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 頂部導航列 -->
    <div class="top-bar">
        <a href="portal.html" class="nav-btn">
            <span>🏰</span>
            <span>返回學習城堡</span>
        </a>
        <span class="unit-badge">🔤 英語天地・生活單字</span>
    </div>

    <!-- 主卡片容器 -->
    <div class="card">
        
        <!-- 1. 主選單 -->
        <div id="screen-menu">
            <span class="hero-icon">🧙‍♂️</span>
            <h1>單字王奇幻冒險</h1>
            <p class="sub-title">看圖記憶・真人發音・趣味拼字 ｜ 一起快樂學英語！</p>

            <div class="mode-grid">
                <button class="mode-btn" onclick="startQuiz('picture')">
                    <span class="m-emoji">🖼️</span>
                    <div>
                        <div class="m-title">模式一：看圖與中文選單字</div>
                        <div class="m-desc">圖像化記憶常見生活物品、動物與美食英語名稱！</div>
                    </div>
                </button>
                <button class="mode-btn" onclick="startQuiz('listening')">
                    <span class="m-emoji">🎧</span>
                    <div>
                        <div class="m-title">模式二：聽音辨字挑戰</div>
                        <div class="m-desc">聆聽純正英語發音，訓練英語聽力敏銳度與單字對應！</div>
                    </div>
                </button>
                <button class="mode-btn" onclick="startQuiz('spelling')">
                    <span class="m-emoji">🧩</span>
                    <div>
                        <div class="m-title">模式三：字母拼字大冒險</div>
                        <div class="m-desc">打散字母順序，親自動手拼出完整的英文單字！</div>
                    </div>
                </button>
            </div>
            
            <div style="font-size:0.8rem; color:#9CA3AF;">📱 支援 iPad / 平板、手機與電腦 ｜ 支援語音朗讀</div>
        </div>

        <!-- 2. 測驗進行畫面 -->
        <div id="screen-quiz" class="hidden">
            <div class="hud-bar">
                <div class="hud-stat">第 <span id="q-curr">1</span> / <span id="q-total">8</span> 題</div>
                <div class="hud-stat">⭐ 得分：<span class="hud-score" id="score-display">0</span></div>
            </div>

            <div id="quiz-content-area"></div>

            <div id="interactive-area"></div>

            <div class="explanation-card" id="explanation-box"></div>

            <button class="btn-action hidden" id="btn-next" onclick="nextQuestion()" style="margin-top:14px;">下一題 ➜</button>
        </div>

        <!-- 3. 結算畫面 -->
        <div id="screen-result" class="hidden">
            <span class="hero-icon" id="res-icon">🏆</span>
            <h1 id="res-title">恭喜通關！</h1>
            <p class="sub-title" id="res-subtitle">你是最棒的英語單字小達人！</p>
            
            <div style="background:#F5F3FF; border:2px solid var(--border-purple); border-radius:18px; padding:20px; margin:16px 0;">
                <div>本次冒險得分</div>
                <div style="font-size:3.5rem; font-weight:900; color:var(--magic-gold); font-family:'Fredoka',sans-serif;" id="final-score">100</div>
                <div id="res-detail" style="font-size:0.95rem; color:#6B7280; margin-top:6px;">答對 8 題 / 共 8 題</div>
            </div>

            <div style="display:flex; gap:10px;">
                <button class="btn-action" style="background:#6B7280; box-shadow:0 4px 0 #4B5563;" onclick="showMenu()">📋 回選單</button>
                <button class="btn-action" onclick="restartQuiz()">🔄 再玩一次</button>
            </div>
        </div>

    </div>
</div>

<script>
// 音效合成引擎
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        gainNode.gain.setValueAtTime(0.25, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(180, now + 0.15);
        gainNode.gain.setValueAtTime(0.25, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
    }
}

// 語音朗讀函式
function speakWord(word) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(word);
        utter.lang = 'en-US';
        utter.rate = 0.85;
        window.speechSynthesis.speak(utter);
    }
}

// 單字資料庫
const VOCAB_DB = [
    { word: "apple", zh: "蘋果", emoji: "🍎", phonics: "[ˈæpl]", sample: "An apple a day keeps the doctor away." },
    { word: "banana", zh: "香蕉", emoji: "🍌", phonics: "[bəˈnænə]", sample: "Monkeys like to eat sweet bananas." },
    { word: "cat", zh: "貓咪", emoji: "🐱", phonics: "[kæt]", sample: "The cute cat is sleeping on the sofa." },
    { word: "dog", zh: "狗狗", emoji: "🐶", phonics: "[dɔːɡ]", sample: "The faithful dog wags its tail happily." },
    { word: "elephant", zh: "大象", emoji: "🐘", phonics: "[ˈelɪfənt]", sample: "The elephant has a very long trunk." },
    { word: "fish", zh: "魚", emoji: "🐟", phonics: "[fɪʃ]", sample: "Fish can swim fast in the ocean." },
    { word: "guitar", zh: "吉他", emoji: "🎸", phonics: "[ɡɪˈtɑːr]", sample: "He plays the guitar every evening." },
    { word: "house", zh: "房子", emoji: "🏠", phonics: "[haʊs]", sample: "We have a warm and cozy house." },
    { word: "ice cream", zh: "冰淇淋", emoji: "🍦", phonics: "[ˈaɪs kriːm]", sample: "I love eating chocolate ice cream." },
    { word: "juice", zh: "果汁", emoji: "🧃", phonics: "[dʒuːs]", sample: "A glass of fresh orange juice." },
    { word: "kite", zh: "風箏", emoji: "🪁", phonics: "[kaɪt]", sample: "Children fly colorful kites in the park." },
    { word: "lion", zh: "獅子", emoji: "🦁", phonics: "[ˈlaɪən]", sample: "The lion is the king of the jungle." },
    { word: "monkey", zh: "猴子", emoji: "🐵", phonics: "[ˈmʌŋki]", sample: "The monkey is jumping between trees." },
    { word: "orange", zh: "柳橙", emoji: "🍊", phonics: "[ˈɔːrɪndʒ]", sample: "Oranges are rich in vitamin C." },
    { word: "pencil", zh: "鉛筆", emoji: "✏️", phonics: "[ˈpensl]", sample: "Write your name with a pencil." },
    { word: "rabbit", zh: "兔子", emoji: "🐰", phonics: "[ˈræbɪt]", sample: "The white rabbit has long ears." },
    { word: "sun", zh: "太陽", emoji: "☀️", phonics: "[sʌn]", sample: "The bright sun shines in the sky." },
    { word: "tiger", zh: "老虎", emoji: "🐯", phonics: "[ˈtaɪɡər]", sample: "The tiger has powerful orange stripes." },
    { word: "umbrella", zh: "雨傘", emoji: "☂️", phonics: "[ʌmˈbrelə]", sample: "Take an umbrella on rainy days." },
    { word: "water", zh: "水", emoji: "💧", phonics: "[ˈwɔːtər]", sample: "Remember to drink enough water every day." }
];

let currentMode = 'picture';
let currentList = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let currentSpelled = [];

function showMenu() {
    document.getElementById('screen-menu').classList.remove('hidden');
    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.add('hidden');
}

function startQuiz(mode) {
    currentMode = mode;
    currentList = [...VOCAB_DB].sort(() => Math.random() - 0.5).slice(0, 8);
    currentIndex = 0;
    score = 0;
    
    document.getElementById('screen-menu').classList.add('hidden');
    document.getElementById('screen-quiz').classList.remove('hidden');
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('q-total').textContent = currentList.length;
    
    loadQuestion();
}

function loadQuestion() {
    answered = false;
    currentSpelled = [];
    document.getElementById('btn-next').classList.add('hidden');
    document.getElementById('explanation-box').classList.remove('show');
    document.getElementById('q-curr').textContent = currentIndex + 1;
    document.getElementById('score-display').textContent = score;

    const item = currentList[currentIndex];
    const contentArea = document.getElementById('quiz-content-area');
    const interactiveArea = document.getElementById('interactive-area');

    if (currentMode === 'picture') {
        contentArea.innerHTML = `
            <div class="vocab-hero-box">
                <span class="vocab-emoji">${item.emoji}</span>
                <span class="vocab-zh-prompt">${item.zh}</span>
                <button class="btn-speak" onclick="speakWord('${item.word}')">🔊 聽提示發音</button>
            </div>
            <div style="font-size:1.05rem; font-weight:700; color:#4B5563; margin-bottom:12px;">請選出對應的英文單字：</div>
        `;
        renderChoiceButtons(item);
    } else if (currentMode === 'listening') {
        contentArea.innerHTML = `
            <div class="vocab-hero-box">
                <span class="vocab-emoji">🎧</span>
                <button class="btn-speak" style="font-size:1.2rem; padding:12px 26px;" onclick="speakWord('${item.word}')">🔊 點擊播放英語發音</button>
                <div style="font-size:0.9rem; color:#6B7280;">請仔細聆聽並選出正確的中文意思與單字</div>
            </div>
        `;
        speakWord(item.word);
        renderChoiceButtons(item);
    } else if (currentMode === 'spelling') {
        contentArea.innerHTML = `
            <div class="vocab-hero-box">
                <span class="vocab-emoji">${item.emoji}</span>
                <span class="vocab-zh-prompt">${item.zh}</span>
                <button class="btn-speak" onclick="speakWord('${item.word}')">🔊 聽正確發音</button>
            </div>
            <div style="font-size:1rem; font-weight:700; color:#4B5563;">請依序點擊字母完成單字拼寫：</div>
        `;
        renderSpellingBoard(item);
    }
}

function renderChoiceButtons(item) {
    const otherWords = VOCAB_DB.filter(x => x.word !== item.word).sort(() => Math.random() - 0.5).slice(0, 3);
    const options = [item, ...otherWords].sort(() => Math.random() - 0.5);
    const container = document.getElementById('interactive-area');

    container.innerHTML = `<div class="options-grid">
        ${options.map(opt => `
            <button class="opt-btn" onclick="checkChoice('${opt.word}', this)">
                ${currentMode === 'listening' ? `${opt.emoji} ${opt.word} (${opt.zh})` : opt.word}
            </button>
        `).join('')}
    </div>`;
}

function checkChoice(selectedWord, btn) {
    if (answered) return;
    answered = true;

    const item = currentList[currentIndex];
    const isRight = (selectedWord === item.word);
    const expBox = document.getElementById('explanation-box');

    speakWord(item.word);

    if (isRight) {
        playSound('correct');
        score += 15;
        btn.classList.add('correct');
    } else {
        playSound('wrong');
        btn.classList.add('wrong');
        document.querySelectorAll('.opt-btn').forEach(b => {
            if (b.textContent.includes(item.word)) b.classList.add('correct');
        });
    }

    document.getElementById('score-display').textContent = score;

    expBox.innerHTML = `
        <div style="font-weight:bold; font-size:1.05rem; margin-bottom:4px; color:${isRight?'#065F46':'#991B1B'};">
            ${isRight ? '✓ Great Job! 答對了！' : '✕ Keep Trying! 正確答案是：' + item.word}
        </div>
        <div>🔤 <b>單字：</b>${item.word} ${item.phonics} (${item.zh})</div>
        <div>📖 <b>常用例句：</b>${item.sample}</div>
    `;
    expBox.classList.add('show');

    document.getElementById('btn-next').classList.remove('hidden');
}

function renderSpellingBoard(item) {
    const cleanLetters = item.word.replace(/\s+/g, '').toLowerCase().split('');
    const shuffled = [...cleanLetters].sort(() => Math.random() - 0.5);
    const container = document.getElementById('interactive-area');

    container.innerHTML = `
        <div class="spell-target-box" id="spell-slots">
            ${cleanLetters.map(() => `<div class="letter-slot"></div>`).join('')}
        </div>
        <div class="letter-pool" id="letter-chips">
            ${shuffled.map((letter, idx) => `
                <button class="letter-chip" id="chip-${idx}" onclick="pickLetter('${letter}', 'chip-${idx}')">${letter}</button>
            `).join('')}
        </div>
        <button class="nav-btn" style="border-color:#EF4444; color:#DC2626;" onclick="resetSpelling()">🔄 清除重拼</button>
    `;
}

function pickLetter(letter, chipId) {
    if (answered) return;
    const item = currentList[currentIndex];
    const targetLetters = item.word.replace(/\s+/g, '').toLowerCase().split('');

    currentSpelled.push({ letter, chipId });
    document.getElementById(chipId).classList.add('used');

    updateSpellSlots();

    if (currentSpelled.length === targetLetters.length) {
        checkSpellingResult();
    }
}

function updateSpellSlots() {
    const slots = document.querySelectorAll('.letter-slot');
    slots.forEach((slot, idx) => {
        if (idx < currentSpelled.length) {
            slot.textContent = currentSpelled[idx].letter;
            slot.classList.add('filled');
        } else {
            slot.textContent = '';
            slot.classList.remove('filled');
        }
    });
}

function resetSpelling() {
    if (answered) return;
    currentSpelled.forEach(item => {
        const chip = document.getElementById(item.chipId);
        if (chip) chip.classList.remove('used');
    });
    currentSpelled = [];
    updateSpellSlots();
}

function checkSpellingResult() {
    answered = true;
    const item = currentList[currentIndex];
    const targetWord = item.word.replace(/\s+/g, '').toLowerCase();
    const userWord = currentSpelled.map(x => x.letter).join('');
    const isRight = (userWord === targetWord);
    const expBox = document.getElementById('explanation-box');

    speakWord(item.word);

    if (isRight) {
        playSound('correct');
        score += 15;
    } else {
        playSound('wrong');
    }

    document.getElementById('score-display').textContent = score;

    expBox.innerHTML = `
        <div style="font-weight:bold; font-size:1.05rem; margin-bottom:4px; color:${isRight?'#065F46':'#991B1B'};">
            ${isRight ? '✓ Bingo! 拼字完全正確！' : '✕ 正確拼法為：' + item.word}
        </div>
        <div>🔤 <b>單字：</b>${item.word} ${item.phonics} (${item.zh})</div>
        <div>📖 <b>常用例句：</b>${item.sample}</div>
    `;
    expBox.classList.add('show');

    document.getElementById('btn-next').classList.remove('hidden');
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex >= currentList.length) {
        showResult();
    } else {
        loadQuestion();
    }
}

function showResult() {
    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.remove('hidden');
    document.getElementById('final-score').textContent = score;

    const maxScore = currentList.length * 15;
    const correctCount = Math.round(score / 15);
    document.getElementById('res-detail').textContent = `答對 ${correctCount} 題 / 共 ${currentList.length} 題`;

    if (score >= maxScore * 0.8) {
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        document.getElementById('res-icon').textContent = '🌟';
        document.getElementById('res-title').textContent = '英語單字大冒險王！';
        document.getElementById('res-subtitle').textContent = '發音與單字記憶一把罩，榮獲單字王勳章！';
    } else {
        document.getElementById('res-icon').textContent = '🔤';
        document.getElementById('res-title').textContent = '冒險順利完成！';
        document.getElementById('res-subtitle').textContent = '多聽多開口練習，英文一定會越來越棒！';
    }
}

function restartQuiz() {
    startQuiz(currentMode);
}
</script>
</body>
</html>
